unresolved_findings:
  - id: FIND-CVF101-02
    severity: low-medium
    owner: reviewer
    summary: >-
      accessible_bytes semantics are documented as "reachable bytes from scanline0" but the math
      (packed_row_region_offset/packed_row_fits) and production treat it as an extent measured from
      the LOWEST ADDRESSED byte (== ppbBufferStart). Positive pitch: identical. Negative pitch:
      differs, and production passes Lock2DSize's pcbBufferLength (measured from ppbBufferStart), so
      production is self-consistent only because buffer_start equals the lowest addressed byte for a
      full frame. A caller implementing the documented field meaning literally under negative pitch
      would be under-permissive. Not demonstrated as a live production failure; requires reviewer
      adjudication (clarify the header/spec wording or normalize the semantics).
    status: awaiting_review
  - id: FIND-CVF101-01
    severity: high
    owner: developer
    summary: >-
      decode_planar_420 allocates a cv::Mat with (luma_rows + chroma_rows) rows but writes the V
      plane at row luma_rows + chroma_rows + row, which is out of bounds; OpenCV ptr() throws
      (-215) and the seam maps it to camera_io/capture_failed. i420 (7) and yv12 (8) with positive
      pitch therefore always fail. Pre-existing in HEAD copy_planar_rows (not introduced by CVF-101),
      masked previously because no test exercised i420/yv12.
    evidence:
      - ".ai/reports/CVF-101-test-verify.yaml (pending) and controller repro"
      - "repro: planar cv::Mat rows=6 but memcpy to ptr(6+row) throws mat.inl.hpp:701 (-215)"
    status: closed
    resolution: >-
      Fixed in src/camera/uvc_windows/uvc_frame_convert.cpp decode_planar_420 (canonical 3H/2
      planar buffer with half-width packed chroma). Independently re-verified 752/752 assertions.
