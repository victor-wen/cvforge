      Amendment (2026-09-15, owner: test-engineer): the nested-logging duplicate-key anchor
      in tests/unit/cvf004_config_test.cpp did not match the fixture text (anchor
      '"max_files": 5,' versus the fixture's '"max_files": 5'); the anchor was corrected
      to the exact fixture text and the duplicate pair is injected by the replacement.
      Its previous sha256 was 35467a4b0fded08d6661ebd2b324b3c0bc9016089b97ca17a0d4fb61cd32a66e;
      the new sha256 is f0bdfc16ce5a5bf2862d997a5b8ef53ffac98c0a2eff54aacf1a868aed7cf117.
      No assertion was removed, skipped, or weakened. Fresh evidence: 68/68 CVF-004 ctest
      tests passed and 203/203 tests passed in the full wsl-gcc-debug preset.
      Verify-phase update (2026-09-15, owner: test-engineer): added the brief's explicit
      "frame_rate just above 0" boundary probe to tests/unit/cvf004_config_test.cpp and to
      the capture-overrides boundary case in tests/unit/cvf004_recipe_test.cpp. No assertion
      was removed, skipped, or weakened. Previous sha256 values: cvf004_config_test.cpp
      f0bdfc16ce5a5bf2862d997a5b8ef53ffac98c0a2eff54aacf1a868aed7cf117 and
      cvf004_recipe_test.cpp bb9d61d8221020dd043465ab05849c3d460071b86e36e6323fe207c3de6ad09f;
      the new values are recorded above.
      Amendment 2 (2026-09-15, owner: test-engineer): TV-2. The holder concurrency case
      (tests/unit/cvf004_holder_test.cpp) had an intermittent liveness failure under
      ctest --preset wsl-gcc-asan: the writer could finish all 200 publish rounds before
      the reader threads were first scheduled, so CHECK(observations.load() > 0) saw 0.
      The test now synchronizes deterministically: readers signal readiness and the writer
      waits (bounded spin, 30 s timeout) until all three readers are scheduled and at
      least three observations have happened before the first publish, recording success
      in concurrency_established; the partial/mixed-catalog invariant assertions
      (violations == 0) and observation liveness are unchanged and no assertion was
      removed, skipped, disabled, or weakened. Its previous sha256 was
      b19baa48deb34e854e3244eaafb83a4ad5df35a2dd9e78f12d7bf059b35d23a9;
      the new sha256 is 7c4cd52c2ad7f5bf7acdcb9b0b27d628b1cb20950414c67d15beef43445dd465.
      Fresh evidence: clang-format --dry-run --Werror exit 0, wsl-gcc-debug ctest 204/204
      passed, wsl-gcc-asan ctest 204/204 passed, and 50/50 --repeat until-fail:50 runs of
      the holder concurrency test passed under ASan (all exit codes 0).
      Amendment 3 (2026-09-15, owner: test-engineer): CVF-006 backend schema extension. The
      B2 "unsupported backend" case is now build-mode aware: with
      CVFORWIN_TEST_BACKENDS_ENABLED defined and nonzero, only {v4l2, UVC, ""} are rejected
