    notes: >-
      Independent black-box tests authored by test-engineer for CVF-004 (strict global
      config, versioned recipes, immutable catalog, atomic holder) before implementation
      existed. Author-phase evidence: .ai/reports/CVF-004-test-red.yaml. Tests are
      Catch2 v3 / C++20, deterministic, and hardware-free; config and recipe fixtures are
      created in per-test temporary directories at run time, so no fixture files are
      checked in. The holder concurrency case is bounded (3 readers, 200 publish rounds
