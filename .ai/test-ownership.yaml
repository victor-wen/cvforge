      Amendment (2026-09-15, owner: test-engineer): A6. The save_request() helper passed
      std::string temporaries into the frozen CaptureSaveRequest string_view identifier
      fields, so those views dangled once the helper returned (undefined behaviour flagged
      by the developer; the frozen string_view interface is correct). It now returns a
      SaveRequestHolder that owns both identifier strings and builds the request from that
      storage, with an lvalue-qualified request() accessor (the rvalue overload is deleted
      so the dangling pattern cannot return); every save() call site uses a named holder.
      No assertion, coverage, or spec expectation was changed. Previous sha256 values:
