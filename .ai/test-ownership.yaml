      Independent black-box tests authored by test-engineer for CVF-005 (diagnostics
      with rotating file sink, synchronous C callback, warning flags; managed capture
      persistence and retention) before implementation existed. Author-phase evidence:
      .ai/reports/CVF-005-test-red.yaml. Tests are Catch2 v3 / C++20, deterministic, and
      hardware-free: file-system cases use per-test temporary directories under the system
      temp root, explicit last_write_time values, tiny 2x2..5x3 BGR8 PNG frames, and no
      sleeps; the two symlink cases are POSIX-only (#ifndef _WIN32). Red evidence at
      author time: all seven files fail the documented per-file g++ -fsyntax-only check
      because core/warnings.h, src/diagnostics/, and src/artifacts/ do not exist yet, and
      the 17xx/18xx error-code enumerators are absent from core/error.h. Hashes are not to
      be updated by anyone other than the test owner; a mismatch at verify time is an
      independence violation.
      Amendment (2026-09-15, owner: test-engineer): A6. The save_request() helper passed
      std::string temporaries into the frozen CaptureSaveRequest string_view identifier
      fields, so those views dangled once the helper returned (undefined behaviour flagged
      by the developer; the frozen string_view interface is correct). It now returns a
      SaveRequestHolder that owns both identifier strings and builds the request from that
      storage, with an lvalue-qualified request() accessor (the rvalue overload is deleted
      so the dangling pattern cannot return); every save() call site uses a named holder.
      No assertion, coverage, or spec expectation was changed. Previous sha256 values:
      cvf005_test_support.h 07abf0edce77e3d4b3ee0a7b5a0e9a78c63af1680892e1991bc589bc9cf98124
      and cvf005_capture_store_test.cpp 392b0d3b5b8689b5a4689f111b6d606a005997a473f70ddafcee1713f24daa66;
      the new values are recorded above. Fresh evidence: clang-format --dry-run --Werror
      exit 0 on all seven files; all seven TUs pass the real-header g++ -fsyntax-only
      check with exit 0; the SaveRequestHolder lifetime check built and ran clean under
      AddressSanitizer (exit 0); the five unchanged files re-hash to their manifest values.
      Amendment evidence: .ai/reports/CVF-005-test-red-amendment.yaml.
      Amendment 2 (2026-09-15, owner: test-engineer): TD-1 and TD-2 from the developer's
      full run. TD-1: the B4 rotation case configured Diagnostics with max_file_bytes=128,
      below the frozen 1024 minimum enforced by B1, so create() was rejected; it now uses
      1024 with a 96-byte payload per entry (40 entries, well over 1024 bytes) so rotation
      is still genuinely exercised, keeping the <= max_files bound for max_files=2 and 1.
      TD-2: the both-empty-identifier case expected the double underscore
      "_unnamed__unnamed_", but the frozen single-underscore join yields
      "_unnamed_unnamed_0.png"; the expectation now pins that exact suffix and additionally
      rejects a double underscore. No assertion was weakened, skipped, or removed and no
      coverage was reduced. Previous sha256 values: cvf005_diagnostics_logging_test.cpp
