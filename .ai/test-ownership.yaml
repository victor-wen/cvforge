      Windows CRLF portability fix (2026-09-19, owner: test-engineer; report
      .ai/reports/CVF-108-crlf-fix.yaml): CI run 35442730937 at commit 7d3e3fe
      failed the single independent case OB-4 on the Windows runner because the
      checkout used CRLF line endings. extract_abi_version_macros() consumed
      lines with istringstream/getline and matched each whole line with a regex
      ending in "(.*)$"; a line left with a trailing '\r' cannot be consumed by
      ECMAScript '.' and regex_match requires the whole line, so every line
      failed to match and the macro list came back empty. A shared
      strip_line_ending() helper was added and split_lines() now routes every
      line through it; extract_abi_version_macros() and parse_def_exports() --
      the only other getline-based line parse -- now consume split_lines().
      The rest of the file was audited: line_spans() and trim() already removed
      a trailing '\r', and every other regex (version headings,
      extract_cmake_project_version, find_semver_tokens, find_cvforwin_versions,
      extract_json_version_fields, and the LICENSES phrase) is unanchored and
      needs no change. A detection control test case ("CVF-108 platform control:
      CRLF line endings are normalized for every line-based parse") feeds a
      synthetic CRLF block to split_lines(), extract_abi_version_macros(), and
      parse_def_exports(), requires the result to equal the LF result, and
      reproduces the pre-fix un-normalized path, which must return empty on
      CRLF; it therefore fails if the normalization is removed. No assertion was
      removed, weakened, disabled, or skipped; the suite gained one case and is
