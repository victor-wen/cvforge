      fixed +/-3-line window of a historical marker, so a stale current-release
      mention that merely sat next to a genuine historical mention was wrongly
      exempted. The exemption is now scoped to the reference's own logical unit --
      the containing sentence, list item, or table row -- and a list item or
      sentence that is the direct body of a version heading owns that heading as
      its changelog-entry unit; the historical marker must be in that same unit.
      find_cvforwin_versions() now records the match position. Two explicit
      detection controls were added and pass: (a) a stale current-release mention
      adjacent to, but in a different unit from, a genuine historical mention is
      now REPORTED (a prior-release list item under its 1.0.0 heading is exempt,
      while the next line "Download cvforwin-1.0.0.zip as the current release" is
      reported), plus same-line-different-sentence and table-row controls; and (b)
      a genuine historical mention (a prior-release changelog entry and a
      "previous release" sentence) is NOT reported. No existing assertion was
      removed, weakened, disabled, or skipped; the suite is strictly stronger.
