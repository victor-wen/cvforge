      Amendment (2026-09-19, owner: test-engineer; report
      .ai/reports/CVF-003-test-amendment.yaml): FR-029 adds the compiled
      template.match algorithm, so a successful register_compiled_algorithms()
      publishes two keys, not one. The two hash-pinned B2 registry cases in
      tests/unit/cvf003_registry_test.cpp asserted a hard-coded registry.size() == 1u
      (lines 161 and 182) and therefore contradicted FR-029; they now assert the exact
      registered set: registry.size() == 2, the order-independent keys() set
      {example.threshold, template.match}, and find() on each key returning a non-null
      instance whose key() equals that key. The second-registration negative case keeps
      its duplicate-key failure and original-pointer retention assertions and now also
      pins the two-key set. No case was deleted and no assertion was removed, skipped,
      disabled, or weakened; the assertions are strictly stronger than the old
      hard-coded count (they pin the exact set rather than a count). Its previous
      sha256 was d43c2ec1b75848e3bcfb8d2b7dc09cd67234f3a8072975bfc385fee8c2186937; the
      new sha256 is recorded above. Fresh evidence: clang-format --dry-run --Werror
      exit 0; wsl-gcc-debug configure/build exit 0 and ctest 447/447 passed (exit 0);
      wsl-gcc-asan configure/build exit 0 and ctest 447/447 passed (exit 0); focused
      ctest -R CVF-003 37/37 passed (exit 0). The other three CVF-003 files re-hash to
      their recorded manifest values.
