summary: >-
  B-1 is RESOLVED. SaveWorker::wait_until now propagates a deadline expiry to the target job:
  an executing target is inserted into a private cancelled_ids_ set and execute() rechecks it
  under mutex_ after write_temp and before commit, discarding the temporary and returning
  SaveState::cancelled; a queued target is simply dropped and never executes
  (save_worker.cpp:76-105, :154-167). The wait timeout path returns a cancelled outcome with an
  empty path (:82-84), the runtime only sets save_committed/saved_path on completed
  (context.cpp:491-501) and publishes image_path only from that path (:537-539), and a later
  wait can never surface the cancelled job's entry (take() returns only the exact target,
  :52-58), so no final path is ever reported for a cancelled job. The one-executing/one-queued
  bound and the deadlock-free drain are unchanged. The developer regression test
  (tests/unit/test_artifact_save_worker.cpp:344-374) blocks a sink past a 100 ms wait, releases
  it, drains, and asserts commit_calls()==0, discard_calls()>=1, no published file, no
  temporary file; without the fix execute() committed unconditionally, so the test fails
  deterministically (commit/publish/discard assertions). The five independent CVF-104 files
  remain as recorded in .ai/test-ownership.yaml, contain no SKIP/MAYFAIL/DISABLED, and are
  compatible with the new cancellation semantics (the pinned timeout tests at
  cvf104_save_worker_test.cpp:131-154 and :225-248 only require state != completed + empty
  path + outstanding()==0, which discard satisfies; the cancel_pending test at :160-182 keeps
  the executing job publishing, because cancel_pending still cancels only the queued job,
  exactly as frozen). One inherent rename-boundary race remains and was explicitly accepted in
  the B-1 required_fix: if cancel_target arrives after execute() has already passed the
  pre-commit check but commit() is in flight, the file may still be published; the caller has
  already received a cancelled outcome with an empty path, so no path is ever reported, and the
  final file is a normal committed artifact. Remaining findings are informational/low and do
  not block. No Windows or hardware claim is made.

blocking_findings: []

resolved_findings:
  - id: B-1
    status: RESOLVED
    severity_was: high
    file: src/artifacts/save_worker.cpp
    proof:
      - "wait_until timeout: :76-85, cancel_target(target) at :81 before returning a cancelled outcome with the default (empty) path :82-84."
      - "cancel_target: :89-102 marks an executing target in cancelled_ids_ :94-96 and drops a queued target :97-101 so it never executes."
      - "execute(): write_temp :147, cancellation recheck under mutex_ :154-158, discard(temp)+SaveState::cancelled :159-165, sink_.commit() only at :167 after passing the check."
      - "worker_loop clears the per-id flag and records the outcome :204-207; take() prunes older entries :59-61."
      - "runtime: only completed sets save_committed/saved_path (context.cpp:493-495); any other state sets save_failed and cancel_pending (context.cpp:496-501); image_path is published only from the decision plus saved_path (context.cpp:537-539)."
      - "regression test: tests/unit/test_artifact_save_worker.cpp:344-374 (BlockingWriteSink :116-221); commit_calls()==0 :366, discard_calls()>=1 :367, no published.png :369, no temporary :370-371. Without the fix execute() committed, so the assertions fail deterministically after drain() has joined the executing job."
    accepted_residual: >-
      The pre-commit check is the strongest guarantee the frozen ArtifactSink interface allows:
      a commit already in flight when the timeout lands may still finish. That boundary race is
      the same class as the pinned committed-at-expiry case
      (cvf104_finalization_test.cpp:477-498), the caller never receives a path for it, and no
      final path is ever reported for a cancelled job.

non_blocking_findings:
  - id: NB-1
    severity: low
    status: largely resolved
    file: src/artifacts/save_worker.cpp
    location: "take() prune at :59-61; timeout return :76-85; completed_ insert :207"
    issue: >-
      Previously the outcome of a timed-out job was never reclaimed. take() now erases every
      completed_ entry older than the consumed monotonic target (:61), so the next successful
      wait reclaims all stale entries. Residual: entries still accumulate across a run of
      consecutive deadline-exceeded waits with no intervening successful wait (each such wait
      returns by the timeout path, which never takes/prunes). Small, path-string-sized,
      reclaimed as soon as any later wait completes. Non-blocking.
    required_action: >-
      Optional at next touch: prune completed_ keys below the target in the timeout path as
      well, or document that reclamation happens on the next successful wait.
  - id: NB-2
    severity: low
    status: open (controller/architect)
    file: CMakeLists.txt
    location: "target/source registrations at :283-308, :1240-1267"
    issue: >-
      Unchanged from the previous review: CMakeLists.txt carries the CVF-104 build wiring but
      is not listed in the change contract's scope.allowed_files (:14-23). The post-fix change
      set did not touch CMakeLists.txt (the new regression case lives in an already-registered
      target), so this remains a scope-recording gap only.
    required_action: >-
      Controller/architect: record build-file authorization for CMakeLists.txt for the
      CVF-104/105 batch, or confirm the batch descriptor covers it. No production code change.
  - id: NB-3
    severity: low
    status: open (developer discretion)
    file: src/runtime/context.cpp
    location: "serialization block :409-428 with the single deadline created at :327"
    issue: >-
      Unchanged from the previous review: no explicit deadline.expired() check before the
      serialization block starts. dump() is bounded by the 65535-byte check and the finalization
      decision still uses deadline.expired() at :514. No change was required for acceptance.
    required_action: >-
      Optional: add the explicit expiry check (or document the intentional exclusion) at the
      next touch of the module.
  - id: NB-4
    severity: low
    status: partially addressed
    file: tests/unit/cvf104_test_support.h
    location: "TestSink write_temp/commit :345-396; independent end-to-end cases"
    issue: >-
      The in-flight deadline no-final-file property is now covered (developer suite,
      test_artifact_save_worker.cpp:344-374), which the B-1 required_fix explicitly allowed.
      Remaining limitation: the independent suite still cannot observe the production
      CaptureStoreSink temp->rename path (TestSink::write_temp writes through CaptureStore and
      TestSink::commit does not rename) and has no case for a save that outlives its deadline.
    required_action: >-
      Optional for the test owner at the next CVF-104 touch: add an independent blocking-sink
      case asserting no final and no temporary file after release+drain, and/or an end-to-end
      technical-failure save through the runtime. No assertion was weakened.
  - id: NB-5
    severity: low
    status: new (documentation only)
    file: src/artifacts/save_worker.cpp
    location: ":59-60 comment; save_worker.h:88 wait_until comment; context.cpp:498-499 comment"
    issue: >-
      The fix left three comments stale: save_worker.cpp:59-60 says outcomes older than the
      target "can no longer be reclaimed" while the next line reclaims them; save_worker.h:88
      does not mention that deadline expiry now cancels the target's publication; and
      context.cpp:498-499 states the executing job "cannot be interrupted", which is no longer
      true for the wait-timeout path (it remains true for cancel_pending itself).
    required_action: >-
      Optional: update the three comments at the next touch. No behavior change required.

