item_1_contract_fidelity:
  additive_seam: >-
    VERIFIED at 1f520a0. AlgorithmAsset{key, reference, bytes} (src/inspection/algorithm.h:53-57),
    AlgorithmAssetBundle with find() (algorithm.h:64-85), IPreparedAlgorithm (algorithm.h:93-99),
    and IInspectionAlgorithm::prepare as a virtual WITH a default implementation
    (algorithm.h:124-125; body at src/inspection/algorithm.cpp:38-52: validates parameters,
    rejects a non-empty bundle for asset-less algorithms with
    config_error/algorithm_parameters_invalid, returns a forwarding prepared object).
  registry_dispatch: >-
    The prepared dispatch mirrors the frozen containment rules exactly: deadline check, empty
    frame check, exception containment, and the 65536-byte result bound
    (src/inspection/registry.cpp:134-172 vs the legacy body at registry.cpp:94-132;
    declarations at registry.h:54 and registry.h:62).
  asset_bounds: >-
    All five documented bounds enforced: at most 16 assets (src/recipes/recipe.cpp:24,258-261),
    512-byte reference (recipe.cpp:25,228), 16 MiB per asset (src/recipes/recipe_catalog.cpp:25,
    87-90), 64 MiB running total per recipe (recipe_catalog.cpp:26,91-94), and reference form
    (recipe.cpp:226-251: rejects empty, >512, leading '/', backslash, ':', '//', and
    empty/'.'/'..' components - i.e. absolute paths, backslashes, and parent-directory escapes).
    Loading additionally rejects missing, non-regular, and symlink targets and any canonical
    escape beneath config_root/assets (recipe_catalog.cpp:44-106; the portable first-component
    ".." comparison at :78-81 is the 74b3b3f fix, with the ASCII-safe rationale documented at
    :72-77; assets_root derived at :154). Bytes are loaded and prepare() is invoked for every
    recipe before the candidate catalog is constructed (recipe_catalog.cpp:174-195).
  all_or_nothing_reload: >-
    RecipeCatalog load returns a failure on the first bad recipe/asset/preparation
    (recipe_catalog.cpp:156-196); the runtime publishes only a fully loaded candidate
    (src/runtime/context.cpp:471-478) over an atomic shared_ptr snapshot (recipe_catalog.cpp:
    243-251) while each inspect holds its own shared_ptr and dispatches through the prepared
    object (context.cpp:383,427-435), so an in-flight call keeps the old prepared state.
  template_match_parameters_and_result: >-
    Strict validation (src/algorithms/template_match.cpp:68-137: object form, unknown keys,
    template_asset key pattern, roi as 4 integers with 1..64 dimensions and non-negative origin,
    method == ccoeff_normed, finite threshold in [0,1]); prepare-time decode bounds
    (:139-160: empty/undecodable/8192x8192/134217728 bytes; grayscale via IMREAD_GRAYSCALE),
    larger-than-ROI rejection (:292-295) and zero-variance rejection (:297-302); inspect
    performs no disk I/O, checks the deadline before preprocessing (:173), before matchTemplate
    (:203), and before returning (:220), clamps non-finite scores (:216-218), reports
    global-frame x/y plus template width/height (:227-233), PASS iff score >= threshold else
    FAIL with a deterministic kind=template_mismatch defect (:234-243). Every interface_v1
    behavior bullet in .ai/changes/CVF-106.yaml:115-123 is implemented and evidenced.

