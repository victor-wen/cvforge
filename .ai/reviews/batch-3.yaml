carried_findings_detail:
  - id: CVF106-NB-01
    severity: non_blocking
    owner: architect
    summary: >-
      Seam-declaration drift: the approved contract declares AlgorithmAsset::bytes as
      shared_ptr<const vector<uint8_t>> and AlgorithmAssetBundle as a vector alias
      (.ai/changes/CVF-106.yaml:51-57), while the as-built header uses a value vector and a
      bundle class (src/inspection/algorithm.h:53-57,64-85). The value form was recorded as a
      test-author assumption before implementation existed (.ai/reports/CVF-106-test-red.yaml:
      198-199), so no test was edited to fit.
    disposition: CARRY
    judgment: >-
      Semantics required by the baseline contract still hold: bytes are loaded once, bounded,
      immutable during inspect, and the shipped prepare() copies what it needs
      (src/algorithms/template_match.cpp:286-305), so no dangling prepared state exists. The
      compile-time shared-lifetime guarantee of the declared form is absent; requires an
      architect amendment note or a follow-up change if the shared_ptr form was binding.
  - id: CVF106-NB-02
    severity: non_blocking
    owner: architect
    summary: >-
      ROI-versus-configured-frame is enforced at inspect time (fail-closed
      algorithm_frame_invalid) rather than rejected at preparation
      (src/algorithms/template_match.cpp:132-135,193-198), although template_match_algorithm_v1
      says bounds are checked against configured capture dimensions
      (.ai/project-contract.yaml:694) and the extension contract wants invalid cross-field
      combinations rejected before publication (:660). The independent case passes only via the
      compiled 64-pixel extent.
    disposition: CARRY
    judgment: >-
      No wrong verdict is possible (fail-closed at inspect), but a recipe whose ROI fits 64x64
      and exceeds the configured capture frame loads and then fails every inspect. Architect to
      either accept inspect-time enforcement and sharpen the test label, or extend the
      preparation seam to carry configured capture dimensions.
  - id: CVF106-NB-03
    severity: non_blocking
    owner: developer
    summary: >-
      The legacy TemplateMatchAlgorithm::inspect always fails with
      algorithm_error/algorithm_not_found "requires the prepared dispatch path"
      (src/algorithms/template_match.cpp:308-322), so a caller of the retained legacy dispatch
