explicit_statements:
  scanline0_pitch:
    statement: >-
      CONFIRMED - applied exactly once, no double flip, no residual reversal. Row r is addressed as
      scanline0 + r*pitch in uvc_frame_convert.cpp:48-52 ((int64)row * (int64)pitch, then
      scanline0 + offset); the live packed loop enumerates visual rows 0..height-1
      (uvc_frame_convert.cpp:177-181). `height - 1 - row` exists only at uvc_frame_math.h:95 to
      convert a row into a distance from the lowest addressed byte for bounds measurement, never for
      addressing. uvc_backend.cpp contains no copy_packed_rows-style reversal (the only `- 1` uses are
      the luma extent at lines 559/563); the 2D-lock view returns scanline0/pitch unmodified from MF
      (uvc_backend.cpp:448-472) and convert_locked_to_bgr8 passes the pitch once (uvc_backend.cpp:586-602).
  bounds_safety:
    statement: >-
      CONFIRMED, with the single latent caveat of FIND-CVF101-02. checked_mul/checked_add/pitch_magnitude
      are overflow-safe and reject INT32_MIN before negation (uvc_frame_math.h:32-61); decode_packed
      rejects pitch == 0, |pitch| < row_bytes, extent overflow, and (when known) accessible_bytes < extent
      plus every row end (uvc_frame_convert.cpp:154-174); null base, zero dims and >16384 dims are
      rejected first (uvc_frame_convert.cpp:311-319). The Lock2D path (no length available per Microsoft)
      sets accessible_bytes_known=false (uvc_backend.cpp:463-471), leaving only the structural checks -
      the documented limitation, with no guessed length. NV12 and planar 4:2:0 add even/positive-pitch
      and per-plane checks (uvc_frame_convert.cpp:187-212, 227-270); cv::Exception is contained
      (uvc_frame_convert.cpp:336-338).
  accessible_bytes_adjudication:
    statement: >-
      Classification (b) documentation/spec-consistency defect with a latent validation-base gap; not
      (a) a demonstrated correctness defect and not fully (c) benign. The header's "reachable bytes from
      scanline0" (uvc_frame_convert.h:53) and the math's "from the lowest addressed byte"
      (uvc_frame_math.h:95, 103-115) name the same extent for a full-frame buffer (positive pitch:
      scanline0 is the lowest byte; negative pitch: the addressed region runs from the lowest byte up to
      scanline0's row end), and production's Lock2DSize pcbBufferLength (uvc_backend.cpp:455-459) equals
      that extent whenever the image fills the buffer - which is the normal MF layout and the only one
      exercised. No real MF buffer with ppbBufferStart earlier than the image's lowest addressed byte is
      demonstrated; if one existed and the buffer were short, the relative check could miss a region
      ending up to that prefix past buffer_start + length, while a literal "distance from scanline0"
      caller would be under-permissive and rejected cleanly. Required action: architect corrects the
      frozen wording and camera_adapter_author makes the check absolute from buffer_start/length
      (see FIND-CVF101-02).
  planar_i420_yv12:
    statement: >-
      CONFIRMED. decode_planar_420 allocates cv::Mat planar(luma_rows + chroma_rows, width, CV_8UC1)
      = canonical height*3/2 rows (uvc_frame_convert.cpp:281) and writes U at byte offset
      luma_rows*width with V immediately after at luma_rows*width + chroma_rows*(width/2)
      (uvc_frame_convert.cpp:293-301), exactly the Y-then-U-then-V half-width-packed layout OpenCV's
      COLOR_YUV2BGR_I420 requires (input height 3H/2; U at W*H; V at W*H + W*H/4). i420 sets
      first_plane_is_u=true and yv12 maps its physically V-first planes into the canonical U slot
      (uvc_frame_convert.cpp:290-292), so I420 (U then V) and YV12 (V then U) are both correct; the
      source planes are read at luma_rows*pitch and + chroma_rows*(pitch/2) with even pitch enforced
      (uvc_frame_convert.cpp:230, 287-300). The independent positive-pitch planar and bottom-up no-OOB
      cases pass (test lines 1030-1045, 1055-1079).
  channel_order:
    statement: >-
      CONFIRMED - no channel swap. rgb24 copies native B,G,R bytes unchanged
      (uvc_frame_convert.cpp:92-103); rgb32/argb32 copy the low three bytes B,G,R and drop the fourth
      (uvc_frame_convert.cpp:105-112); output is always continuous CV_8UC3 BGR8
      (uvc_frame_convert.cpp:176). This matches the contract's MF D3DFMT_R8G8B8/X8R8G8B8/B,G,R,A memory
      order. The independent file's packers write native (b,g,r[,a]) (test lines 164-192) and the
      distinct-value cases assert the exact BGR triple and explicitly reject the swapped triple
      (test lines 447-449, 562-625, 1085-1126).
  test_adequacy:
    statement: >-
      ADEQUATE. The independent suite (tests/windows/uvc/cvf101_uvc_frame_convert_test.cpp, 20 cases /
      752 assertions, hash ae8874a5...) includes only the frozen seam header (lines 28-40), contains no
      skips/disabled cases, and covers: B1/B2 asymmetric-row orientation both pitch signs (455-491);
      B3 all packed formats both signs plus the distinct-RGB channel-order guard (497-556, 562-625,
      1085-1126); B4 padding-by-pitch with a pad-byte absence scan (631-661); B5 exact-minimum accepted
      vs one-byte-short rejected for every packed format and truncated/bottom-up cases (759-797,
      803-831, 1133-1163); B6 overflow and INT32_MIN without UB, known and unknown bounds (837-880,
      1169-1199); negatives null/zero-dims/pitch<row/zero-pitch/per-format (886-938, 950-975);
      boundaries 1x1 both signs, width-1/height-1 for all byte-packed formats, 4:2:2 min width 2,
      planar 2x2 minimum (667-757, 1205-1280). The developer unit suite
      (tests/unit/uvc_frame_math_test.cpp:31-212) exercises the pure helpers with exact values
      (36/55/24/0), INT32_MIN, clamp saturation, all 256 neutral-luma iterations and chroma extremes -
      meaningful, not tautological, and it honestly labels the 64-bit-unreachable overflow guards.
      Limits recorded honestly: Windows MSVC execution is deferred and the -D_WIN32 Linux mirror is a
      proxy, not MSVC evidence; neutral chroma hides plane order (INFO-1).
  scope:
    statement: >-
      CLEAN as far as inspectable without shell. Changed production files are all inside
      src/camera/uvc_windows/** (allowed), the developer test is tests/unit/uvc_frame_math_test.cpp
      (not a cvf1*_* name; allowed), the component test is tests/windows/uvc/** (allowed, test-owner
