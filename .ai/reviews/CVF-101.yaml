summary: >-
  CVF-101 decodes the locked Media Foundation 2D buffer correctly: packed rows are addressed as
  scanline0 + r*pitch exactly once with no residual reversal (uvc_frame_convert.cpp:48-52, 177-181),
  bounds are overflow-checked and enforced whenever Lock2DSize supplied a length
  (uvc_frame_convert.cpp:154-174), the unknown-length Lock2D fallback keeps only structural checks as
  Microsoft documents (uvc_backend.cpp:463-471), the i420/yv12 planar path now builds the canonical
  3H/2 half-width-packed Y,U,V buffer OpenCV expects with correct plane order (uvc_frame_convert.cpp:281-304),
  and the packed B,G,R(,A) channel order is preserved without any swap (uvc_frame_convert.cpp:92-113).
  The independent test suite is intact at its pinned hash, covers B1-B6 and all boundary/negative
  cases across every native format, only includes the frozen seam header, and contains no skips or
  weakened assertions; the recorded formatting-only edit is verified as whitespace/line-wrapping from
  the diff (after-image matches the on-disk file at lines 986-992 and 1094-1095). The accessible_bytes
  wording/basis mismatch is real but is a spec-consistency defect (classification b), not a demonstrated
  live defect: all known MF full-frame layouts make the two bases coincide, and the literal-reading
  direction fails cleanly rather than unsafely; a bounded production-side hardening is required before
  the batch release gate. Scope is clean, ABI/camera_contract are untouched, the Windows target is
  registered only in the test-enabled Windows configuration, and independence incident CVF-101-II-01
  does not invalidate the frozen evidence. Windows MSVC execution remains honestly deferred.

findings:
  - id: FIND-CVF101-02
    severity: low
    classification: >-
      (b) documentation/spec-consistency defect with a latent validation-base gap - not (a) a
      demonstrated correctness defect, and not fully (c) benign.
    file: src/camera/uvc_windows/uvc_frame_convert.h
    location: line 53 (accessible_bytes comment)
    related_locations:
      - src/camera/uvc_windows/uvc_frame_math.h:88-115 (offsets measured from the lowest addressed byte; line 95)
      - src/camera/uvc_windows/uvc_backend.cpp:455-459 (pcbBufferLength stored verbatim), 586-601 (view built from it)
    evidence: >-
      The frozen header documents accessible_bytes as "reachable bytes from scanline0"
      (uvc_frame_convert.h:53), while packed_row_region_offset/packed_row_fits convert every row to a
      distance from the LOWEST addressed byte (uvc_frame_math.h:95, 103-115) and production forwards
      Lock2DSize's raw pcbBufferLength (uvc_backend.cpp:455-459 -> 600-601). Microsoft documents
      pcbBufferLength as the length of the buffer that begins at ppbBufferStart and ppbScanline0 as the
      visual top scan line, which for a bottom-up image is the last scan line in memory (Lock2DSize
      reference, verified). For a full-frame buffer the addressed-region extent, the length from
      buffer_start and the reachable extent from scanline0 all coincide, so every exercised layout is
      exact; no real MF buffer with the image not starting at buffer_start is demonstrated. Residual
      gap: if ppbBufferStart < the image's lowest addressed byte and the buffer is short, the relative
      check (extent <= accessible_bytes) can accept a region ending up to (lowest - buffer_start) bytes
      past buffer_start + pcbBufferLength (uvc_frame_math.h:110-114). A caller literally reading the
      comment as "distance from scanline0" would instead be under-permissive (2*(height-1)*|pitch| +
      row_bytes required) and receive a clean camera_io/capture_failed rejection - never an unsafe read.
    required_action: >-
      (1) architect: state the actual convention in the frozen field comment and the change-contract
      text (extent of the addressed row region measured from its lowest addressed byte, which is what
      Lock2DSize/IMFMediaBuffer::Lock actually report), or approve a seam revision carrying buffer_start.
      (2) camera_adapter_author (preferred; inside allowed_files, no frozen-seam change): retain
      Lock2DSize's buffer_start/buffer_length in uvc_backend.cpp and pass
      accessible_bytes = buffer_start + buffer_length - lowest_addressed_byte
      (lowest = scanline0 + (pitch < 0 ? (height-1)*pitch : 0)), making the contract invariant
      "no row is read outside the bounds supplied by the lock" unconditional.
      (3) release-reviewer: verify closure or record an explicit acceptance before the batch-1 gate.

  - id: INFO-1
    severity: info
    classification: independent planar plane-order observability
    file: tests/windows/uvc/cvf101_uvc_frame_convert_test.cpp
    location: lines 1030-1045, 1055-1079, 1264-1279 (all planar cases use neutral U=V=128)
    evidence: >-
      The independent planar fixtures initialize the whole allocation to 0x80 (PlanarLock, lines
      312-374), so a U/V plane swap would be invisible to them; the file documents this deliberately
      ("it pins no chroma-plane convention"). Plane order is confirmed only by source inspection
      (uvc_frame_convert.cpp:290-292) and the developer's non-recorded order probe, not by an
      independent assertion.
    required_action: >-
      test_owner: add one planar case with distinct non-neutral chroma (e.g. U=100, V=200) asserting
      the exact BGR triple, or record the CVF-107 hardware color check as the closure path. Non-blocking.

  - id: INFO-2
    severity: info
    classification: ownership-manifest traceability
    file: .ai/test-ownership.yaml
    location: CVF-101 notes, lines 454-469
    evidence: >-
      The independent suite grew from 12 cases / 402 assertions (hash 4fb03ee4...) to 20 cases /
