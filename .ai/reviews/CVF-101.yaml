    required_action: >-
      test_owner: record the intermediate hash/coverage transition in the CVF-101 manifest notes for
      audit traceability. Non-blocking.

  - id: INFO-3
    severity: info
    classification: duplicated dimension constant
    file: src/camera/uvc_windows/uvc_frame_math.h
    location: line 30 (k_max_locked_dimension = 16384) vs uvc_backend.cpp:68 (k_max_frame_dimension = 16384)
    evidence: >-
      Two independent 16384 constants define the same supported dimension limit; the comment claims
      they match, but a future edit to either side silently desynchronizes the seam from the backend.
    required_action: >-
      camera_adapter_author: derive one from the other or centralize the constant at the next touch of
      the module. Non-blocking.

  - id: INFO-4
    severity: info
    classification: packed-vs-planar YUV range asymmetry
    file: src/camera/uvc_windows/uvc_frame_convert.cpp
    location: lines 114-145 (packed yuy2/uyvy use full-range yuv_to_bgr_full) vs lines 221, 303 (planar nv12/i420/yv12 use OpenCV limited-range cvtColor)
    evidence: >-
      U=V=128 maps to (Y,Y,Y) for packed YUV (uvc_frame_math.h:140-148) but to gray 130 through
      OpenCV's limited-range planar conversion; the brief explicitly forbids pinning a range, so this is
      contract-permitted, but the same scene would differ by several luma levels between a YUY2 and an
      I420 stream from one camera.
    required_action: >-
      release-reviewer/quality_owner: cover this in the NFR-019 / CVF-107 hardware color checks and
      decide before release whether packed YUV should also use OpenCV's range for consistency.
      Non-blocking.

