re_review:
  reviewed_at: 2026-09-18
  reviewer: reviewer
  scope: >-
    Bounded re-review of the session-3 FIND-CVF101-02 fix. Read in full: the seam header, the math
    header, the backend, the developer unit test, and the frozen independent Windows component test,
    plus the change contract and .ai/reports/CVF-101-implementation.yaml session_3. The only question
    is whether the fix closes FIND-CVF101-02 correctly and safely and introduces no new defect.

  finding_updates:
    - id: FIND-CVF101-02
      status: CLOSED
      basis: >-
        (1) Basis now stated correctly and consistently. uvc_frame_convert.h:15-21 and the field
        comment at :61 document accessible_bytes as measured from the lowest addressed byte of the
        scanned region, and the change contract carries the same wording plus the caller obligation
        (.ai/changes/CVF-101.yaml:78-79). Struct members, order, types, defaults, enum values and the
        function signature are unchanged from the earlier review's record: comment-only header edit,
        no ABI/shape change. (2) Math is correct for both pitch signs. lowest_addressed_address()
        (uvc_frame_math.h:97-116) returns scanline0 for pitch >= 0 and scanline0 - (height-1)*|pitch|
        for pitch < 0, with height==0, INT32_MIN and descent-below-zero all rejected; for the
        bottom-up case scanline0 != buffer_start, lowest is computed from the pitch geometry, not
        from the lock. rebase_accessible_extent() (:126-141) returns end - lowest where
        end = start + buffer_length, so the value is exactly the reachable byte count from the lowest
        addressed byte for a contiguous lock range: it cannot over-estimate the lock's own end, and
        it under-estimates only if the lock itself understates the memory (conservative). The helper
        requires lowest to be strictly inside [start, end) and rejects otherwise, at :136-138.
        (3) Overflow/underflow is safe. checked_mul guards (height-1)*|pitch|, pitch_magnitude
        rejects INT32_MIN before negation (:61-68), descent > scanline0 rejects address underflow
        before the subtraction (:111-114), and checked_add guards start + buffer_length before the
        subtraction (:132-135); no size_t wrap path remains. (4) Backend is consistent and rejects
        correctly. uvc_backend.cpp:449-455 keeps the raw (buffer_start, buffer_length) from
        Lock2DSize; :493-503 is a thin pointer-widening call into the tested helper;
        convert_sample :1424-1435 fails with camera_io/capture_failed (after one Unlock2D) when the
        range is empty or does not contain the addressed region. The downstream seam validates the
        whole region extent and every row end against the rebased accessible_bytes
        (uvc_frame_convert.cpp:165-174 packed, :200-211 nv12, :248-269 planar), so combined the
        region is read only when it lies inside the lock's reported bounds. (5) No regression to the
        other paths. Positive pitch with buffer_start == scanline0 yields accessible == buffer_length
        exactly as before; when the lock starts below scanline0 the rebased value is smaller, which
        is the contract's intended stricter semantics (a frame whose rows extend past the lock end is
        rejected instead of read). The Lock2D unknown-bounds path (start null, length 0, known=false)
        and the contiguous IMFMediaBuffer::Lock fallback (data == buffer start, positive computed
        stride, current_length) are unchanged and remain on the same basis. (6) A full-frame
        bottom-up lock (scanline0 = buffer_start + (height-1)*|pitch|) now yields the full extent
        rather than the raw length; a lock anchored at scanline0 for negative pitch is rejected.
        (7) Tests are meaningful. The three new developer cases (tests/unit/uvc_frame_math_test.cpp:
        160-239) assert hand-computed exact values for positive pitch, bottom-up, single row, zero
        height, INT32_MIN, sub-zero descent, rebasing with a prefix, last-byte boundary, and the
        reject cases, including the scanline0-anchored negative-pitch range; they are not
        tautological and cover both negative pitch and the reject path. (8) The frozen independent
        test was not modified in this session and its behavior is unaffected: the seam .cpp's
        accessible_bytes consumption is unchanged and the math header changes are additive.

  new_findings:
    - id: INFO-5
      severity: info
      file: src/camera/uvc_windows/uvc_frame_math.h
      location: line 22 (banner) vs line 97
      issue: >-
        The new banner paragraph names packed_lowest_address_offset() as one of the overflow-safe
        rebasing helpers, but no such function exists; the real helpers are
        lowest_addressed_address(), rebase_accessible_extent() and lock_accessible_extent().
        Comment-only inaccuracy; it could send a future caller searching for a non-existent symbol.
      required_fix: >-
        camera_adapter_author: correct the banner name at the next touch of the module.
        Non-blocking.

    - id: INFO-6
      severity: info
      file: .ai/reports/CVF-101-implementation.yaml
      location: session_3 overflow_safety_and_unchanged_behavior, second bullet (line 387)
      issue: >-
        "Positive pitch: lowest_addressed == scanline0, so accessible == buffer_length,
        byte-for-byte the previous behavior" holds only when the lock's buffer_start equals
        scanline0. When the lock starts below scanline0 the rebased extent is smaller than the raw
        length; that is the intended stricter behavior required by the contract, but the report's
        universal phrasing overstates the invariance.
      required_fix: >-
        developer: report wording only; no code change required. Non-blocking.

  final_task_verdict: APPROVE
  final_verdict_note: >-
    Zero blocking findings: FIND-CVF101-02 is CLOSED and the fix introduces no new defect. INFO-1
    through INFO-4 from the earlier review and the two new INFO observations remain non-blocking
    follow-ups (release review owns the batch gate). Windows MSVC compilation/execution of the
    backend wiring remains deferred to the designated station and is not claimed here; the backend
    helper call is a thin pointer-widening wrapper over the portable arithmetic that the developer
    unit tests cover with exact values. As in the earlier review, sha256 values could not be
    recomputed without a shell; the on-disk independent test content (1302 lines, 20 cases, no
    skips/disabled tests, only the frozen seam header included) is consistent with the pinned
    ae8874a5... record and the ownership manifest entry.
