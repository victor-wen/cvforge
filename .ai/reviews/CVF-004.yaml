assessment:
  frozen_interface_compliance: >-
    PASS. Error codes 1600-1623 and status mapping match exactly; load_global_config
    (absolute roots, missing/io/parse/duplicate/unknown, schema_version, backend, selector
    sufficiency, all bounds), load_recipe_file (key set, patterns, registry lookup +
    validate_parameters, capture/artifacts, all codes), catalog (sorted non-recursive
    load, all-or-nothing, duplicate id, empty dir, find/ids/size) and holder (noexcept
    publish/current, default nullptr, atomic swap) all match interface_v1, including the
    std::string save_policy alignment frozen in the on-disk contract revision.
  invariants: >-
    PASS. Strict/duplicate-key-safe/bounded UTF-8 parsing; all-or-nothing reload with
    no partial catalog observable; unknown algorithm or rejected parameters fail the
    candidate set; no camera implementation or public C ABI in src/recipes/**;
    identifiers cannot form paths (recipe_id alphabet excludes separators).
  duplicate_key_and_utf8: >-
    PASS. The callback clears keys_[depth+1] on object_start and records keys at
    keys_[depth] on key events; checked against the installed nlohmann 3.12
    json_sax.hpp where object_start is reported at ref_stack.size() and keys at
    ref_stack.size()+1, so nested objects and sibling array objects are handled without
    false positives or misses. Invalid UTF-8 is rejected by the nlohmann lexer and
    surfaces as the parse-error codes the tests accept.
  holder_memory_ordering: >-
    PASS. std::atomic<std::shared_ptr<const RecipeCatalog>> with default nullptr,
    release store in publish(), acquire load in current(); the specialization's atomic
    refcount handling makes any concurrently observed snapshot a complete old or new
    catalog. The catalog is move-only and immutable after load.
  scope_and_independence: >-
    PASS. Only scope.allowed_files were touched (src/recipes/**, src/core/error.*,
    CMakeLists.txt, tests/unit developer tests, evidence harness). Independent
    cvf004_* files were edited only by the test owner: TV-1 anchor corrected to the
    fixture text and the verify-phase frame_rate probes added, both hash-recorded and
    both preserving the intended assertions (the TV-1 case still requires
    config_error/config_duplicate_key). No assertion was removed, skipped, or weakened.
  evidence_consistency: >-
    PASS. ctest 204 = 135 pre-existing + 60 independent + 9 developer, 0 failures,
    0 skips (verify log). Format-check 56 files; static-analysis 17 src-only TUs
    (production sources unchanged after that run, so the evidence remains valid).
    ASan build green with the single historical failure proven test-side. Ownership
    hashes consistent across the developer report, verify report, and manifest at each
    stage. Windows MSVC evidence remains a CI concern per the baseline.

