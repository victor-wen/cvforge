summary: >-
  The change implements the frozen recipe_store interface_v1 exactly. Error codes
  1600-1623 exist with the frozen names, values, and broad-status mapping
  (1622 -> recipe_not_found, all other config/recipe codes -> config_error);
  load_global_config enforces absolute roots (1011), missing/unreadable/parse/
  duplicate/unknown/schema/backend/selector/string-cap/hex/bounds rules; load_recipe_file
  enforces the required and unknown key sets, schema version, recipe_id and algorithm
  byte patterns with registry lookup, algorithm-delegated parameter validation with
  message preservation, and the capture/artifacts rules including the std::string
  save_policy tokens frozen on disk; RecipeCatalog loads sorted non-recursive *.json
  all-or-nothing with duplicate-id rejection and immutable lookup; RecipeHolder uses
  std::atomic<std::shared_ptr<const RecipeCatalog>> with release/acquire. The
  duplicate-key detector was verified correct against the installed nlohmann 3.12
  callback depth semantics (object_start at depth d, keys at d+1; sibling objects in
  arrays cannot false-positive), and invalid UTF-8 is rejected by the parser. No camera
  implementation or public C ABI enters src/recipes/**, and identifiers cannot form
  paths. Scope is clean: only scope.allowed_files were touched; the only independent
  cvf004 test edits are the owner-recorded TV-1 anchor fix and the verify-phase
  frame_rate boundary probes, both without weakening any assertion. Evidence is
  internally consistent: 204 = 135 pre-existing + 60 independent + 9 developer with
  0 skips; format-check 56 files; static-analysis 17 src-only TUs (unaffected by the
  later test-only edits); ASan build green with the single historical ASan failure
  being test-side TV-1; ownership hashes match across the developer report, verify
  report, and manifest at each stage. The six notes below are quality-gate evidence
  hygiene items, not contract violations.

