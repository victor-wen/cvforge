independence_notes: >-
  The six tests/unit/cvf004_* files include only frozen interface headers plus
  tests/unit support, never production .cpp files, and contain no SKIP/hidden tags
  beyond the platform-guarded unreadable-file cases (permission bits skipped only when
  running as root; the verify session ran non-root with no skip output). They are
  behavior-derived from the brief B1-B7 plus documented boundary/negative cases, and
  they failed RED by compilation against the missing recipes headers before
  implementation existed. The holder concurrency case is bounded (3 readers, 200
  publish rounds, no sleeps). Developer tests are complementary (array sibling-object
  duplicate false-positive guard, nested config duplicate raw text, selector string
  cap, missing sections, diagnostic preservation, non-JSON-only directory) and do not
  duplicate the independent acceptance cases. The two owner-recorded test-file
  updates are legitimate test-owner amendments with fresh evidence and updated
  hashes; final digest recomputation is deferred to the quality gate (NB-3).
