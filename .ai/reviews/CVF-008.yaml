change_id: CVF-008
verdict: APPROVE
reviewed_artifacts:
  - .ai/project-contract.yaml
  - .ai/changes/CVF-008.yaml
  - .ai/reports/CVF-008-implementation.yaml
  - .ai/reports/CVF-008-test-red.yaml
  - .ai/reports/CVF-008-test-verify.yaml
  - .ai/test-ownership.yaml
  - .ai/test-briefs/CVF-008.yaml
  - examples/c_host/** (main.c, CMakeLists.txt, run_example.sh, config/**)
  - config/examples/**
  - LICENSES/**
  - docs/**
  - .github/workflows/windows.yml
  - cmake/CvfPackage.cmake, cmake/CvfPackage.cmake.in, cmake/CvfPackageVerify.cmake.in
  - cmake/CvfOptions.cmake, cmake/CvfFormat.cmake, cmake/CvfAbiCheck.cmake
  - CMakePresets.json, CMakeLists.txt
