  - "quality_owner: recompute all test-ownership sha256 values (47 files) and confirm
     tests/package/** is byte-identical to the CVF-008 manifest entries."
  - "release_owner: record the windows-2022 CI results (release and test-enabled jobs,
     package-verify, symbols archive, clean package consumer) as the authoritative
     Windows evidence, or the explicit deferral, with no substitution of WSL results."
