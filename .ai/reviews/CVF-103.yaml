  Re-review after the B-1 fix. Blocking finding B-1 is RESOLVED by direct source inspection:
  the CVF-103 Windows test block is now a direct sibling of the cvf102 block inside
  if(CVFORWIN_BUILD_TESTS) (opened CMakeLists.txt:495, closed 1143) with the inner
  if(WIN32 AND CVFORWIN_BUILD_TESTS AND CVFORWIN_BUILD_TEST_BACKENDS) gate intact at
  1122-1142, and it is no longer inside if(CVFORWIN_BUILD_HARDWARE_TESTS) (1156-1177), whose
  only child is cvf_hw_uvc_smoke. CvfOptions.cmake:55 keeps CVFORWIN_BUILD_HARDWARE_TESTS=OFF
  but windows-msvc-tests sets CVFORWIN_BUILD_TESTS=ON and CVFORWIN_BUILD_TEST_BACKENDS=ON
  (CMakePresets.json:93-94), and windows.yml:117-118 runs the windows-tests-quality workflow
