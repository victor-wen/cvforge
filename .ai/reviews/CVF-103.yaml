blocking_findings: []

non_blocking_findings:
  - id: NB-1
    severity: medium
    file: .ai/changes/CVF-103.yaml
    location: verification.windows (line 112) versus the two frozen seams (lines 35-85)
    issue: >-
      The change contract requires a Windows suite that "injects delayed retired-generation
      callbacks and asserts rejection, timeout, and reconnect ordering", but no executable test
      does this. The frozen seams provide only the pure gate and the read-only snapshot
      accessor, so the independent Windows TU can only assert idle/failing-path counters
      (callbacks_created unchanged, monotonic >=) and an expired-deadline capture; the backend
      wiring that rejects a delayed retired-generation callback is verified only by this
      reviewer's source inspection, and CI execution of the snapshot suite will not exercise
      the stale path without a device or a fault seam.
    required_action: >-
      Controller/release-reviewer: record that backend-level delayed-callback rejection for
      CVF-103 rests on reviewer source verification plus the portable gate suite, and either
      amend the change-contract verification wording to the frozen seams or schedule a
      delayed-callback fault seam in a later task; no production change is required for
      CVF-103 if the source-based adjudication is accepted.
  - id: NB-3
    severity: low
    file: tests/windows/uvc/cvf103_uvc_callback_snapshot_test.cpp
    location: lines 364 and 370-372 (zero-device enumerate empty and camera_not_found open)
    issue: >-
      The case asserts the host enumerates zero devices and that an absent-identity open fails
      with camera_not_found. That holds on the hosted no-camera windows-tests-quality runner
      but would fail on a station with any camera attached, because enumerate would be
      non-empty (identity resolution would still fail, but the empty-list CHECK would fail).
    required_action: >-
      Test owner: keep the suite on the hosted no-camera windows-tests-quality job (the
      intended environment per the verify report) or guard the empty-host assertion; no
      production change.
  - id: NB-4
    severity: info
    file: src/camera/uvc_windows/uvc_backend.cpp
    location: lines 1553-1555 (cancel_pending_read Flush FAILED branch)
    issue: >-
      When reader_->Flush() itself fails, cancel_pending_read returns false without calling
      callback->begin_read(), so the cancelled read's completion state is not explicitly
      cleared. It cannot satisfy a later capture because the caller sets needs_reconnect_=true
      (1485-1487), the next capture returns camera_disconnected without reading the callback
      (1451-1454), and reconnect/open call teardown_stream() which retires the generation and
      drops the callback. The other two branches (budget exhausted, flush waited) do clear the
      state.
    required_action: >-
      Developer: no change required; optionally clear the read state in the Flush-failure
      branch for literal conformance at the next touch of the module.
  - id: NB-5
    severity: info
    file: src/camera/uvc_windows/uvc_backend.cpp
    location: lines 1261-1263 (start_stream) versus 1265-1284 (attributes/reader creation)
    issue: >-
      callbacks_created is incremented immediately after constructing the fresh ReadCallback,
      before MFCreateAttributes/MFCreateSourceReaderFromMediaSource can fail. A failed start
      therefore counts a callback that never became a live SourceReader stream, which is honest
      for "callbacks created" but slightly wider than the frozen comment "fresh callback per
      started stream" (uvc_backend.h:63). active_generation is retired again by the caller's
      teardown_stream() on that failure path.
    required_action: >-
      Developer: no change required; optionally document the counter as "callbacks constructed"
      or move the increment after the SourceReader is created.
  - id: NB-6
    severity: info
    file: src/camera/uvc_windows/uvc_stream_generation.h
    location: lines 42-47 (begin_stream fetch_add wrap)
    issue: >-
      A theoretical uint64 wraparound of next_generation_ would make begin_stream() return 0,
      which is the no-active-stream sentinel; unreachable in practice (2^64 streams) and
      explicitly acknowledged by the independent boundary test (cvf103_stream_generation_test.cpp
      lines 231-264). No live defect.
    required_action: None; keep the boundary note in the test.

