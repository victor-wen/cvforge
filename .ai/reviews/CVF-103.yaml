judgments:
  1_fresh_callback_per_stream:
    result: PASS
    evidence: >-
      start_stream() calls generation_state_->gate.begin_stream() and constructs
      new ReadCallback(generation_state_, generation) on every start (uvc_backend.cpp:1261-1263);
      open() and reconnect() call teardown_stream() before activate (896, 966) and on every
      failure path (905, 911-915, 974, 980-984, 1287-1290), and start_stream() tears down when
      format selection fails. The member callback_ is reset to a new object, never reused, and a
      replacement SourceReader always gets a new callback instance.
  2_generation_correctness:
    result: PASS
    evidence: >-
      StreamGenerationGate starts at 1, is strictly increasing across retire/begin via
      next_generation_, treats 0 as no-stream, accepts only exact equality (uvc_stream_generation.h:42-78).
      ReadCallback stores a const generation_ (uvc_backend.cpp:813) and OnReadSample/OnFlush
      check gate.accepts(generation_) before any state write (721-731, 739-746); the capture
      waiter and flush waiter re-check gate.accepts in their predicates (1480-1482, 1563-1565),
      so the check-then-write TOCTOU cannot yield a false completion.
  3_stale_rejection:
    result: PASS
    evidence: >-
      The stale branches call discard_stale(generation_) and return before taking the mutex, so
      read_completed, read_status, read_flags, read_sample, and flush_completed are untouched
      (uvc_backend.cpp:721-724, 739-742). A retired generation cannot satisfy a replacement
      capture: the replacement waits on a different callback object, and its predicate also
      requires gate.accepts. A late event cannot leak into the next read of the same stream
      because an unflushed timeout sets needs_reconnect_ and the next capture is refused until
      reconnect tears the callback down.
  4_teardown:
    result: PASS
    evidence: >-
      teardown_stream() retires the gate first, then resets reader_, source_, and callback_
      (uvc_backend.cpp:1123-1127); close() stops/joins the worker whose teardown hook calls
      teardown_stream() before MFShutdown/CoUninitialize (1080-1094, 996-1000). Teardown runs on
      the owned worker after the running command, so no ordering window lets an old callback
      complete a new read.
  5_deadline_flush:
    result: PASS
    evidence: >-
      cancel_pending_read() bounds the flush wait by min(k_flush_grace=1000 ms,
      deadline.remaining()), clears the cancelled read with begin_read() after the wait, gates
      the flush completion on gate.accepts, and returns false (caller sets needs_reconnect_) on
      Flush failure, zero budget, or flush timeout (uvc_backend.cpp:1545-1569, 1483-1490); the
      flush request is asynchronous and never waits past the caller deadline. See NB-4 for the
      non-clearing Flush-failure branch.
  6_snapshot_accuracy:
    result: PASS
    evidence: >-
      callback_snapshot() reads the live gate for active_generation/stale_events_discarded, the
      atomic callback counter, and the stream_open_ mirror (uvc_backend.cpp:1021-1029); the
      counter increments on each constructed callback (1263), stream_open_ is set only after
      successful start and cleared by teardown (1291, 1124), so values are real state, not
      tautologies; the Windows tests would fail on counter regression or a fabricated callback.
      See NB-5 for the failed-start counting nuance.
  7_scope_abi:
    result: PASS
    evidence: >-
      UvcCallbackSnapshot and callback_snapshot() occur only in src/camera/uvc_windows/** and the
      tests; grep confirms absence from include/cvforwin/cvf_api.h, src/camera/camera_backend.h,
      and src/c_api/cvforwin.def, so ICameraBackend, the public header, and the export set are
      unchanged. The header addition is inside the existing #if defined(_WIN32) guard. Windows
      gating: never in the release preset, and the test-enabled gate is now correctly enclosed by
      if(CVFORWIN_BUILD_TESTS) with no CVFORWIN_BUILD_HARDWARE_TESTS dependency
      (CMakeLists.txt:495-1143, inner gate 1122-1142), so windows-tests-quality configures,
      builds, and registers it. CMakeLists.txt is authorized build wiring in the amended change
      contract (NB-2 resolved).
  8_test_adequacy:
    result: PASS_WITH_LIMITATIONS
    evidence: >-
      The portable independent suite is behavior-driven, non-tautological, and covers first
      generation 1, strict monotonicity, exact-equality acceptance, retire rejection, stale
      counting, and boundary/negative cases (15 cases, no SKIP/DISABLED/MAYFAIL). The Windows
      independent suite is meaningful for the frozen snapshot seam (idle, no-COM/STA caller,
      failing opens, close idempotence, expired deadline, monotonic counters) with no weakened
      assertions, but it cannot and does not inject a delayed retired-generation callback or
      cover timeout/flush/reconnect ordering end to end (NB-1). With B-1 fixed, the target is
      now reachable in windows-tests-quality, but its native execution is still deferred to CI
      and is not claimed. The developer's off-Windows stub case
      (tests/unit/uvc_callback_snapshot_test.cpp:121, CHECK(true)) is honestly labeled and is
      not acceptance evidence.

