    - "All report.skip sites are either documented non-required gates or preceded by a failing prerequisite: 805-807 (friendly_name boundary), 972/1021 (non-required orientation/color), 1250 (unplug gate), 1385 (zero-device boundary), 1393 (no devices, with H1 fail), 1409 (no selector, with fail), 1417 (unresolved selector, with fail)"
    - "No assertion was weakened or deleted for the amendment: the replaced block is exactly the documented one and the three guarded markers are unchanged (amendment.sh:31-78); surrounding H3 checks remain at 827, 836-866, 868-871, 873-880, 1445-1452"
  caveat: "NBF-01: the symmetric-control flag can satisfy mandatory H7 without the asymmetric target, and replaces the positive checks when both flags are set."

item_4_1000_cycle_path:
  status: PASS
  evidence:
