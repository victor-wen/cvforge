    - "Counters increment per violation (1151-1162) and ok is the conjunction (1164); valid/invalid counted at 1174-1178"
    - "Aggregate assertions: invalid==0 && valid==cycles (1190-1191); with cycles>1 all four violation counters zero, sequence_strictly_increasing true, and last_sequence>first_sequence (1192-1198)"
