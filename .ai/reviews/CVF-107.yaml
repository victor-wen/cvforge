review_note: >-
  Read-only source review. No shell is available to this reviewer, so no sha256 value was
  recomputed and no test or hardware run was executed here; hash pins, manifest audits, the
  portable ctest counts, and the claimed build results are report pointers whose mechanical
  recomputation belongs to the deterministic quality gate. Every semantic claim below is backed
  by source or raw-log lines that were read directly.

summary: >-
  CVF-107 hardens the opt-in Windows-only UVC hardware suite as contracted. The suite requires
  an explicit exact selector and never falls back to the first enumerated device; a missing,
  ambiguous, or non-matching selector fails closed (uvc_smoke.cpp:1397-1419; camera_backend.cpp:62-87).
  The 1000-cycle path validates dimensions, BGR8/CV_8UC3, buffer continuity, and a strictly
  increasing sequence per capture and asserts valid==cycles with invalid==0 (uvc_smoke.cpp:1138-1198);
  the raw 1000-cycle log matches exactly (valid=1000 invalid=0, all violation counters 0). The
  forced-timeout path is deterministic and mandatory in stress mode (910-956, 1454-1458) and passed
  on the station, and the reconnect/manual-unplug case matches the capture_with_one_retry semantics
  (capture -> camera_io -> reconnect -> recapture; camera_backend.cpp:89-118) with an operator gate
  and bounded deadline checks (1246-1321); the observed 0xC00D3EA2 camera_io, 21 ms bounded failure,
  and post-replug BGR8 recovery match the code, and the procedure cannot pass vacuously. The H3
  amendment to a fresh backend instance is legitimate: production owns one worker for the backend's
  whole lifetime and close() permanently joins it (uvc_backend.cpp:832-838, 886-888, 996-1000;
  project-contract.yaml:742,747), the surrounding checks are preserved, and only the test file was
  written by the amendment harness. The MSVC _CRT_SECURE_NO_WARNINGS fix is PRIVATE and scoped to
  cvf_hw_uvc_smoke under if(MSVC) (CMakeLists.txt:1711-1716), matching the cvf006 precedent (774);
  the target remains opt-in, WIN32-only, unregistered with CTest, and absent from every CI workflow.
  The mandatory-check machinery honestly failed the 1000-cycle run with exit 1 for the two absent
  physical targets instead of skipping them, and no check was weakened, deleted, or converted to a
  skip to manufacture a pass. Six non-blocking findings are recorded: the symmetric orientation
  control can substitute for the mandatory positive orientation check (NBF-01); the manual still
  presents VID/PID selectors that can never match because enumeration returns empty VID/PID
  (NBF-02); the reconnect "always runs" sentence is wrong (NBF-03); the documented build command
  deviates from the canonical preset and omits the vcpkg toolchain (NBF-04); the pre-amendment
  failing run has no archived log (NBF-05); and residual coverage/procedure gaps remain
  (NBF-06). Hardware acceptance is partial by design: 1000 cycles, timeout, and reconnect are
  verified; orientation and color are UNVERIFIED because no CVF-ORIENT-1 / CVF-COLOR-1 target was
  available, which correctly leaves the project-contract release gate open.

blocking_findings: []

non_blocking_findings:
  - id: CVF107-NBF-01
    severity: medium
    file: tests/hardware/uvc_smoke.cpp
    location: "run_orientation_case: 965-975 and 994-1000"
    issue: >-
      When CVF_HW_ORIENTATION_SYMMETRIC_CONTROL is set, the function executes only the negative
      control and returns (994-1000), so the positive asymmetric-target checks are never run even
      if CVF_HW_ORIENTATION_TEST=1 is also set. In stress mode the missing-target failure is gated
      on !symmetric_control (966-975), so an operator with only a vertically symmetric card can set
      the control and satisfy the mandatory H7 requirement without ever demonstrating "an
      asymmetric TOP/BOTTOM target is detected in the correct visual orientation". The captured
      evidence did not take this path (the stress run hard-failed H7, cvf107-hw-1000cycles.txt:43),
      and the substitution is visible in the log because the two positive H7 lines are absent, but
      the stress-mode invariant is not unconditionally enforced.
    required_fix: >-
      When required is true and CVF_HW_ORIENTATION_TEST is unset, fail regardless of
      CVF_HW_ORIENTATION_SYMMETRIC_CONTROL; when both flags are set, run the positive checks first
      and the control additionally instead of returning after the control. Document that the
      control is not a substitute for the positive target.

  - id: CVF107-NBF-02
    severity: medium
    file: docs/hardware-uvc.md
    location: "28-29 and 38-41 (also tests/hardware/uvc_smoke.cpp:31-34)"
    issue: >-
      The manual tells the operator to copy "the device_path (or the VID/PID)" and lists
      CVF_HW_UVC_VID/PID as usable selectors, but on the measured platform every enumerated
      descriptor has vendor_id="" and product_id="" (cvf107-hw-10cycles.txt:4-5,9;
      cvf107-hw-1000cycles.txt:4-5,9), so a VID/PID selector always resolves to camera_not_found.
      The suite fails closed correctly (no fallback; uvc_smoke.cpp:1413-1419) and the station used
      CVF_HW_UVC_NAME successfully, but the documentation does not tell the operator which
      selectors actually work. The contract's own hardware prerequisites also name only
      DEVICE_PATH or the VID/PID pair (project-contract.yaml:995).
    required_fix: >-
      State that the current Windows UVC enumeration exposes only device_path and friendly_name,
      so CVF_HW_UVC_DEVICE_PATH or CVF_HW_UVC_NAME is required to select a device (VID/PID remain
      implemented and will match once the backend populates those fields), and route the
      production identity gap (CVF107-HW-03) to the release reviewer.

  - id: CVF107-NBF-03
    severity: low
    file: docs/hardware-uvc.md
    location: "141-142"
    issue: >-
      "The suite always exercises a bounded reconnect to the attached device" is false:
      run_manual_replug_case returns after report.skip unless CVF_HW_UNPLUG_TEST=1
      (tests/hardware/uvc_smoke.cpp:1249-1253), including the pre-prompt reconnect at 1263-1268.
      Both the 10-cycle and 1000-cycle logs show H6 as [skip] (cvf107-hw-10cycles.txt:57,
      cvf107-hw-1000cycles.txt:68), and the same section later says the case is skipped when the
      variable is unset, so the document contradicts itself.
    required_fix: >-
      Reword to: with CVF_HW_UNPLUG_TEST=1 the case first exercises a bounded reconnect to the
      attached device; otherwise the whole case is reported as skipped.

  - id: CVF107-NBF-04
    severity: low
    file: docs/hardware-uvc.md
    location: "14-19 and 226; project-contract.yaml:1014-1016"
    issue: >-
      The documented build procedure is an ad-hoc Visual Studio generator command in build\hw with
      no vcpkg toolchain file, while the contract's canonical hardware commands use the
      windows-msvc-tests preset, which supplies
      $env{VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake (CMakePresets.json:88-96). The station
      evidence was produced from build\hw exactly as documented (CVF-107-hardware.yaml:12-14), so
      the run is real, but release evidence cannot be traced to the canonical preset command and a
      fresh operator following the doc alone may fail to configure without vcpkg integration.
    required_fix: >-
      Either align the doc and the release procedure with
      "cmake --preset windows-msvc-tests -DCVFORWIN_BUILD_HARDWARE_TESTS=ON", or document the
      vcpkg/toolchain prerequisite next to the ad-hoc command.

  - id: CVF107-NBF-05
    severity: low
    file: .ai/reports/CVF-107-test-amendment.yaml
    location: "11-13; .ai/validation/cvf107-hardware-evidence/"
    issue: >-
      The pre-amendment station run that produced CVF107-HW-02 (32 passed / 1 failed / 3 skipped,
      H3 same-instance reopen) is reported only in prose; no raw console log is archived alongside
      the three post-amendment logs, so the failure that motivated the H3 amendment cannot be
      independently re-read.
    required_fix: >-
      Archive the pre-amendment console log, or state explicitly in the amendment report that it
      was superseded and why it is not retained.

  - id: CVF107-NBF-06
    severity: low
    file: tests/hardware/uvc_smoke.cpp / docs/hardware-uvc.md
    location: "orientation case 962-1006; H4 post-loop enumeration 1203-1205; docs 80-101, 160-167"
    issue: >-
      Residual adequacy gaps in the captured evidence: (a) brief B2's inverted-target negative
      ("with the target inverted, it fails") is only enforced logically by the signed check at
      1004-1005; no procedure or env mode executes it and it was not run; (b) no CVF_HW_CYCLES=1
      boundary run and no CVF_HW_EXPECT_ZERO_DEVICES run are in the evidence; (c) the H4
      "still enumerated" check (1203-1205) accepts any non-empty enumeration rather than the
      resolved descriptor; (d) a timeout (rather than camera_io) during unplug would fail H6 at
      1280-1281 (fail-closed but untested). A vertically symmetric image cannot pass the
      orientation check: the signed contrast test (1002-1005) plus the control's |diff| threshold
      (994-998) make mirror-symmetric bands fail; only an operator-created lighting gradient
      >= threshold could satisfy it, which the documented "even lighting" requirement (docs:84)
      mitigates.
    required_fix: >-
      Add a documented inverted-target negative step (card upside down; expect the "orientation
      correct" check to fail) and capture the CYCLES=1 boundary (and zero-device boundary if
      possible) at the next station session; optionally re-resolve the descriptor instead of
      accepting any non-empty enumeration after the stress loop.

independence_notes: >-
  No participation conflict: I authored none of the suite, docs, build wiring, reports, or
  evidence, and I made no edits. The test file is owned by test-engineer; the hardware evidence
  was recorded by build-controller and I read the raw logs. The H3 amendment was performed by the
  test owner with the documented anchored replacement and reverse-hash scope proof
  (cvf107-test-amendment.sh:19,31-95; cvf107-test-amendment-scope.sh:31-56); the production
  contract confirms the old assertion contradicted the frozen one-worker-per-lifetime design, so
  this is a legitimate correction rather than a weakened test, and the CVF-007 and CVF-107
  manifest entries were updated in sync by the owner (test-ownership.yaml:356-357,400-401). The
  change contract names .ai/reports/CVF-107-test-verify.yaml, which does not exist; the independent
  execution evidence for this task is .ai/reports/CVF-107-hardware.yaml plus the three raw console
  logs, and the deterministic quality gate should confirm whether the missing verify report is
  required or intentionally replaced. Hash equality (test file d2df8836..., evidence files, manifest
  audit, portable ctest counts) could not be recomputed without a shell and is delegated to that
  gate; my content-level comparison confirms the amended block in the on-disk file matches the
  documented transformation byte-for-byte in the changed region.

acceptance_status:
  task_acceptance: >-
    The brief's acceptance criterion is met honestly: the portable suite is reported green
    (quality gate to confirm) and the hardware evidence is recorded as PASS where verified and
    UNVERIFIED where physical targets were absent. The change package satisfies the CVF-107
    verification matrix; the single canonical stress command was executed as three equivalent
    runs (10-cycle smoke, 1000-cycle stress, interactive reconnect), which covers every required
    check except orientation and color.
  satisfied:
    - "Explicit exact selector required; missing, ambiguous, and non-matching selectors all fail closed with exit 1 and no first-device fallback (uvc_smoke.cpp:1397-1419; camera_backend.cpp:62-87)"
    - "At least 1000 consecutive captures, each validated for configured dimensions, BGR8/CV_8UC3, continuity, and strictly increasing sequence; valid=1000 invalid=0 (uvc_smoke.cpp:1138-1198; cvf107-hw-1000cycles.txt:48-60)"
    - "Forced timeout exercised deterministically and mandatory in stress mode; H5a-H5d and the H5 mandatory check passed (uvc_smoke.cpp:910-956,1454-1458; cvf107-hw-1000cycles.txt:34-42)"
    - "Bounded reconnect plus operator-gated unplug/replug executed and passed (uvc_smoke.cpp:1246-1321; cvf107-hw-reconnect-unplug.txt:58-73)"
    - "Release-evidence record with identity, cycles, Windows version, driver/firmware, check counts, and exit code (uvc_smoke.cpp:399-515; logs 62-85/75-101/78-98)"
    - "Opt-in WIN32-only target, never CTest-registered, never in hosted CI (CMakeLists.txt:1701-1728; CvfOptions.cmake:55; no .github or preset references)"
    - "H3 amendment legitimate (fresh instance) with surrounding checks preserved and no production file touched (uvc_backend.cpp:832-838,886-888,996-1000; amendment harness writes only the test file)"
    - "Mandatory orientation/color checks fail closed when the target is absent instead of skipping; the 1000-cycle run correctly exited 1 (cvf107-hw-1000cycles.txt:43-44,70-73)"
  unverified:
    - "NFR-019 orientation check on real hardware: UNVERIFIED - no CVF-ORIENT-1 target; H7 recorded as a mandatory failure, never a pass"
    - "NFR-019 color check on real hardware: UNVERIFIED - no CVF-COLOR-1 target; H8 recorded as a mandatory failure, never a pass"
    - "The symmetric negative control and the inverted-target negative were not executed on hardware"
    - "CVF_HW_CYCLES=1 and CVF_HW_EXPECT_ZERO_DEVICES boundary runs were not captured on the station (only two cameras attached)"
    - "Portable ctest 454/454, the MSVC rebuild with the CMake fix, and all sha256 pins are report-claimed; recomputation is delegated to the deterministic quality gate"
  release_implication: >-
    project-contract.yaml:975 (hardware_uvc.production_release_requirement) requires a recorded
    PASS with at least 1000 cycles and no skipped timeout, reconnect, orientation, or color
    checks before FCT deployment. That gate is NOT yet met: orientation and color remain
    UNVERIFIED. The release reviewer must keep this open and the station must run H7/H8 with the
    documented physical targets. This task review does not fail the package for that gap: the
    brief explicitly permits honest BLOCKED/UNVERIFIED hardware evidence, and the suite failed
    closed instead of skipping.

