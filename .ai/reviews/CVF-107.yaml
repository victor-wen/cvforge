item_5_reconnect_unplug:
  status: PASS
  evidence:
    - "Procedure is operator-gated by CVF_HW_UNPLUG_TEST (1249-1253) and each manual step waits on stdin (1270-1277, 1298-1305); EOF fails the case (1273-1276)"
    - "After unplug the code requires failure with status camera_io (1279-1281); the bounded retry must also fail camera_io (1292-1293) and return within deadline+slack (1286-1296); after replug one bounded capture_with_one_retry must recover and the frame must validate as BGR8 (1307-1318)"
    - "capture_with_one_retry genuinely performs capture -> camera_io -> reconnect(settings, deadline) -> recapture (camera_backend.cpp:89-118), matching the documented 'bounded reconnect + recapture'"
    - "Observed station behavior matches: camera_io HRESULT 0xC00D3EA2 (cvf107-hw-reconnect-unplug.txt:64-65), bounded retry failure at 21 ms (66-67), recovery to a valid 640x480 BGR8 frame sequence=1 (71-73)"
    - "Vacuous pass is not possible: pressing Enter without unplugging leaves the first post-unplug capture succeeding and failing the camera_io check; recovery additionally requires a valid frame"

item_6_h3_amendment:
  status: PASS
  evidence:
    - "Amended block uses a fresh HwBackend instance (uvc_smoke.cpp:882-896); the old same-instance block and the reverse-match scope proof are in the harness (cvf107-test-amendment.sh:31-57; cvf107-test-amendment-scope.sh:36-56)"
    - "Surrounding checks preserved: open 827; three captures with dimensions/BGR8/ownership/sequence 836-866; frame ownership 868-871; idempotent double close and capture-after-close camera_io 873-880; held-pixels validity after close and destruction 1445-1452"
    - "Amendment is legitimate under the frozen design: one worker for the backend's whole lifetime (uvc_backend.cpp:832-838), open after close returns worker-unavailable (886-888), close() joins the worker permanently (996-1000); uvc_worker_lifecycle_v1 requires one balanced MFStartup/MFShutdown lifetime and close-joins-worker (project-contract.yaml:742,747); neither the contract, change file, nor brief requires instance reuse"
    - "Only the test file was written by the amendment harness (amendment.sh:19,91); report records production_files_touched: none; both manifest pins for the file were updated in sync by the test owner (test-ownership.yaml:356-357,400-401)"
    - "Post-amendment hardware evidence shows both fresh-instance checks passing (cvf107-hw-10cycles.txt:31-32 and the other two logs)"
  limitation: "Byte-level hash equality (d2df8836...) could not be recomputed here; the deterministic quality gate owns that check. NBF-05 notes the missing pre-amendment log."

