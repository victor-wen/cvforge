change_id: CVF-001
verdict: APPROVE
reviewed_artifacts:
  - .ai/project-contract.yaml
  - .ai/changes/CVF-001.yaml
  - .ai/test-briefs/CVF-001.yaml
  - .ai/reports/CVF-001-implementation.yaml
  - .ai/reports/CVF-001-test-red.yaml
  - .ai/reports/CVF-001-test-verify.yaml
  - .ai/test-ownership.yaml
  - .ai/workflow-state.yaml
  - include/cvforwin/cvf_api.h
  - src/core/**
  - src/c_api/**
  - tests/abi/**
  - tests/unit/**
  - CMakeLists.txt
  - CMakePresets.json
  - vcpkg.json
  - vcpkg-configuration.json
