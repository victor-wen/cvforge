independence_notes: >-
  The two test sets are distinct and intact. The developer created only
  tests/unit/test_runtime_lifecycle.cpp (an allowed developer_tests file) and
  modified no test-owner file; the independent C++ suite drives the runtime only
  through RuntimeOptions.camera_override and the CVF-002 synthetic backend, and
  the independent C lifecycle suite drives the public ABI in strict C11 with
  behavior-derived assertions. The only changes to hash-pinned files are the
  owner's TV-4 fixture correction and the B3 verdict-ratio boundary extension in
  tests/abi/cvf006_lifecycle.c, each with a recorded previous/new SHA-256, no
  assertion removed or weakened, and a preserved documented intent; both are
  recorded in the ownership manifest and the amend/verify reports. No assertion
  was disabled, skipped, or softened in the CVF-001..CVF-006 independent files,
  and no implementation detail leaked into the independent suites. The reviewer
  did not participate in authoring, implementing, or testing this change.

