change_id: batch-4-release
title: Batch 4 release evidence and 1.1.0 delivery (CVF-107, CVF-108)
risk: R2
batch: batch-4-release
member_changes:
- id: CVF-107
  delivery_sha: 0e07e21d2c834ed7600292ef47d2f25a7a8d1c5e
  scope: >-
    Opt-in Windows-only UVC hardware stress suite (1000-cycle stress, forced timeout, orientation, colour,
    interactive unplug/replug), its documentation, a target-scoped MSVC compile definition, and a developer
    build-wiring regression test.
  residual:
  - 'NFR-019 orientation and colour remain UNVERIFIED: the station had no CVF-ORIENT-1 or CVF-COLOR-1
    physical target. They are recorded as unverified and were never counted as passes.'
- id: CVF-108
  delivery_sha: 04b3b3bbed9c9e8ad9b043c5711a3733278609b8
  superseded_sha: 7d3e3fe6d6c1aef4416418ffb6f89abd7f86dfe6
  scope: >-
    Release 1.1.0 synchronization across build metadata, package and archive names, CI artifact names,
    dependency manifest, documentation, and licence notices, with the public C ABI held at version 1 and the
    export set at exactly five symbols.
  residual:
  - 'CVF108-NBF-04: the package carries no version-bearing metadata artifact, so a consumer infers 1.1.0
    only from the directory or archive name. Carried for release-reviewer adjudication.'
candidate_sha: 04b3b3bbed9c9e8ad9b043c5711a3733278609b8
scope:
