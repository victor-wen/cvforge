invariants:
- 'Public C ABI stays version 1 and exports stay exactly five; abi-check passes at the candidate SHA.'
- 'The hardware target stays WIN32 + opt-in, is never registered with CTest, and never joins a hosted CI job.'
- 'No production behavior change is masked as a version bump or as test-only work.'
- 'Hardware evidence, portable evidence, and Windows CI evidence remain distinct; none substitutes for another.'
acceptance: >-
  Both member changes are committed, their task reviewers and deterministic quality gates are consumed, and the
  windows-2022 CI jobs succeed at the frozen candidate SHA. Portable and Windows-CI behavior is verified;
  hardware evidence is recorded but explicitly incomplete for orientation and colour.
verification:
  canonical_gate: .ai/validation/batch-4-quality-plan.yaml -> .ai/reports/batch-4-quality.json
