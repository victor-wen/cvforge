deviations:
  - id: a
    area: test_backends counters
    severity: benign-compat
    detail: >-
      interface_v1 spells the counters as callable accessors
      (std::uint32_t capture_call_count() const noexcept) while the independent
      black-box suite observes them as plain members
      (backend.capture_call_count == 1). Both spellings are provided by the same
      CallCounter object (const operator() and implicit conversion to
      std::uint32_t) sharing one value, so neither the frozen semantics nor the
      hash-pinned assertions change. Implementation: test_backend_support.h.
  - id: b
    area: synthetic backend open
    severity: deliberate-fail-closed
    detail: >-
      SyntheticCameraBackend::open also validates the descriptor field-by-field
      and returns Failure(Status::camera_not_found, ErrorCode::descriptor_mismatch)
      on mismatch. The change contract specified descriptor validation only for
      the file backend; the synthetic check is fail-closed symmetry so a backend
      can never open an identity it did not enumerate. No independent test
      exercises a mismatched synthetic open.
  - id: c
    area: build/CI coverage
    severity: flagged-for-review
    detail: >-
      CVFORWIN_BUILD_TEST_BACKENDS defaults OFF for multi-config/release
      configurations, so the windows-msvc-release preset (the only Windows
      preset) would not build the test backends and would not register the
      tests/camera suite. That is in tension with the approved test policy,
      which lists camera_contract environments "Windows MSVC with
      synthetic/file/fault backends". CMakePresets.json is not in the CVF-002
      allowed_files list, so the option could not be forced ON in that preset.
      Flagged for the reviewer to resolve (e.g. an explicit ON in the Windows
      preset or a dedicated Windows test preset) in CVF-008.
  - id: d
    area: core/camera headers
    severity: cosmetic
    detail: >-
      FrameMetadata::captured_at and Deadline::deadline_ carry no "{}" default
      member initializer because clang-tidy readability-redundant-member-init
      (warnings-as-errors) rejects it; std::chrono::steady_clock::time_point's
      default constructor zeroes the value, so behavior is unchanged.
  - id: e
    area: fault plan storage
    severity: test-driven correction
    detail: >-
      Fault plans are stored per targeted call (vectors, latest injection for
      the same call index replaces the previous plan) because
      test_capture_with_one_retry.cpp requires failures at call 1 AND call 2 to
      coexist. The first single-slot implementation failed that case and was
      corrected; the final run is green.

implementation_notes:
  - "capture_with_one_retry checks the deadline before the first capture, before reconnect, and before recapture; non-camera_io failures are returned unchanged; reconnect failure is converted to the recapture return type and returned with no recapture."
  - "File capture does not advance its frame index on a decode failure, so an undecodable frame keeps failing with capture_failed (no frames_exhausted drift)."
  - "Synthetic/open and file/open reset sequence to 0; reconnect keeps position and only clears the disconnected state; close resets the open state and is idempotent."
  - "Delay fault never sleeps past the deadline: delay > remaining sleeps exactly remaining and returns capture_timed_out; an already-expired deadline returns capture_timed_out immediately."
  - "CMakePresets.json untouched; the ON/OFF preset split is implemented in cmake/CvfOptions.cmake (Debug or single-config-without-type -> ON; multi-config/other -> OFF; explicit -D always wins)."
  - "tests/camera is exempted from format-check exactly like tests/abi (hash-pinned test-owner sources); both remain compiled with -Wall -Wextra -Werror."

