change_id: CVF-006
phase: AUTHOR
amendment: CI-2A / CI-2C
recorded_at: 2026-09-15
author: test-engineer
ci_evidence:
  workflow_run: windows-2022 CI run 34956274438 (round 2)
  diagnostics:
    - id: CI-2A
      file: tests/unit/cvf006_test_support.h
      locations:
        - "line 124, column 22"
        - "line 125, column 23"
      compiler_diagnostic: >-
        MSVC error C2397: conversion from 'int' to 'uint32_t' requires a
        narrowing conversion (with /W4 /WX)
      cause: >-
        make_synthetic_backend(int width = kFrameWidth, int height = kFrameHeight)
        initialized the uint32_t width/height fields of SyntheticCameraConfig
        with int parameters inside a braced initializer.
      masking_note: >-
        The header error masked later diagnostics in every tests/unit/cvf006_*
        translation unit, so the whole set was scanned after the fix.
    - id: CI-2C
      file: tests/abi/cvf006_lifecycle.c
      locations:
        - "line 1299, column 33"
        - "line 1302, column 33"
      compiler_diagnostic: >-
        MSVC warning C4310: cast truncates constant value (with /W4 /WX) at
        (char)0xC3 and (char)0xFF; char is signed on MSVC and the constants are
        above 127.
      cause: >-
        The invalid-UTF-8 probe bytes were produced by constant-to-char casts.
fixes:
  - file: tests/unit/cvf006_test_support.h
    change: >-
      The two braced initializers now use explicit
      static_cast<std::uint32_t>(width) and
      static_cast<std::uint32_t>(height), which is a non-narrowing conversion
      for MSVC /W4 /WX while the int parameters (and their call sites) are
      unchanged. make_synthetic_backend is only ever called with its defaults.
    intent_preserved: true
    values_changed: false
  - file: tests/abi/cvf006_lifecycle.c
    change: >-
      The two invalid-UTF-8 lead bytes are now held in non-constant
      unsigned char locals (invalid_utf8_two_lead = 0xC3u,
      invalid_utf8_one_lead = 0xFFu) and the char casts take those variables;
      the CI-2C locations become `(char)invalid_utf8_two_lead` and
      `(char)invalid_utf8_one_lead`. The second byte (0x28) and both NUL
      terminators are untouched.
    intent_preserved: true
    bytes_changed: false
scan:
  scope: >-
    All owned cvf006 test files: tests/abi/cvf006_lifecycle.c and
    tests/unit/cvf006_{test_support.h,deadline,reconnect,save_policy,
    degraded_log,rollback,serialization}; the two checked-in runtime fixtures
    contain no code.
  narrowing_instances_found: 2 (the CI-2A lines; both fixed)
  constant_cast_truncation_instances_found: 2 (the CI-2C lines; both fixed)
  other_observations:
    - No other `.width`/`.height` braced initializer exists in the cvf006 files.
    - No other (char)/(signed char)/(unsigned char) cast exists in the cvf006 files.
    - >-
      The remaining high constants (memset reserved fills, 0x28, 0x255-style
      literals) are not constant-to-char casts and do not trigger C4310.
    - >-
      GCC confirms the CI-2A class is a real narrowing conversion: a probe with
      the original designated-initializer form fails under
      g++ -std=c++20 -Wall -Wextra -Werror with -Werror=narrowing, while the
      static_cast form compiles clean. The WSL build did not surface it because
      CMake applies -Wno-narrowing to the cvf006_tests target; MSVC has no
      equivalent waiver for C2397.
