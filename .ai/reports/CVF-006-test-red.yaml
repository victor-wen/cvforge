author_assumptions:
  - "Internal runtime namespace is cvforwin::runtime with types RuntimeOptions, Context,
    InspectionRequest, and InspectionOutcome (brief interface_reference names)."
  - "Context::create(const RuntimeOptions&) returns a Result-like value
    (has_value()/value()/failure()) holding a std::unique_ptr<Context>; the tests call it
    with an lvalue options object."
  - "Context::inspect returns the InspectionOutcome value; the support helpers also compile
    against a Result<InspectionOutcome> return shape (try_capture_outcome overloads)."
  - "Context::warning_flags() exists and reports the context-level warning bits; the same
    bit mask (1u<<0 log sink, 1u<<1 image save) appears in the outcome."
  - "RuntimeOptions.config_root/output_root accept std::string assignment (the tests pass
    path.string()); enable_file_logging/enable_callback_logging are bools;
    camera_override accepts std::shared_ptr<cam::ICameraBackend> (assigned a
    shared_ptr<SyntheticCameraBackend>)."
  - "InspectionRequest.recipe_id/request_id accept std::string assignment; timeout_ms is
    either an integral millisecond count or a chrono duration (the RequestHolder detects
    which one compiles)."
  - "InspectionOutcome.output_json is nlohmann::json or a JSON text; image_path behaves as
    a path/string; elapsed_ms is an integral count or chrono duration (accessors are
    shape-tolerant)."
  - "Configuration layout: <config_root>/cvforwin.json plus <config_root>/recipes/*.json,
    matching the contract's global_configuration_v1 and inspection_recipe_v1 paths."
  - "Test-enabled runtime accepts camera.backend 'synthetic' (exact synthetic descriptor from
    the brief) and 'file' (device_path = absolute frames directory)."
  - "Synthetic PASS recipe: threshold 128 + min_pass_ratio 0.0 (pass_ratio >= 0 always
    passes). Synthetic FAIL recipe: threshold 255 + min_pass_ratio 1.0 (pixel (0,0) of the
    synthetic frame is black, so the required full pass ratio can never be met)."
  - "settle_frames is 0 in every fixture, so one inspect = one capture and the evaluated and
    saved frame is the last captured frame (expected sequence = capture_call_count - 1)."
  - "Degraded file sink (B10): the file-log sink is derived from output_root, so the tests
    place a regular file at <output_root>/logs (and <output_root>/log as a hedge) with
    enable_file_logging=true; initialization must still succeed with warning bit 1u<<0."
  - "Save failures (B9): after a successful initialization the output_root tree is replaced
    by a regular file so any later write below it fails (ENOTDIR / not-a-directory) even for
    a privileged user; this does not depend on the internal captures subdirectory name."
  - "Rollback (B11): a file backend whose frames directory does not exist fails at camera
    resolution, after config and diagnostics creation."
  - "Pre-capture proof (B4): with a file backend holding a 2x2 black frame first and a 5x3
    white frame second, an undersized-buffer rejection is proven to precede acquisition by
    the next successful inspect still reporting total_pixels 4."

developer_wiring_expectations:
  - "C target: C11, links the cvforwin shared library, defines CVF_TEST_FIXTURES_DIR
    (tests/fixtures/runtime; an absolute path is safest because ctest runs from the build
    directory) and CVF_TEST_TMP_DIR (writable scratch), and needs POSIX threads."
  - "C++ target: links the new runtime library, cvforwin_test_backends, OpenCV core and
    imgcodecs, Threads::Threads, and Catch2::Catch2WithMain, with src, include, and
    tests/unit on the include path."
  - "The C tests write all of their config/recipe/frame inputs below
    CVF_TEST_TMP_DIR; only tests/fixtures/runtime/valid_config is read-only fixture data."

