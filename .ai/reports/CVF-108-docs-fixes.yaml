  - id: CVF108-NBF-03
    title: docs/packaging.md package-layout comment omitted the example asset subtree
    status: fixed
    files:
      - docs/packaging.md
    exact_lines_changed:
      - "docs/packaging.md:15 — config/examples/ comment now reads 'cvforwin.json, recipes/*.json, assets/*'"
    verified_values:
      - value: "the packaging step stages the whole config/examples subtree, including assets/"
        evidence: "cmake/CvfPackage.cmake.in:50 requires config/examples/recipes and config/examples/cvforwin.json; :71 file(COPY ${CVF_SOURCE_DIR}/config/examples/ DESTINATION ${package_root}/config/examples) copies the directory contents recursively, which includes config/examples/assets/tmpl.asymmetric.png"
      - value: "staged subdirectories are config/examples (cvforwin.json, recipes/, assets/), docs/, LICENSES/, bin/, lib/, include/cvforwin"
        evidence: "cmake/CvfPackage.cmake.in:57-73; example tree listing: config/examples/cvforwin.json, config/examples/recipes/{example.pass,example.strict,template.match}.json, config/examples/assets/tmpl.asymmetric.png"
    discrepancy: none
    note: >-
      docs/development.md:82 carried the identical omission in the repository-layout listing
      (config/examples/ was described as only cvforwin.json + recipes/*.json). It was corrected
      in the same edit so the two layout descriptions in docs/ agree. This is docs-only and
      within the CVF-108 allowed scope (docs/**).

