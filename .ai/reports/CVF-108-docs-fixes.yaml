findings:
  - id: CVF108-NBF-01
    title: docs/usage.md had no coverage of the recipe assets mechanism
    status: fixed
    files:
      - docs/usage.md
    exact_lines_changed:
      - "docs/usage.md:69 — added the `assets` row to the recipe schema table"
      - "docs/usage.md:80-118 — new `### Recipe assets` section (definition, bounds table, reference rejection rules, shipped template.match example)"
    verified_values:
      - value: "assets per recipe: at most 16"
        evidence: "src/recipes/recipe.cpp:24 constexpr std::size_t k_max_asset_count = 16; enforced at :258 object.size() > k_max_asset_count"
      - value: "asset key pattern: [a-z0-9._-]{1,64}"
        evidence: "src/recipes/recipe.cpp:26 k_max_asset_key_bytes = 64; :215-218 is_asset_key -> matches_byte_pattern(key, 64, is_algorithm_key_char); :114-118 is_algorithm_key_char allows a-z, 0-9, '.', '_', '-'; error text at :265"
      - value: "asset reference length limit: 512 bytes"
        evidence: "src/recipes/recipe.cpp:25 constexpr std::size_t k_max_asset_reference_bytes = 512; enforced at :228"
      - value: "bytes per asset: 16777216 (16 MiB)"
        evidence: "src/recipes/recipe_catalog.cpp:25 constexpr std::size_t k_max_asset_bytes = 16777216u; enforced at :87 size > k_max_asset_bytes"
      - value: "total bytes per recipe: 67108864 (64 MiB)"
        evidence: "src/recipes/recipe_catalog.cpp:26 constexpr std::size_t k_max_total_asset_bytes = 67108864u; enforced at :91 running_total + size > k_max_total_asset_bytes"
      - value: "absolute paths, backslash separators, ':' drive/URI/ADS forms, '//', and empty/. /.. components rejected"
        evidence: "src/recipes/recipe.cpp:226-251 is_safe_asset_reference: front '/' rejected, find('\\\\') rejected (:231), find(':') rejected, find(\"//\") rejected, empty/'.'/'..' component rejected"
      - value: "symlink, non-regular file, and link/reparse escapes rejected"
        evidence: "src/recipes/recipe_catalog.cpp:52 symlink_status; :56-61 is_symlink/is_regular_file rejected; :63-81 weakly_canonical root/file and leading '..' component rejected"
      - value: "assets resolved under <config_root>/assets/ (recipes dir is <config_root>/recipes)"
        evidence: "src/recipes/recipe_catalog.cpp:154 assets_root = recipes_dir.parent_path() / \"assets\""
      - value: "a rejected asset rejects the whole catalog candidate; the previous snapshot stays active"
        evidence: "src/recipes/recipe_catalog.cpp:156-197 load() returns the failure before returning a RecipeCatalog; atomic swap documented in docs/usage.md:119-120"
      - value: "shipped example: recipe config/examples/recipes/template.match.json, asset key 'tmpl' -> reference 'tmpl.asymmetric.png', file config/examples/assets/tmpl.asymmetric.png"
        evidence: "config/examples/recipes/template.match.json:4-13; file present at config/examples/assets/tmpl.asymmetric.png (172 bytes)"
    discrepancy: none

