headline: >-
  CI round-3 defect in the CVF-008 clean-consumer kit: the run step passed an
  invalid `cmake -E env --modify` operation name, so cmake exited 1 before the
  consumer started (empty output). The run step now deploys the installed DLL
  next to the consumer executable with `cmake -E copy_if_different`, reports the
  exact command line plus an explicit "(no output captured)" marker on
  configure/build/deploy/run failures, and both harnesses gain local self-tests
  for this `cmake -E` syntax class. Real Windows consumer execution remains
  deferred to CI.

ci_diagnostic:
  run: 34960459232
  job: windows-2022 test-enabled package job
  observed: >-
    All 188 Windows tests and the package-verify checks passed; the clean
    consumer step then failed with `consumer run failed with exit 1:` and no
    further output.

root_cause:
  file: tests/package/package_checks.cmake
  detail: >-
    Locally reproduced: `cmake -E env --modify "PATH=prepend:<root>/bin"` is
    rejected by cmake ("Unrecognized environment manipulation argument:
    prepend", exit 1), so the consumer process was never launched and the
    captured stdout/stderr were empty. `prepend` is not a valid --modify
    operation; `path_list_prepend` is. The failure report only concatenated the
    empty output, leaving a bare headline.

fix:
  choice: >-
    Preferred option: drop the environment manipulation entirely and deploy the
    installed DLL next to the consumer executable before the run, with
    `cmake -E copy_if_different "${CVF_PACKAGE_ROOT}/bin/cvforwin.dll"
    "${cvf_consumer_bin_dir}/cvforwin.dll"`.
  rationale:
    - >-
      Deterministic loader behavior: with the Windows default SafeDllSearchMode
      the loader searches the application directory before PATH, so the
      installed DLL is pinned regardless of what else is on PATH; a
      `path_list_prepend` PATH edit can still be shadowed by a same-named DLL
      earlier in the search order and relies on a newer `--modify` feature
      surface.
    - >-
      Mirrors deployment: a host application ships cvforwin.dll beside its
      executable, so the check exercises the deployment shape rather than a
      PATH side-channel.
    - >-
      Removes the failing construct class instead of repairing its syntax, and
      `copy_if_different` is a long-stable `cmake -E` operation.
    - >-
      The check still uses only the installed package: the copied DLL comes
      from `<CVF_PACKAGE_ROOT>/bin/cvforwin.dll`.
  diagnostics_improvement:
    - >-
      New helpers `cvf_command_line` and `cvf_fail_command`: configure, build,
      deploy, and run failures now report the exact executed command line and
      the combined stdout+stderr, or the explicit marker "(no output
      captured)".
    - >-
      The missing-executable failure also names the build command line.
  consumer_comment_update: >-
    tests/package/consumer/CMakeLists.txt header comment now describes the
    DLL-deploy behavior instead of the removed PATH prepend.

scan_of_tests_package:
  cmake_e_invocations:
    - >-
      Exactly one `cmake -E` invocation exists in tests/package/** (the consumer
      DLL deploy). It uses `copy_if_different`, which is listed by
      `cmake -E help`; the harness now cross-checks every extracted `-E <op>`
      against that list.
  locally_checkable_windows_steps:
    - >-
      Already validated on WSL: check-script relative/missing/empty root
      refusals, consumer configure gate (absolute root accepted, relative root
      rejected), JSON syntax, C11 syntax/object compile against the installed
      include layout, clang-format.
    - >-
      Newly added local checks: `cmake -E env --modify` positive control with
      `path_list_prepend` (accepted and actually prepends), negative control
      with `prepend` (non-zero exit), the `cmake -E copy_if_different` deploy
      emulation, and a static invariant that the deployed DLL directory equals
      the consumer executable directory with no `--modify` usage in the script.
  not_checkable_locally:
    - >-
      The real consumer link/run, dumpbin export/dependency checks, and the
      installed package layout remain Windows-only and are not claimed here.

