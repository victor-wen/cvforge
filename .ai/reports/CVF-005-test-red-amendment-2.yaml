schema_version: 1
change_id: CVF-005
phase: AUTHOR
amendment: TD-1, TD-2
date: 2026-09-15
owner: test-engineer
subject: >-
  Two test-side defects found by the developer's full run (240/242): an invalid
  diagnostics bound in the B4 rotation case (TD-1) and a wrong both-empty-identifier
  expectation (TD-2). Both are corrected without weakening assertions or reducing
  coverage; production code was not touched.

defects:
  - id: TD-1
    file: tests/unit/cvf005_diagnostics_logging_test.cpp
    test_case: "CVF-005 B4: rolling files stay within max_files"
    description: >-
      Both rotation sections called Diagnostics::create with max_file_bytes=128, below the
      frozen minimum of 1024 (the same bound the B1 case rejects at 1023), so create()
      returned diagnostics_invalid_config instead of a working instance.
    fix: >-
      max_file_bytes is now 1024 (the valid minimum) in both sections, and each logged
      entry carries a 96-byte payload ("cvf005 rotation entry <n>" + 96 dots) so 40 entries
      write well over 1024 bytes and rotation is genuinely exercised. max_files stays 2 in
      one section and 1 in the other, and the assertions (log file count <= max_files,
      >= 1, base cvforwin.log present, last entry in the active file) are unchanged.
    coverage_effect: none
  - id: TD-2
    file: tests/unit/cvf005_capture_store_test.cpp
    test_case: "CVF-005 B8 boundary: empty identifiers become unnamed"
    description: >-
      The "both identifiers empty" section expected the double underscore
      "_unnamed__unnamed_", but the frozen grammar joins the fields with single
      underscores, so the tail is "_unnamed_unnamed_0.png".
    fix: >-
      The expectation now pins the exact frozen-derived suffix
      (name.ends_with("_unnamed_unnamed_0.png")) and additionally asserts that the
      impossible double-underscore form does not occur
      (name.find("_unnamed__unnamed_") == std::string::npos).
    coverage_effect: none (assertion strengthened)

assertions_changed: none
