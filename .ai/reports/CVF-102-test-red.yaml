    synthetic_only: true
  - path: CMakeLists.txt
    change: >-
      added WIN32 + CVFORWIN_BUILD_TESTS + CVFORWIN_BUILD_TEST_BACKENDS gated
      target cvf102_windows_uvc_tests, registered via catch_discover_tests
      (add_test), immediately after the CVF-101 block
    sha256_after_change: ca6c065b9f0be743c140f05cf6e5dc7bff9790ca16a6cccee45ddd90504b3b34
    lines_added: 38
    lines_removed: 0

seam_selection:
  header: src/camera/uvc_windows/uvc_backend.h
  declaration_used: >-
    cvforwin::camera::UvcCameraBackend::worker_snapshot() -> UvcWorkerSnapshot,
    with the brief-frozen fields com_init_count, com_uninit_count,
    mf_startup_count, mf_shutdown_count, commands_marshalled, worker_thread_id,
    last_caller_thread_id, worker_running.
  note: >-
    The seam accessor is frozen by the CVF-102 change contract
    (.ai/changes/CVF-102.yaml frozen_test_seam). The snapshot fields are read
    through `auto`, so the test does not depend on any non-frozen snapshot type
    spelling. The test file includes frozen headers only; no production .cpp was
    read.

cases:
  acceptance:
    - id: B1
      name: "CVF-102 B1: a no-COM caller thread completes enumerate and close without apartment failure"
      observable: >-
        construct + enumerate(default 5000ms) + close on a std::thread that never
        called CoInitializeEx: enumerate succeeds and is empty; close leaves
        worker_running false and com/mf counts balanced; commands_marshalled > 0
        and worker_thread_id != last_caller_thread_id.
    - id: B2
      name: "CVF-102 B2: an STA caller thread completes enumerate and close without apartment failure"
      observable: >-
        same sequence on a thread that called CoInitializeEx(COINIT_APARTMENTTHREADED)
        and CoUninitialize afterwards: enumerate succeeds empty, worker is owned
        and marshalled, close balances and stops the worker.
    - id: B3
      name: "CVF-102 B3: open with an identity that resolves nothing fails camera_not_found with no fallback"
      observable: >-
        backend.open(absent descriptor) fails with status camera_not_found and
        code camera_not_found; never a first-device fallback.
    - id: B3
      name: "CVF-102 B3: identity resolution is exact and never falls back to the first candidate"
      observable: >-
        resolve_identity: one match resolves that descriptor; zero match ->
        camera_not_found; two matches (shared VID/PID) -> camera_identity_ambiguous
        and never the first; empty selector -> selector_empty.
    - id: B4
      name: "CVF-102 B4: close before any open and repeated close are idempotent and balanced"
      observable: >-
        close on a never-opened backend leaves worker_running false and com/mf
        counts balanced; repeated close calls keep both.
    - id: B4
      name: "CVF-102 B4: an open followed by destruction without close leaves no observable worker"
      observable: >-
        construct + failing open, then destruct without close; a subsequent fresh
        backend still reaches a stopped and balanced state.
    - id: B5
      name: "CVF-102 B5: a failed startup leaves no running worker and balances COM/MF lifetime"
      observable: >-
        failing open reports a documented camera failure (camera_not_found with
        zero devices, or camera_io for a startup failure); close afterwards leaves
        worker_running false and com/mf counts balanced.
    - id: B6
      name: "CVF-102 B6: an already-expired deadline fails immediately for every operation"
      observable: >-
        Deadline::immediate for enumerate/open/capture/reconnect: each returns a
        timeout failure immediately (elapsed < 2 s); capture uses
        code capture_timed_out.
  marshalling:
    - name: "CVF-102: every command is marshalled to the owned worker thread"
      observable: >-
        commands_marshalled strictly increases across enumerate and
        worker_thread_id != last_caller_thread_id.
  boundary:
    - name: "zero enumerable devices: enumerate succeeds empty and open fails camera_not_found"
    - name: "close before any open; repeated close"
    - name: "open followed immediately by destruction without an explicit close"
  negative:
    - name: "capture before open fails with a documented camera failure, no crash"
    - name: "reconnect before open fails with a documented camera failure, no crash"

expected_red:
  reason: >-
    The frozen accessor UvcCameraBackend::worker_snapshot() and the
    UvcWorkerSnapshot type do not exist yet, so the test TU cannot compile against
    the real frozen header. This is the honest RED for a pre-implementation author
    phase.
  windows_suite_execution: "authored-but-not-executed on this Linux host; not claimed as passing"
  portable_suite: "unaffected: the TU is empty off Windows and the target is not configured on Linux"

