summary: >-
  Independent black-box Windows component tests were authored for the frozen UVC
  worker / COM+Media Foundation lifetime seam before the seam accessor or its
  implementation exists. RED is honest and structural: the frozen accessor
  UvcCameraBackend::worker_snapshot() is absent from the frozen header, so the
  test translation unit cannot compile against the real include tree (fatal
  errors, exit 1). No Windows execution output is fabricated or claimed. The
  portable canonical commands stay green and are explicitly not evidence for
  this Windows-only change.

