assumptions:
  - >-
    The frozen seam is a public member UvcCameraBackend::worker_snapshot() visible
    from src/camera/uvc_windows/uvc_backend.h on _WIN32; the CVF-102 change
    contract is the authority and was not readable through this session's
    read policy, so the brief's named accessor and field list are taken verbatim.
  - >-
    worker_thread_id and last_caller_thread_id are comparable values (thread ids);
    the marshalling assertion only requires inequality while a command executes.
  - >-
    An already-expired deadline yields the broad timeout status for
    enumerate/open/capture/reconnect, and capture_timed_out for capture, matching
    the frozen uvc_backend.h documentation.
  - >-
    capture/reconnect before open on the UVC backend fail with a documented camera
    failure (camera_not_found or camera_io); the case asserts a documented failure
    and no crash rather than one particular code.

