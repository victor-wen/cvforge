    sha256: ce2cc80ee41e7cf5579dd4cf6c7a46f29eaa066179912ab46beb54e195562109
    windows_only: true
    guard: "#if defined(_WIN32)"
    includes_production_surface: >-
      frozen headers only: src/camera/camera_backend.h,
