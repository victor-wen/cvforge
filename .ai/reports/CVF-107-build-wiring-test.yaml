role: developer
title: "Developer-owned regression test pinning the opt-in Windows UVC hardware-suite build wiring"
status: COMPLETE
date: 2026-09-19

summary: >-
  Added tests/unit/test_cvf107_hardware_wiring_developer.cpp, a portable Catch2 v3
  test that reads the real CMakeLists.txt at run time and pins the CVF-107 hardware
  suite wiring: add_executable(cvf_hw_uvc_smoke ...) must be lexically inside both
  if(CVFORWIN_BUILD_HARDWARE_TESTS) and a nested if(WIN32); the source must be exactly
  tests/hardware/uvc_smoke.cpp; the target must never be registered with CTest; the
  target-scoped MSVC _CRT_SECURE_NO_WARNINGS opt-out must not reach any unexpected
  target; and the target must appear in no file under .github. Registered as the
  portable target cvf107_hardware_wiring_developer_tests inside if(CVFORWIN_BUILD_TESTS)
  only, with a target-scoped CVFORWIN_TEST_SOURCE_DIR compile definition.

