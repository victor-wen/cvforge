    note: >-
      New developer-owned regression test (437 lines). Four TEST_CASEs:
      (a) opt-in Windows gate + exact source path, (b) never CTest-registered,
      (c) _CRT_SECURE_NO_WARNINGS target-scoped, (d) absent from .github.
  - path: CMakeLists.txt
    sha256: 273b750b2126b957f04a92deb4fb4267fb367663d3074324866a2eb01b56e9c4
    note: >-
      Added the portable cvf107_hardware_wiring_developer_tests target inside the
      existing if(CVFORWIN_BUILD_TESTS) block (after recipe_asset_reference_developer_tests,
      before the block endif): add_executable, tests/unit include dir, Catch2::Catch2WithMain,
      target-scoped CVFORWIN_TEST_SOURCE_DIR="${CMAKE_CURRENT_SOURCE_DIR}", CXX_STANDARD 20,
      cvforwin_apply_test_compile_options, cvforwin_apply_sanitizers, catch_discover_tests.
      The pre-existing (uncommitted CVF-107 build-fix) cvf_hw_uvc_smoke if(MSVC)
      _CRT_SECURE_NO_WARNINGS block was not touched. No other target's flags changed.

