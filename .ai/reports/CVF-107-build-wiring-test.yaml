deviations:
  - id: assertion-c-pre-existing-exception
    topic: >-
      The task text says _CRT_SECURE_NO_WARNINGS is applied "only to cvf_hw_uvc_smoke and not to any
      other target". The baseline already applies the identical opt-out to cvf006_lifecycle
      (CMakeLists.txt:774, pre-existing CVF-006 C ABI test), and the hard constraint forbids changing
      any other target's flags. A literal "exactly one target" assertion cannot be GREEN.
    resolution: >-
      The test asserts the scoped property that gives the invariant its value: the opt-out is only ever
      applied through target_compile_definitions(... PRIVATE ...) (never add_compile_definitions /
      add_definitions), cvf_hw_uvc_smoke must carry it, and the exact set of targets carrying it must be
      the documented allow-list {cvf006_lifecycle, cvf_hw_uvc_smoke}. Mutation (ii) proves the intended
      failure mode: any additional target acquiring the opt-out goes RED. The exception is documented
      in the test header and in this report.
  - id: assertion-d-not-mutation-tested
    topic: "A .github mutation (adding a cvf_hw_uvc_smoke reference) would violate the hard constraint 'Do NOT modify .github/**'."
    resolution: >-
      Assertion (d) is exercised GREEN on the real .github tree. Its failure path is a direct
      contains_identifier check over every regular file under .github, so a future reference fails the
      named check; no mutation was applied to .github because the constraint forbids editing it.
  - id: catch2-message-macro
    topic: "The vendored Catch2 v3.16.0 in this toolchain does not declare CHECK_MESSAGE/REQUIRE_MESSAGE."
    resolution: >-
      Added two local helpers, check_message()/require_message(), that attach the invariant text with
      INFO and then call CHECK/REQUIRE. A failing REQUIRE throws Catch::TestFailureException out of the
      helper and aborts the test case exactly like an inline REQUIRE.

hard_constraints_respected:
  - "tests/hardware/uvc_smoke.cpp not modified"
  - "src/**, include/**, .github/**, .ai/project-contract.yaml not modified"
  - "the new file was not added to .ai/test-ownership.yaml"
  - "no other target's flags changed"
