host: Linux (WSL); native Windows MSVC execution deferred to windows-tests-quality CI

summary: >-
  Independent VERIFY of the frozen UVC worker / COM+Media Foundation lifetime seam.
  The frozen seam exists and matches the CVF-102 frozen_test_seam exactly: the
  UvcWorkerSnapshot struct carries the eight frozen fields with the frozen widths
  and the accessor is UvcWorkerSnapshot UvcCameraBackend::worker_snapshot() const
  noexcept in src/camera/uvc_windows/uvc_backend.h. The implementation isolates
  COM and Media Foundation on one application-created worker thread:
  CoInitializeEx(nullptr, COINIT_MULTITHREADED) and MFStartup run in the worker
  start hook, and MFShutdown then CoUninitialize run in reverse order in the
  worker teardown hook before join. The CMake target cvf102_windows_uvc_tests is
  registered only under WIN32 AND CVFORWIN_BUILD_TESTS AND
  CVFORWIN_BUILD_TEST_BACKENDS; windows-msvc-release keeps TEST_BACKENDS=OFF and
  windows-msvc-tests sets both ON, so the target never exists in the release or
  hosted no-camera jobs. The owned test compiles -D_WIN32 -std=c++20
  -Wall -Wextra -Werror -fsyntax-only against the real include tree with exit 0.
  The portable canonical gates are green (284/284). One requirement-derived
  coverage gap was closed in this session (see amendment); no assertion was
  removed, skipped, disabled, or weakened. No implementation defect was found
  against the contract.

frozen_seam_check:
  authority: .ai/changes/CVF-102.yaml#frozen_test_seam
  header: src/camera/uvc_windows/uvc_backend.h
  struct: UvcWorkerSnapshot
  fields_match: true
  fields:
    - com_init_count: "std::uint64_t"
    - com_uninit_count: "std::uint64_t"
    - mf_startup_count: "std::uint64_t"
    - mf_shutdown_count: "std::uint64_t"
    - commands_marshalled: "std::uint64_t"
    - worker_thread_id: "std::uint32_t"
    - last_caller_thread_id: "std::uint32_t"
    - worker_running: "bool"
  accessor_match: "UvcWorkerSnapshot worker_snapshot() const noexcept"
  result: MATCH

worker_isolation_check:
  worker_header: src/camera/uvc_windows/uvc_command_worker.h
  start_hook: "CoInitializeEx(nullptr, COINIT_MULTITHREADED) then MFStartup(MF_VERSION, MFSTARTUP_LITE)"
  teardown_hook: "teardown_stream, callback release, MFShutdown, CoUninitialize (reverse order)"
  caller_thread_assumption: "none; record_caller() only stores GetCurrentThreadId"
  result: ISOLATED

cmake_gating_check:
  target: cvf102_windows_uvc_tests
  gate: "if(WIN32 AND CVFORWIN_BUILD_TESTS AND CVFORWIN_BUILD_TEST_BACKENDS)"
  registered_via: catch_discover_tests
  windows_msvc_release:
    CVFORWIN_BUILD_TESTS: ON
    CVFORWIN_BUILD_TEST_BACKENDS: OFF
  windows_msvc_tests:
    CVFORWIN_BUILD_TESTS: ON
    CVFORWIN_BUILD_TEST_BACKENDS: ON
  linux_configure_target_count: 0
  result: CORRECT

