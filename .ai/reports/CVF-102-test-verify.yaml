  owner: test-engineer
  reason: >-
    The brief in_scope requires every camera backend operation to be exercised from
    a thread with no COM initialization and from an STA thread, but B1/B2 drove
    only enumerate and close and the marshalling case only enumerate. Requirement-derived
    edge cases were added; no assertion was removed, skipped, disabled, or weakened.
  added:
    - "exercise_apartment now drives open, capture, and reconnect in addition to enumerate and close on the caller thread; B1/B2 assert each fails with a documented camera failure (camera_not_found or camera_io) rather than an apartment failure."
    - "the marshalling case asserts commands_marshalled strictly increases across enumerate, open, capture, and reconnect with worker_thread_id != last_caller_thread_id after each."
