findings:
  - severity: non_blocking
    file: src/artifacts/save_worker.cpp
    line: 154-167
    issue: >-
      Cancellation/commit TOCTOU, intrinsic to CVF-104 (not a composition regression). When
      wait_until() times out it calls cancel_target() (save_worker.cpp:81), which inserts the
      executing id into cancelled_ids_ under mutex_; but execute() may already have passed its
      mutex-guarded is_cancelled check (157) and then commits (167). The final file is published
      after cancellation in that narrow window, against CVF-104's "no cancelled artifact is
      published" invariant. Caller-visible behavior stays conservative and correct: no image_path
      is reported, an optional save only sets warning_image_save_failed, a required save still
      yields required_artifact_error/timeout, and the orphan file stays inside the managed
      captures root subject to background retention.
    required_fix: >-
      developer: re-check cancellation under mutex_ immediately before sink_.commit() (or make
      commit conditional on a cancel flag consumed under the same lock) and discard the temp
      when the mark arrived inside the window.
  - severity: non_blocking
    file: src/runtime/context.cpp
    line: 521-525
    issue: >-
      The required-save queue-saturation path busy-waits in 1 ms sleep_for steps on the
      inspection caller thread until the absolute deadline expires. It is bounded by the single
      deadline (honoring "waits only to the absolute deadline") and reachable only after stacked
      prior timeouts (the gate serializes inspects, so both worker slots must already be full),
      but a deadline-bounded condition-variable wait on worker completion would avoid burning
      the remaining budget in a poll loop while holding the gate.
    required_fix: >-
      developer (optional hardening): replace the sleep loop with a deadline-bounded wait on the
      save worker's state_cv_ or an equivalent completion/cancellation signal.
