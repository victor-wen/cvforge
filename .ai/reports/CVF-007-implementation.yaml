    No Windows compile, link, ABI, export, package, or hardware execution evidence is claimed in
    this report. The authoring host is WSL: there is no Windows, no MSVC, no Media Foundation, and
    no camera, and the UVC module has zero compile rules in every WSL build tree. The best-effort
    forced -D_WIN32 probes below are syntax self-checks against throwaway stub headers and are not
    ABI or runtime evidence.
  required_environment: "windows-2022 runner (MSVC v143, x64) for CI; a designated Windows 10/11 x64 station with a UVC camera for the opt-in suite"
  checklist:
    - "CI: cmake --preset windows-msvc-release; build; ctest; abi-check; package; package-verify (windows_full_quality) all exit 0."
    - "MSVC compiles src/camera/uvc_windows/uvc_backend.cpp with /W4 /permissive- /utf-8 /WX; any header/API mismatch is fixed there (no MSVC evidence exists yet)."
    - "cvforwin.dll links the Media Foundation system libraries mfplat.dll, mf.dll, mfreadwrite.dll; the runtime dependency allowlist shows no non-system DLL; export set is exactly the five cvf_* symbols."
    - "Configure with -DCVFORWIN_BUILD_HARDWARE_TESTS=ON; confirm cvf_hw_uvc_smoke builds on Windows only and is absent from ctest -N and from all presets/workflows."
    - "Station: run 'uvc_smoke --list' and record every descriptor (device_path, vendor_id, product_id, friendly_name); confirm each value is clean single-line text with no embedded NUL or trailing control byte (F1 regression check)."
    - "Station: set CVF_HW_UVC_DEVICE_PATH (or CVF_HW_UVC_VID/PID/NAME) and run the suite; confirm it refuses to run without an explicit selector (never a first-device fallback)."
    - "Station boundary run: CVF_HW_EXPECT_ZERO_DEVICES=1 on a camera-less station asserts empty enumeration and camera_not_found resolution."
    - "Station manual run: CVF_HW_UNPLUG_TEST=1 exercises the unplug/replug bounded reconnect + recapture procedure (at most one retry)."
    - "Planar-conversion coverage gap: the primary RGB32 negotiation normally makes Media Foundation convert internally, so the native I420/YV12/NV12 fallback conversion may not be exercised by a single station camera. Record the negotiated media subtype for the station device and, when available, repeat the run on a device/driver that surfaces planar YUV so the F2 chroma-stride/height/width path is hardware-verified."
    - "Record raw command lines, exit codes, and outputs for the hardware run; a PASS on representative hardware is required before FCT deployment."

