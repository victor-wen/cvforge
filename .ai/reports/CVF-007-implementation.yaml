summary: >-
  Implemented the Windows Media Foundation UVC backend (src/camera/uvc_windows/uvc_backend.h/.cpp),
  wired the runtime backend factory ("uvc" selects UvcCameraBackend on Windows builds and fails
  with camera_not_found on portable builds), added the WIN32-only CMake target with Media
  Foundation system libraries only, added option CVFORWIN_BUILD_HARDWARE_TESTS (default OFF) and
  the WIN32-only, never-CI-registered cvf_hw_uvc_smoke target for tests/hardware/uvc_smoke.cpp,
  and added a developer regression test registered with CTest. Portable WSL evidence: debug
  263/263 tests (262 pre-existing + 1 developer case), ASan 263/263 with zero sanitizer findings,
  format-check 82 files, static-analysis exit 0, and no compiler warnings in either build. The
  Windows-only sources are excluded from the WSL build (zero compile rules and no compile-command
  entry) and were additionally checked with best-effort forced -D_WIN32 syntax probes, which are
  explicitly NOT Windows compile/link/ABI evidence. Windows MSVC build, DLL linking, ABI/export
  checks, and the opt-in hardware smoke suite remain deferred to windows-2022 CI and a designated
  Windows 10/11 station with UVC hardware.

files:
  created:
    - path: src/camera/uvc_windows/uvc_backend.h
      role: >-
        Windows-only declaration of UvcCameraBackend (final, default-constructible,
        implements cvforwin::camera::ICameraBackend, backend_key "uvc"); the whole declaration
        is inside #if defined(_WIN32) and no Media Foundation type is exposed.
    - path: src/camera/uvc_windows/uvc_backend.cpp
      role: >-
        Media Foundation implementation: enumeration/identity, exactly-one resolution, open and
        format selection, deadline-bounded asynchronous capture with BGR8 normalization,
        reconnect, idempotent close, RAII COM, no escaping exceptions.
    - path: tests/unit/test_uvc_runtime_factory.cpp
      role: >-
        Developer-owned regression: portable builds assert that a valid "uvc" config fails
        Context::create with camera_not_found/camera_not_found; Windows builds statically pin
        the UvcCameraBackend interface, backend_key, idempotent close, and capture-before-open
        camera_io.
  modified:
    - path: src/runtime/context.cpp
      role: >-
        build_backend(): under _WIN32 includes camera/uvc_windows/uvc_backend.h and constructs
        UvcCameraBackend for camera.backend "uvc"; elsewhere the same config fails with
        camera_not_found/camera_not_found (backend unavailable). Comment updated.
    - path: CMakeLists.txt
      role: >-
        Added the WIN32-only cvforwin_uvc_windows static library (links mfplat, mf, mfreadwrite,
        mfuuid, ole32, opencv_imgproc), linked it privately into cvforwin_runtime under WIN32,
        registered cvf007_developer_tests via catch_discover_tests, and added the
        CVFORWIN_BUILD_HARDWARE_TESTS/WIN32-only cvf_hw_uvc_smoke target that is never added to
        CTest or a workflow.
    - path: cmake/CvfOptions.cmake
      role: >-
        Added option CVFORWIN_BUILD_HARDWARE_TESTS (BOOL, default OFF) documenting that the UVC
        hardware suite is opt-in, Windows-only, and never a mandatory CI gate.

implementation:
  descriptor_mapping:
    - "device_path: MF_DEVSOURCE_ATTRIBUTE_SOURCE_TYPE_VIDCAP_SYMBOLIC_LINK converted from UTF-16 to UTF-8; devices without a symbolic link are not enumerated (they have no stable identity) rather than being given a guessed path."
    - "vendor_id/product_id: first four-hex-digit value after the identity boundaries 'vid_'/'pid_' inside the device instance ID contained in the symbolic link, lowercased; malformed or absent values stay empty (the descriptor contract allows empty)."
    - "friendly_name: MF_DEVSOURCE_ATTRIBUTE_FRIENDLY_NAME converted to UTF-8."
    - "backend_key is always the literal \"uvc\"."
  behavior:
    - "enumerate: MFStartup/MFCreateAttributes/MFEnumDeviceSources; one descriptor per video-capture device; zero devices is a successful empty list, never a failure or fallback."
    - "open: re-enumerates, resolves exactly one descriptor through camera::resolve_identity (zero or multiple matches fail as camera_not_found, no first-device fallback), activates IMFMediaSource, creates the async source reader, and selects the closest supported format."
    - "format selection: first requests RGB32 at the configured width/height and frame rate (rational milli-fps) with MF_SOURCE_READER_ENABLE_ADVANCED_VIDEO_PROCESSING so Media Foundation inserts decoders/converters; falls back to the closest convertible native media type scored by size distance, frame-rate distance, and pixel-format preference; last resort is an unconstrained RGB32 request."
    - "capture: fails camera_io/camera_not_open when closed, fails timeout/capture_timed_out for an already-expired deadline, issues an asynchronous ReadSample, waits on the callback condition variable, and on deadline expiry cancels the pending read with IMFSourceReader::Flush (bounded OnFlush wait; a stream that cannot be flushed is marked for reconnect instead of being reused)."
    - "frame normalization: ConvertToContiguousBuffer plus IMF2DBuffer (stride-aware, bottom-up handled) or IMFMediaBuffer fallback; converts RGB32/ARGB32 (BGRA), RGB24, YUY2, UYVY, L8, NV12, I420, and YV12 to an owned continuous BGR8 cv::Mat, resizes to the configured dimensions when needed, and increments a monotonic sequence."
    - "reconnect: retains the last opened identity, releases the reader/source, re-enumerates and re-activates; a device that has not reappeared fails camera_io/camera_disconnected so capture_with_one_retry (at most one reconnect plus one recapture) stays bounded."
    - "close: idempotent, deterministic COM release plus MFShutdown; safe on a never-opened backend and after failed opens."
    - "no exception escapes: every Result-returning operation contains catch-all conversion to internal_error/internal_exception; COM objects are RAII (local ComPtr, per-operation COM apartment, reference-counted MF session) and no vendor SDK is used."
  runtime_integration:
    - "src/runtime/context.cpp: camera.backend \"uvc\" -> std::make_shared<camera::UvcCameraBackend>() on _WIN32."
    - "Portable builds: camera.backend \"uvc\" -> camera_not_found/camera_not_found with the message 'the uvc camera backend is only available in Windows Media Foundation builds'."
  cmake:
    - "cvforwin_uvc_windows compiles src/camera/uvc_windows/uvc_backend.cpp only under if(WIN32) and links the Media Foundation system libraries mfplat/mf/mfreadwrite/mfuuid plus ole32 (COM) and opencv_imgproc; no vendor SDK, no Windows header outside the module."
    - "cvforwin_runtime links cvforwin_uvc_windows privately under WIN32, which propagates the system libraries to the DLL."
    - "CVFORWIN_BUILD_HARDWARE_TESTS=ON on WIN32 builds cvf_hw_uvc_smoke from the hash-pinned tests/hardware/uvc_smoke.cpp and links cvforwin_uvc_windows plus opencv_core; the target is deliberately absent from CTest and all presets/workflows."
  developer_test:
    - "Registered as cvf007_developer_tests via catch_discover_tests; contributes exactly one CTest case (#258)."

