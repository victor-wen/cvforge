review_amendment:
  recorded_at: 2026-09-15
  author: developer
  trigger: >-
    Independent review REQUEST_CHANGES on src/camera/uvc_windows/uvc_backend.cpp:
    F1 (high, embedded trailing NUL in identity strings) and F2 (medium, planar chroma
    stride/bounds), plus non-blocking notes.
  files_touched:
    - src/camera/uvc_windows/uvc_backend.cpp
  findings_addressed:
    - id: F1
      severity: high
      finding: >-
        attribute_string passed GetAllocatedString's reported character count into wide_to_utf8;
        when the count includes the terminating NUL, the converted device_path and friendly_name
        carried an embedded trailing NUL that the rest of the library treats as invalid text.
      fix: >-
        wide_to_utf8 no longer trusts the reported count for NUL handling: it scans the UTF-16
        source up to the reported length, stops at the first NUL character, and additionally
        truncates the produced UTF-8 at the first NUL byte. Identity values are therefore clean
        under either GetAllocatedString length convention (the current documentation states the
        count excludes the terminator, but older implementations are reported to include it, and
        the descriptor contract must hold regardless).
      evidence: "forced -D_WIN32 strict syntax probe of uvc_backend.cpp exit 0; no WSL impact (Windows-only source)"
    - id: F2
      severity: medium
      finding: >-
        copy_planar_rows addressed I420/YV12 chroma rows with the luma stride, copied only
        height/4 chroma rows with a full-width memcpy, and the only length check compared the
        tightly packed size against the locked buffer. A padded-stride planar device could drive
        reads past the locked sample buffer.
      fix: >-
        Planar 4:2:0 conversion now follows the documented Media Foundation layout: each chroma
        plane has half the luma stride (S/2) and half the luma height (H/2), plane offsets are H*S
        and H*S + (H/2)*(S/2), and each chroma row carries W/2 samples. I420 and YV12 are both
        re-ordered into the canonical Y,U,V layout and converted with COLOR_YUV2BGR_I420. A new
        required_extent_bytes() computes the exact byte extent addressed for the actual subtype,
        stride and layout (including padding), and convert_video_buffer() rejects any sample whose
        locked length (IMF2DBuffer::GetContiguousLength, or IMFMediaBuffer::Lock current length)
        is smaller than that extent; a locked buffer that reports zero bytes is rejected as an
        empty sample rather than being treated as unvalidated. Planar paths additionally require a
        top-down, even stride and even width/height. Reference: Media Foundation "Image Stride"
        (planar YV12 example: chroma planes have half the stride and half the height of the luma
        plane).
      evidence: "forced -D_WIN32 strict syntax probe of uvc_backend.cpp exit 0; no WSL impact (Windows-only source)"
  non_blocking_notes_addressed:
    - id: N1
      note: "capture flush grace could exceed the remaining deadline"
      change: >-
        cancel_pending_read(deadline) waits for OnFlush for at most min(k_flush_grace,
        deadline.remaining()); the asynchronous Flush request is still issued when the deadline is
        spent, but the stream is then marked needs_reconnect_ and any late completion is cleared,
        so the capture wait can never extend past the deadline.
    - id: N2
      note: "format negotiation not deadline-bounded"
      change: >-
        The activation deadline is threaded through activate -> start_stream -> select_format ->
        select_native_format. Every negotiation attempt, each native-type probe, and the final
        selection check deadline.expired() and fail with timeout/deadline_expired.
    - id: N3
      note: "MSVC /W4 risk spots (unused members, casts, wide-string usage)"
      change: >-
        Removed the unused ReadCallback::read_timestamp_ member and its stores (the OnReadSample
        timestamp parameter is now intentionally unnamed). Casts and wide-string handling were
        re-checked with the strict probe running the project warning set
        (-Wall -Wextra -Wpedantic -Wshadow -Wconversion -Wsign-conversion -Wnon-virtual-dtor
        -Wold-style-cast -Wcast-align -Wunused -Woverloaded-virtual -Wdouble-promotion -Wformat=2
        -Wimplicit-fallthrough -Wnull-dereference -Werror) with zero diagnostics.
    - id: N4
      note: "add a chroma-stride comment"
      change: >-
        copy_planar_rows and required_extent_bytes now document the S/2 chroma pitch, H/2 chroma
        plane height, W/2 chroma row width, plane offsets, and the canonical Y,U,V ordering.
    - id: N5
      note: "planar-conversion coverage gap for the station run"
      change: >-
        Added to windows_deferred.checklist: the primary RGB32 negotiation normally makes Media
        Foundation convert internally, so the native I420/YV12/NV12 fallback may not be exercised
        by one station camera; the station run must record the negotiated subtype and, where
        available, use a device/driver that surfaces planar YUV.
  fresh_commands:
    - command: "cmake --preset wsl-gcc-debug"
      exit_code: 0
      counts: "configure OK; log .ai/validation/cvf007-developer/logs/configure-wsl-gcc-debug.log"
    - command: "cmake --build --preset wsl-gcc-debug --parallel"
      exit_code: 0
      counts: "all targets built, 0 compiler warnings; log .../logs/build-wsl-gcc-debug.log"
    - command: "ctest --preset wsl-gcc-debug --output-on-failure"
      exit_code: 0
      counts: "263/263 passed, 0 failed (test #258 is the CVF-007 developer case); log .../logs/ctest-wsl-gcc-debug.log"
    - command: "cmake --build --preset wsl-gcc-debug --target format-check"
      exit_code: 0
      counts: "format-check passed: 82 file(s) conform; log .../logs/format-check.log"
    - command: "cmake --preset wsl-clang-analysis && cmake --build --preset wsl-clang-analysis --target static-analysis --parallel"
      exit_code: 0
      counts: "static-analysis passed: 21 file(s) (uvc_backend.cpp has no Linux compile command and is skipped by clang-tidy); log .../logs/static-analysis.log"
    - command: "cmake --preset wsl-gcc-asan && cmake --build --preset wsl-gcc-asan --parallel && ctest --preset wsl-gcc-asan --output-on-failure"
      exit_code: 0
      counts: "263/263 passed under ASan/UBSan, 0 sanitizer findings; logs configure-wsl-gcc-asan.log, build-wsl-gcc-asan.log, ctest-wsl-gcc-asan.log"
    - command: "bash .ai/validation/cvf007-developer/win-syntax-probe.sh"
      exit_code: 0
      counts: "4/4 forced -D_WIN32 probes pass (developer test and hardware suite against the real uvc_backend.h; backend under stub Windows/MF headers with basic and project warning sets); non-evidence"
    - command: "python3 .ai/validation/cvf007-developer/check-test-ownership.py"
      exit_code: 0
      counts: "42 pinned test-owner files checked, 0 mismatches (tests/hardware/uvc_smoke.cpp hash unchanged)"
  windows_impact_statement: >-
    Both fixes live entirely in the Windows-only translation unit, so the portable WSL suite is
    provably unaffected (the file has zero compile rules in the Linux build). They are validated
    locally only by the forced -D_WIN32 syntax probes; the windows-2022 MSVC build must re-verify
    compilation and linking, `uvc_smoke --list` must confirm clean identity strings (F1), and a
    planar-YUV-capable station device is required to hardware-verify the F2 conversion path.

ci_amendment:
  recorded_at: 2026-09-15
  author: developer
  trigger: >-
    windows-2022 CI run 34950421705 failed in both jobs with MSVC error C3668 at
    src/camera/uvc_windows/uvc_backend.cpp(729,6):
    'cvforwin::camera::`anonymous-namespace'::ReadCallback::~ReadCallback': method with override
    specifier 'override' did not override any base class methods.
  root_cause: >-
    IMFSourceReaderCallback is a COM interface and IUnknown declares no virtual destructor, so
    "~ReadCallback() override = default;" is invalid. GCC and the WSL-only build accepted it
    silently because the local probe stub declared a virtual destructor on IUnknown, which made
    the probe blind to exactly this defect class.
  fix:
    file: src/camera/uvc_windows/uvc_backend.cpp
    change: >-
      Removed the override specifier from ReadCallback's destructor: it is now
      "~ReadCallback() = default;" with a comment stating that the COM base has no virtual
      destructor (MSVC C3668). No behavior changed.
    hardening: >-
      core::Result<cv::Mat> converted in capture_or_failure() is no longer const so that
      std::move(converted).value() binds the rvalue overload and moves the frame instead of
      silently copying it. Quality only; no observable behavior change.
  msvc_risk_scan:
    destructors: >-
      ReadCallback's destructor was the only destructor carrying an override specifier in the
      translation unit. UvcCameraBackend::~UvcCameraBackend() has no override specifier in the
      .cpp, and the header's "~UvcCameraBackend() override;" is valid because ICameraBackend
      declares a virtual destructor.
    com_method_signatures: >-
      QueryInterface(REFIID, void**), AddRef(), Release(),
      OnReadSample(HRESULT, DWORD, DWORD, LONGLONG, IMFSample*), OnFlush(DWORD) and
      OnEvent(DWORD, IMFMediaEvent*) all carry STDMETHODCALLTYPE and match the SDK declarations
      (IMFSourceReaderCallback has no OnStreamError method; the source reader reports stream
      errors through OnReadSample status/flags and OnEvent). CI reported no error for them.
    w4_warnings_as_errors_candidates:
      - "C4265 and C5204 (class with virtual functions but non-virtual destructor) are off by default in MSVC per the official docs, so the correct non-virtual COM destructor is not a /W4 /WX risk."
      - "C4127 (constant conditional) has exempted while(true) since VS2015 update 3; the single capture loop is unaffected."
      - "Unused members/parameters: ReadCallback::read_timestamp_ was removed in the F2 round; OnReadSample's timestamp and the stream/event parameters are intentionally unnamed; the strict probe runs -Wunused, -Wconversion, -Wsign-conversion, -Wold-style-cast and -Wnon-virtual-dtor with zero diagnostics."
      - "Narrowing/casts and wide-string handling were re-checked by the strict probe; wide_to_utf8 already clamps at the first NUL (F1 amendment)."
  probe_fidelity_fix:
    stub_change: >-
      .ai/validation/cvf007-developer/stub_win/mfobjects.h no longer declares a virtual destructor
      on IUnknown; it now models the SDK exactly (COM interfaces declare none), so an
      override-on-destructor on a COM-derived class is rejected by the probe.
    probe_change: >-
      The stub directory is passed as -isystem in win-syntax-probe.sh (the real SDK is an external
      header and must not be judged by the project warning policy), and two negative controls were
      added: win-probe-override-negative (harness TU override_negative.cpp that must be rejected)
      and win-probe-override-regression (generated copy of the real uvc_backend.cpp with the
      historic override re-injected, which must also be rejected). A negative control that
      compiles cleanly now fails the harness loudly.
    results: >-
      win-syntax-probe.sh: 6/6 probes pass - four positive probes (developer test and hardware
      suite against the real uvc_backend.h; backend under stub Windows/MF headers with basic and
      project warning sets) and two expected-failure controls, both rejected with a "marked
      'override'" diagnostic (logs/win-syntax-probe.tsv). The regression copy and its log are
      under logs/readcallback_override_regression.cpp and logs/win-probe-override-regression.log.
