findings_raised_during_execution:
  - id: CVF107-HW-01
    severity: blocking
    summary: "The hardware target did not compile on MSVC: tests/hardware/uvc_smoke.cpp used std::getenv, and C4996 is promoted to an error by the project's warnings-as-errors policy."
    resolution: "CMakeLists.txt now applies target_compile_definitions(cvf_hw_uvc_smoke PRIVATE _CRT_SECURE_NO_WARNINGS) under if(MSVC), matching the existing cvf006_lifecycle precedent. The hash-pinned test source was NOT modified (sha256 unchanged 7a62b1c8...)."
    evidence: .ai/reports/CVF-107-build-fix.yaml

  - id: CVF107-HW-02
    severity: blocking
    summary: "Hardware check H3 asserted that the same backend instance can be reopened after close(); production documents one worker per backend lifetime and close() permanently joins that worker, so the assertion contradicted the frozen design. No contract, change file, or test brief requires instance reuse."
    resolution: "Test-owner amendment: H3 now opens the same descriptor with a fresh backend instance and captures from it. Applied by test-engineer; coverage preserved and no check removed or weakened."
    evidence: .ai/reports/CVF-107-test-amendment.yaml
    new_test_sha256: d2df883641ceb6d9738a189226bd9373345b3f6718f090a07279355c0a3d2867

  - id: CVF107-HW-03
    severity: non-blocking
    summary: "The documented VID/PID selector cannot select a device: enumerate() returns descriptors with empty vendor_id and product_id (only friendly_name is populated), so CVF_HW_UVC_VID/CVF_HW_UVC_PID never match."
    impact: "Operators must use CVF_HW_UVC_NAME or CVF_HW_UVC_DEVICE_PATH. The suite correctly refuses a first-device fallback, so this fails closed."
    routed_to: "release-reviewer for classification (documentation vs production identity gap)"

honesty_statement: >-
  Only the runs listed above were executed. This station has no CVF-ORIENT-1 or CVF-COLOR-1
  physical target, so the orientation and colour checks are recorded as UNVERIFIED and are not
  counted as passing. No environment value was changed to convert a mandatory check into a skip,
  and no evidence file was edited after capture.
