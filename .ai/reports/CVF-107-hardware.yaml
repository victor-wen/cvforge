  - id: selector-fail-closed
    purpose: >-
      Demonstrates the selector invariant on real hardware: with the configured device absent the
      suite must fail closed and must never fall back to the first enumerated camera.
    command: "$env:CVF_HW_UVC_NAME='YLX-4K-S858'; $env:CVF_HW_CYCLES='10'; & cvf_hw_uvc_smoke.exe   (YLX-4K-S858 physically absent; ACER QHD present)"
    exit_code: 1
    result: FAIL_AS_DESIGNED
    passed: 6
    failed: 1
    skipped: 1
    observation: >-
      H1 enumerated 1 descriptor (the ACER). H2 failed with
      CVF_STATUS_CAMERA_NOT_FOUND/camera_not_found "camera selector matches no enumerated device".
      The suite did not silently capture from the single attached camera, which is the required
      fail-closed behaviour. This is an expected configuration failure, not a product defect, and it
      is not counted as a passing check.
    evidence: .ai/validation/cvf107-hardware-evidence/cvf107-hw-selector-failclosed.txt
    evidence_sha256: b648f15b9511a840c00a88c2e2e2923c7e090f427dc20be78f43c99ba6013612

  - id: post-review-fix-hardware-confirmation
    note: >-
      The NBF-01 fail-closed hardening and the CVF_HW_STRESS>=1000 anti-misleading guard were
      re-verified on the station before the external camera was removed. See
      cvf107-hw-verifyB-stress-shortcycle-guard.txt (short stress run refuses to report) and
      cvf107-hw-verifyC-symmetric-control-failclosed.txt (H7 still fails with the symmetric control
      set and no asymmetric target), plus cvf107-hw-verifyA-baseline-10cycles.txt for the clean case.

final_source_confirmation_runs:
  note: >-
    Recorded after the batch-4 release review's segment A findings B4A-01..03 were fixed in the hardware
    suite. These runs were produced by the binary built from the final CVF-107 source
    (tests/hardware/uvc_smoke.cpp sha256 f72263aa0eaba72004aeabc610a0bd2b9f869c4aa9dbc44b515906af3d941f30),
    which closes the earlier provenance gap where the archived 1000-cycle log came from the pre-fix binary.
    The external YLX-4K-S858 had been removed from the station by then, so these runs use the integrated
    laptop sensor, which is a different and independently useful device.
  device:
    friendly_name: "ACER QHD User Facing"
    driver: "Realtek, driver version 10.0.22000.20364, driver date 2025-02-17"
    note: >-
      This fills the camera_driver field that earlier runs recorded as unknown. The removed external device
      (YLX-4K-S858) remains recorded as driver unknown because it was no longer attached when driver
      enumeration was captured.
  - id: final-1000-cycles
    command: "$env:CVF_HW_UVC_NAME='ACER QHD User Facing'; $env:CVF_HW_CYCLES='1000'; & cvf_hw_uvc_smoke.exe"
    exit_code: 1
    result: FAIL_MANDATORY_CHECKS_ABSENT
    passed: 35
    failed: 2
    skipped: 1
    repeated_captures: "valid=1000 invalid=0 of 1000; dimension_violations=0 type_violations=0 continuity_violations=0 sequence_violations=0"
    interpretation: >-
      The 1000-consecutive-capture requirement is met at the final source. The run still exits non-zero
      because the suite treats a 1000-cycle release-evidence run as requiring the orientation and colour
      checks, and this station has no CVF-ORIENT-1 or CVF-COLOR-1 target. This is the correct fail-closed
      behaviour, and it means the recorded release evidence cannot yet be a full NFR-019 PASS.
    evidence: .ai/validation/cvf107-hardware-evidence/cvf107-hw-final-A-1000cycles.txt
    evidence_sha256: 6b3f1fa80c7a18820b353be7cd46423eeb8cce00c6bde857eda16c372748a4b3

  - id: final-color-bypass-closed
    purpose: >-
      Proves finding B4A-01 is fixed: a mandatory colour check must not be satisfiable by the neutral
      control without the saturated target.
    command: "$env:CVF_HW_REQUIRE_COLOR='1'; $env:CVF_HW_COLOR_EXPECT='neutral'; (CVF_HW_COLOR_TEST unset) & cvf_hw_uvc_smoke.exe"
    exit_code: 1
    result: FAIL_AS_DESIGNED
    observation: >-
      H8 fails with "the neutral spread control is not a substitute". Before the fix this configuration
      could satisfy the mandatory colour requirement; it no longer can.
    evidence: .ai/validation/cvf107-hardware-evidence/cvf107-hw-final-B-color-neutral-bypass.txt
    evidence_sha256: 2cff06f3bbe34803ab541abadeddb57dd87bcbedbad7406d538a7eafebad443f

  - id: final-orientation-control-closed
    purpose: >-
      Proves findings B4A-02/B4A-03 are fixed: the symmetric control cannot satisfy the mandatory
      orientation requirement, and the archived log now records the control flag so it is self-evidencing.
    command: "$env:CVF_HW_REQUIRE_ORIENTATION='1'; $env:CVF_HW_ORIENTATION_SYMMETRIC_CONTROL='1'; (CVF_HW_ORIENTATION_TEST unset) & cvf_hw_uvc_smoke.exe"
    exit_code: 1
    result: FAIL_AS_DESIGNED
    observation: >-
      H7 still fails when required. The release-evidence block now records
      orientation_symmetric_control=yes and every other requirement and threshold flag, so this log alone
      shows the control was set. The earlier archived log could not show this, which is exactly what B4A-03
      reported.
    evidence: .ai/validation/cvf107-hardware-evidence/cvf107-hw-final-C-orient-symctrl.txt
    evidence_sha256: cd3a9e4ffcc7e71218ab619b71736b9d992b2551aa5c5108c3a62246bbfd63d1

