author_assumptions:
  - id: A1
    area: callback level parameter type
    assumption: >-
      The brief fixes the numeric level value (trace=0 .. critical=5, matching
      core::to_public_log_level) but not the exact integral parameter type. The callback
      probes are captureless generic closures, so they convert to any numeric-level
      callback signature; the tests assert the values, not the parameter's C++ type.
  - id: A2
    area: DiagnosticsConfig spelling
    assumption: >-
      DiagnosticsConfig fields are level (core::LogLevel), max_file_bytes (unsigned,
      64-bit on this platform), max_files (unsigned), log_dir (std::filesystem::path),
      initialized with designated initializers in that order.
  - id: A3
    area: CallbackBinding
    assumption: >-
      CallbackBinding{fn, user_data} where fn accepts a captureless closure/function
      pointer and user_data is passed through unchanged; the tests always bind a callback.
  - id: A4
    area: Diagnostics surface
    assumption: >-
      Diagnostics::create(const DiagnosticsConfig&, const CallbackBinding&) returns
      Result<std::unique_ptr<Diagnostics>>; log(LogLevel, message) is noexcept;
      warnings() returns a value static_cast-able to std::uint32_t; clear_warnings() resets
      the flags; log_file_path() is wrapped in std::filesystem::path{...} so either a path
      or string return type works.
  - id: A5
    area: CaptureStore surface
    assumption: >-
      CaptureStore::create(const std::filesystem::path&) returns
      Result<std::unique_ptr<CaptureStore>>; save(const CaptureSaveRequest&) returns
      Result<std::filesystem::path>; enforce_retention(root, std::chrono::seconds,
      std::uint64_t) is static and returns Result<std::uint32_t> (count of deleted files).
  - id: A6
    area: CaptureSaveRequest spelling
    assumption: >-
      Fields pixels (cv::Mat), recipe_id (std::string), request_id (std::string),
      sequence (std::uint64_t), designated-initialized in that order.
  - id: A7
    area: save-policy primitive
    assumption: >-
      artifacts::decide_capture_save(std::string_view save_policy, core::Verdict,
      bool execution_ok) is a free function returning SaveDecision with distinguishable
      skip/save enumerators; unknown tokens (including wrong case, empty, trailing space)
      map to skip.
  - id: A8
    area: error-code enumerators
    assumption: >-
      The 17xx/18xx codes are added to core::ErrorCode with the exact identifier spellings
      in the brief (diagnostics_invalid_config, log_write_error, artifacts_root_error,
      image_encode_error, image_write_error, retention_error) and reuse the existing
      core::to_public_error_code / core::status_for / core::error_code_name functions.
  - id: A9
    area: warning flags
    assumption: >-
      core::WarningFlags exposes warning_none=0, warning_log_sink_failed=1,
      warning_image_save_failed=2 and the returned flags value can be bit-tested against
      those enumerators via static_cast to std::uint32_t.
  - id: A10
    area: rotation file counting
    assumption: >-
      The B4 bound is read as "the rotating-log family stays within max_files"; the tests
      count regular files in log_dir whose filename starts with "cvforwin" (covering
      cvforwin.log and rotated variants such as cvforwin_1.log) and require <= max_files.
  - id: A11
    area: exact-age boundary proxy
    assumption: >-
      An instant exactly equal to the age boundary cannot be produced deterministically
      without controlling the implementation clock; the inclusive "not expired" direction
      is probed one full minute inside a two-minute window (and one minute outside for the
      delete direction).
  - id: A12
    area: save filename observables
    assumption: >-
      Only structural filename properties are asserted: absolute path, direct child of the
      managed root, .png extension, the "_<recipe>_<request>_<sequence>.png" suffix
      structure, absence of '/', '\\' and space in the filename component, empty ids ->
      literal "unnamed", >64-byte ids truncated to exactly the first 64 bytes, and two
      saves distinct via distinct sequence values. The utcstamp encoding is not asserted.
  - id: A13
    area: degraded sink construction
    assumption: >-
      "log directory cannot be created" is induced by placing the configured absolute
      log_dir beneath a regular file (mkdir must fail); create() must still succeed and
      the callback must still deliver entries.
  - id: A14
    area: save failure side effects
    assumption: >-
      After an empty-frame encode failure no .png file remains in the managed root.
  - id: A15
    area: message truncation boundary
    assumption: >-
      Delivered length semantics follow the brief plus the frozen core::utf8_safe_prefix
      behaviour: exactly 4096 bytes is unchanged, 4097 ASCII bytes collapse to 4096, and
      4095 ASCII bytes followed by a four-byte code point collapse to 4095.
  - id: A16
    area: test-target wiring (developer-owned)
    assumption: >-
      The suite expects a Catch2 v3 test target that links the diagnostics and artifacts
      libraries plus OpenCV core/imgcodecs and Catch2; no CMake file was modified by the
      test owner.
