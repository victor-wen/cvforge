interface_facts_confirmed_by_probe:
  note: >-
    The probes under .ai/validation/cvf-002-probe/ compile only against the already
    existing frozen headers src/core/status.h and src/core/error.h; they never read
    source. They pinned the shared core spellings instead of guessing them.
  - "cvforwin::core::Status::ok=0, invalid_argument=1, camera_not_found=7, camera_io=8, timeout=9 exist as expected."
  - "cvforwin::core::Failure exists, is default-constructible, and exposes assignable members status (Status), code (ErrorCode), message (std::string); positional order (status, code, message) type-checks."
  - "Camera enumerators (1400..1409) are not present yet, confirming the expected RED for CVF-002's new error codes."
  - "No core mapping function is named in the brief; the broad/detailed pair is therefore asserted through failure().status and failure().code, which the frozen Failure already carries."

author_assumptions:
  - "Fault kind enum spelling `cvforwin::camera::FaultKind` with enumerators `disconnect` and `capture_error`; spec was updated to match this spelling."
  - "Settings type `cvforwin::camera::CameraSettings` with assignable `width`/`height`; zero means unspecified."
  - "Pixel format spelling `cvforwin::camera::PixelFormat::bgr8`."
  - "Test-backend header names `camera/test_backends/file_camera_backend.h` and `camera/test_backends/synthetic_camera_backend.h`; spec was updated to match these names."
  - "Config structs are aggregates built with designated initializers: FileCameraConfig{.descriptor, .frame_paths} and SyntheticCameraConfig{.descriptor, .width, .height}, with default member initializers 64 and 48."
  - "CameraDescriptor has backend_key/device_path/vendor_id/product_id/friendly_name in the brief's order and is built with designated initializers; CameraSelector is default-constructed and assigned per field."
  - "capture_with_one_retry takes the backend by reference (ICameraBackend&) and the settings by value/reference; it is called with a concrete test backend lvalue."
  - "close() may return void or Result<void>; the tests cast the call to void so a [[nodiscard]] Result cannot break the build."
  - "enumerate is driven with a generous 5000 ms deadline so the deadline itself is not the subject of those checks."
  - "B7 delay == nominal remaining: because the wall clock consumes part of the timeout before any comparison, either documented outcome is acceptable; the test asserts a timeout-or-frame outcome and a bounded elapsed time rather than guessing the race."

