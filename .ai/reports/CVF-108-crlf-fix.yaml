  - path: .ai/validation/cvf108-crlf-fix-verify.sh
    role: test-owner verification harness (not a CMake target, not a pinned test file)
  - path: .ai/validation/cvf108-crlf-probe.cpp
    role: test-owner CRLF probe (not a CMake target, not a pinned test file)

changes:
  - location: "shared text helpers, before split_lines()"
    kind: added
    detail: >-
      Added strip_line_ending(std::string) which removes a trailing "\r\n",
      "\n", or bare "\r" from a line. This is the single shared normalization
      every line-based parse now reaches.
  - location: "split_lines()"
    kind: refactor
    detail: >-
      split_lines() now splits on '\n' and passes every produced line through
      strip_line_ending() (previously it dropped every '\r' by character but
      still returned a raw string to callers that bypassed it). It is the
      canonical line source for the file.
  - location: "extract_abi_version_macros() (the failing helper)"
    kind: fix
    detail: >-
      Replaced the std::istringstream + std::getline loop with a ranged-for
      over split_lines(text). The anchored pattern
      R"(^\s*#\s*define\s+([A-Za-z_][A-Za-z0-9_]*)\s+(.*)$)" is unchanged; the
      input line is now normalized, so the whole-line match is CRLF-safe. No
      parsing rule, filter, or expectation changed.
  - location: "parse_def_exports() (the only other getline-based line parse)"
    kind: fix
    detail: >-
      Replaced the std::istringstream + std::getline loop with a ranged-for
      over split_lines(text). It was already trim()-protected, but it is now
      routed through the same shared normalization so the defect class cannot
      reappear.
  - location: "new detection control test case"
    kind: added
    detail: >-
      Added TEST_CASE "CVF-108 platform control: CRLF line endings are
      normalized for every line-based parse" ([cvf-108][boundary][crlf]). It
      feeds a synthetic LF block and its CRLF twin to split_lines(),
      extract_abi_version_macros(), and parse_def_exports(), requires the CRLF
      result to equal the LF result, and reproduces the pre-fix un-normalized
      whole-line match, asserting it returns empty on CRLF (the exact Windows
      symptom). If the normalization is removed, the control fails.

audit_other_call_sites:
  description: >-
    Every line-oriented construct in the file was audited for the same hazard
    (whole-line regex_match/regex_search anchored with '$', and line
    equality/prefix/suffix comparisons that could see a trailing '\r').
  findings:
    - site: "extract_abi_version_macros()"
      hazard: "yes - getline + regex_match ending in (.*)$"
      action: "fixed via split_lines()/strip_line_ending()"
    - site: "parse_def_exports()"
      hazard: "latent - getline + trim(), no trailing '\\r' survived trim, but bypassed the shared normalizer"
      action: "fixed (routed through split_lines()) for defense in depth"
    - site: "split_lines()"
      hazard: "no - already removed '\\r'; hardened to strip trailing line endings explicitly"
      action: "refactored through strip_line_ending()"
    - site: "line_spans()"
      hazard: "no - already decrements end past a trailing '\\r' (lines 317-319)"
      action: "none (already CRLF-safe)"
    - site: "line_text(), sentence_span(), is_historical_context()"
      hazard: "no - all read lines through line_spans() (CR-stripped) or trim()"
      action: "none"
    - site: "trim()"
      hazard: "no - find_first/last_not_of includes '\\r' and '\\n'"
      action: "none"
    - site: "is_version_heading_line(), unit_is_historical()"
      hazard: "no - regex_search patterns are unanchored (end with \\b, no '$'); inputs are CR-stripped lines"
      action: "none"
    - site: "extract_cmake_project_version()"
      hazard: "no - regex_search over the whole text, no '$' anchor"
      action: "none"
    - site: "find_semver_tokens(), find_cvforwin_versions(), extract_json_version_fields()"
      hazard: "no - global sregex_iterator patterns, no '$' anchor"
      action: "none"
    - site: "LICENSES phrase regex (cvforwin <semver>)"
      hazard: "no - global sregex_iterator pattern, no '$' anchor"
      action: "none"
    - site: "background-retention docs scan"
      hazard: "no - consumes split_lines() (now normalized)"
      action: "none"
    - site: "is_table_row_line(), is_list_item_line(), is_heading_line(), is_sentence_terminator()"
      hazard: "no - all compare trim()-ed or CR-stripped text"
      action: "none"

