    host: WSL libstdc++
    header: include/cvforwin/cvf_api.h
    header_bytes_lf: 9349
    header_bytes_crlf: 9598
    results:
      naive_lf: 1
      naive_crlf: 0
      normalized_lf: 1
      normalized_crlf: 1
      regex_match_line_cr_only: 0
      normalized_matches_lf: 1
      un_normalized_observably_broken: 1
      PROBE_RESULT: PASS
    interpretation: >-
      Against a CRLF copy of the real public header the pre-fix un-normalized
      path returns 0 macros (the observed Windows failure), while the
      normalized path returns the same result as LF (1).

