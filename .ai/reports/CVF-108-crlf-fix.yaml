schema_version: 1
change_id: CVF-108
phase: FIX
owner: test-engineer
recorded_at: 2026-09-19
title: >-
  CVF-108 independent test host-portability fix: normalize line endings so the
  whole-line ABI-macro parse is CRLF-safe (Windows CI run 35442730937)

context:
  failing_ci_run: 35442730937
  failing_commit: 7d3e3fe
  failing_test: "CVF-108 OB-4: the public header keeps ABI version 1 and the five v1 entry points"
  observed_failure: >-
    tests/unit/cvf108_release_metadata_test.cpp(876): FAILED: REQUIRE_FALSE(
    macros.empty() ) with message "ABI version macros observed: []" on the
    Windows runner (CRLF checkout); the same test passed on WSL (LF checkout).
  production_header_changed: false

root_cause:
  statement: >-
    extract_abi_version_macros() consumed lines with std::istringstream +
    std::getline and required a whole-line std::regex_match with a pattern
    ending in "(.*)$". On a CRLF line the trailing '\r' remains; in ECMAScript
    '.' does not match a carriage return and regex_match requires the entire
    line to be consumed, so every line failed to match and the macro list came
    back empty.
  scope: >-
    Test-host defect only. The production public header is correct and was not
    changed.

