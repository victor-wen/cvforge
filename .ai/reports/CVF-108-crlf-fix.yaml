  - path: tests/unit/cvf108_release_metadata_test.cpp
    role: independent test (owned by test-engineer)
    previous_sha256: ea5f286d6b92e242ac5629b0b35611d2ac03558c9f530a3420d904032670e173
    new_sha256: 97077e20bc3a1a5ecf9797474e61bc0b55a60777b655190265b1894b5676c0a0
