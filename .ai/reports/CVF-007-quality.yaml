anomalies:
  - id: QE-1
    severity: carry-over
    area: portable package-refusal target
    detail: >-
      On the portable host the package target correctly refuses (exit 1, no
      artifacts): 'package is Windows-only; refusing to produce portable release
      evidence'. The refusal line is then interrupted by the known shell-quoting
      defect '/bin/sh: 1: Syntax error: "(" unexpected' (unquoted parentheses in the
      cmake -E echo argument assembled by cmake/CvfPackage.cmake), so the guard
      fails via the shell syntax error instead of the intended cmake -E false.
      Refusal semantics (nonzero exit, no portable package) hold. Carry-over from
      CVF-004/CVF-005/CVF-006; tracked for CVF-008 in .ai/workflow-state.yaml.
    evidence: windows-guard.log
  - id: static-analysis-windows-tu-gap
    severity: informational / coverage gap
    area: static-analysis coverage claim
    detail: >-
      static-analysis reports '21 file(s) clean', but the Windows-only TU
      src/camera/uvc_windows/uvc_backend.cpp (and tests/hardware/uvc_smoke.cpp) is
      absent from build/wsl-clang-analysis/compile_commands.json (entry_count=63,
      src_cpp_files=21, uvc_backend_cpp_in_db=0, uvc_smoke_cpp_in_db=0), so
      clang-tidy cannot analyze it on this host. The 21-file count therefore
      overstates analyzed coverage by the Windows TU. Recorded as a gap, not as a
      pass; real analysis of that file requires the deferred Windows toolchain.
    evidence: compile-db.log
  - id: harness-note
    severity: informational
    detail: >-
      The runner adds --clean-first to the canonical build commands (same preset
      flags plus a non-incremental rebuild) and runs focused/direct confirmation
      commands in addition to the canonical set; no canonical command was
      substituted, softened, or skipped. The package target exit 1 is the expected
      guard behavior, not a failure.

