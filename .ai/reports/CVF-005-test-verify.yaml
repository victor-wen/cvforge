assertion_review:
  files_reviewed: 7
  method: >-
    Full read of every owned file; checked for conditional/early-return skips,
    hidden Catch2 tags, optional assertions, and setup liveness of the
    environment-sensitive cases.
  short_circuited_assertions: none
  removed_or_weakened_assertions: none
  notes:
    - >-
      B13 "an old symlink itself is not deleted": the no-follow timestamp fixture
      result was INFO-only, so liveness was probed by running the case directly
      with Catch2 -s; the fixture succeeded ("symlink no-follow timestamp
      control: 1" repeated with each of the section's assertions), therefore the
      old-symlink scenario was genuinely exercised. Assertions are unconditional.
    - >-
      B11 exact age-equality boundary is not representable deterministically
      without an injectable clock (file age is always max_age + elapsed time at
      call time), so the deterministic approximation probes one minute inside a
      120 s window (kept) and one minute outside (deleted); documented in the
      test source.
    - >-
      Runtime file-sink write failure (B6 file-write half) is not separately
      induced: an already-open spdlog file descriptor keeps succeeding on Linux
      after unlink/rename of its path, so no stable black-box fault injection
      exists without implementation knowledge. Create-time sink failure with the
      warning already set, callback containment, and never-throw are covered by
      B5/B6 owned cases. Recorded as a residual coverage note, not a failure.
    - >-
      B4 rotation genuinely exercised: 40 entries x ~120 bytes against a
      1024-byte limit with max_files=2 and max_files=1; file count stayed in
      [1, max_files] and the newest entry remained readable.
