decisions:
  - id: D1
    decision: "format-check covers project-owned sources only; tests/abi/** is excluded."
    rationale: >-
      The independent tests are hash-pinned test-owner artifacts. No repository style can leave
      them byte-identical (for example, their long static_assert lines and hand-aligned typedef
      blocks), so reformatting them would be an independence violation. They are still compiled
      with -Wall -Wextra -Werror through CTest. The exclusion is stated in cmake/CvfFormat.cmake.
  - id: D2
    decision: "The wsl-quality workflow configures a single build tree; sanitizer and analysis trees remain standalone presets."
    rationale: >-
      CMake 3.28 rejects a workflow with more than one configure step ("Configure workflow step
      must be the first step"), which was confirmed with a minimal reproduction before
      restructuring. The canonical commands for wsl-gcc-asan and wsl-clang-analysis still run as
      documented presets, and both were executed and recorded.
  - id: D3
    decision: "static-analysis runs clang-tidy against the configured tree's compilation database (debug tree in the workflow, clang tree for the canonical analysis command)."
    rationale: >-
      The target is a scripted clang-tidy invocation with --warnings-as-errors=*, so it does not
      depend on the build-time compiler. Module scanning is disabled project-wide to keep compile
      commands consumable by clang-tidy.
  - id: D4
    decision: "initialize never publishes a context in CVF-001; it returns CVF_STATUS_CONFIG_ERROR with a nonzero error_code and a bounded message."
    rationale: >-
      The configuration/recipe/camera subsystems are out of scope for this change. A nonexistent or
      non-directory config root is reported as config_root_missing/config_root_unreadable; a
      well-formed existent root still fails with subsystem_unavailable. This satisfies "no fake
      success" and "never publish partial state".
  - id: D5
    decision: "Mirror validation checks struct_size before reading any other field, and an invalid result/error struct is never written to."
    rationale: >-
      A caller passing an older or truncated structure must not be read beyond the size it declared;
      a malformed error/result structure is reported as a status only, never modified.
  - id: D6
    decision: "Every non-OK inspect outcome is published through one path: status/verdict(NOT_EVALUATED)/error_code are set, output_json and image_path are cleared (bytes_written=0, bytes_required=0, NUL-terminated when capacity >= 1), and error_message receives the bounded diagnostic."
    rationale: >-
      Contract rule: "Any non-OK inspect status sets verdict to NOT_EVALUATED and clears output_json
      and image_path unless a diagnostic path was safely completed." No diagnostic path is completed
      in CVF-001, so both output buffers are always cleared on the failure path. "No value produced"
      is reported as zero written and zero required; the error-message rule
      (required == written + 1) is unaffected. Verified by the developer unit tests "a failed inspect
      publishes NOT_EVALUATED and clears output paths" and "a malformed inspect result structure is
      never modified" (amendment F1/F2).
  - id: D7
    decision: "CVF_API macro spellings use the conventional attribute-before-return-type order."
    rationale: >-
      The frozen v1 names, signatures, values, struct layouts and calling convention are exact; the
      macro placement differs only from the prose ordering in public_interface_v1 and is required
      for MSVC/GCC portability. The C++20 static_asserts on every field type and function signature
      pass unchanged.

deviations:
  - >-
    vcpkg prints a benign warning: builtin-baseline is set in vcpkg.json while vcpkg-configuration.json
    overrides the default-registry; both pin the identical baseline
    a1cae005c39be7b18ba319fced856b68d7276271, so the resolved dependency graph is immutable as required.
  - >-
    The Catch2 unit test cases are discovered via catch_discover_tests; the four ABI tests are
    single CTest entries. Total CTest entries: 22 at the original submission, 25 after the
    amendment cycle (see the amendment section).
  - >-
    CMake's --list-presets hides windows-msvc-release on Linux because the Visual Studio generator
    is unavailable; the preset itself parses and is listed on Windows hosts.

not_run:
  - item: "windows-msvc-release configure/build/test/abi-check/package/package-verify and the windows-ci workflow"
    reason: >-
      Requires the windows-2022 runner with MSVC v143 and the x64-windows-static triplet; authored
      in CMakePresets.json and cmake/** but not executable in WSL. Authoritative Windows ABI and
      package evidence remains a CI responsibility under the approved contract.
  - item: "package/package-verify targets on WSL"
    reason: >-
      Deliberately guarded: on non-Windows hosts both targets fail with an explicit message so a
      portable invocation can never be mistaken for release evidence.
  - item: "hardware UVC behavior, inspection algorithms, recipe store, camera backends"
    reason: Out of scope for CVF-001 by the approved change contract.

