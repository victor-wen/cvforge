summary: >-
  Canonical build bootstrap, the exact v1 public C ABI header, the stateless
  validating C API boundary, and developer unit tests are implemented and
  verified under the canonical WSL presets. All four independent tests in
  tests/abi execute through CTest and pass; the portable shared library exports
  exactly the five approved cvf_* symbols; format-check and clang-tidy are
  clean; the sanitizer workflow passes. Windows presets and the .def/package
  scaffolds are authored but only executable on windows-2022 CI. No runtime
  subsystem was faked: initialize/reload/inspect return documented non-OK
  statuses and never publish a context.

