amendment:
  cycle: 1
  recorded_at: 2026-09-15
  trigger: "reviewer verdict APPROVE with four findings routed to a small amendment cycle"
  findings_addressed:
    - id: F1
      severity: medium
      finding: "A failed cvf_inspect did not clear output_json/image_path on the non-OK path."
      change: >-
        src/c_api/cvf_entry_points.cpp now routes every non-OK inspect outcome through the single
        publish_result_failure() function, which clears output_json and image_path for a valid
        result struct: bytes_written=0, bytes_required=0, and buffer[0]='\0' when the pointer is
        non-NULL and capacity >= 1. No diagnostic path is completed in this build, so clearing is
        unconditional on the failure path.
      covered_by:
        - "tests/unit/test_c_api_result_hygiene.cpp: 'a failed inspect publishes NOT_EVALUATED and clears output paths'"
    - id: F2
      severity: medium
      finding: "store_result_failure wrote error_message even for a malformed result struct, contradicting D5."
      change: >-
        store_result_status()/store_result_failure() were replaced by one result_is_writable()
        predicate (struct_size must equal the v1 size and reserved must be zero) and one
        publish_result_failure() function. Every write into the result - status, verdict, error_code,
        error_message, output_json/image_path clearing - is gated by that single predicate, so a
        malformed result is reported through the function return status only and is never partly
        modified.
      covered_by:
        - "tests/unit/test_c_api_result_hygiene.cpp: 'a malformed inspect result structure is never modified' (wrong struct_size, nonzero reserved)"
    - id: F5
      severity: low
      finding: "Unit test hard-coded request/result struct sizes 72/144; the real v1 x86-64 sizes are 88/128."
      change: >-
        tests/unit/test_core_abi_validation.cpp now derives all four expected sizes from the public
        header (sizeof cvf_init_options_v1, cvf_error_info_v1, cvf_inspection_request_v1,
        cvf_inspection_result_v1) instead of literals, and the cvf_unit_tests target received the
        include/ path so the frozen header is the single source of truth.
      evidence:
        - "probe: sizeof init=88 error=48 request=88 result=128"
    - id: F7
      severity: low
      finding: "echo_path truncated at 200 bytes without code-point awareness, so a long root path could yield a non-UTF-8 error message."
      change: >-
        Added core::utf8_safe_prefix() in src/core/text.{h,cpp}, which backs the cut off to a UTF-8
        code-point boundary; echo_path() now uses it, so a truncation that would split a multi-byte
        sequence emits the shorter valid prefix instead of invalid UTF-8.
      covered_by:
        - "tests/unit/test_core_text.cpp: 'utf8_safe_prefix never splits a code point' (two-byte, four-byte, ASCII, limit 0, oversized limit)"
  fresh_evidence:
    harness: .ai/validation/cvf-001-amendment-verify.sh
    log: .ai/validation/cvf-001-amendment-verify.log
    commands:
      - command: "cmake --preset wsl-gcc-debug"
        exit_code: 0
      - command: "cmake --build --preset wsl-gcc-debug --parallel"
        exit_code: 0
      - command: "ctest --preset wsl-gcc-debug --output-on-failure"
        exit_code: 0
        tests_run: 25
        tests_passed: 25
        tests_failed: 0
        detail: >-
          21 Catch2 unit cases (including the two new result-hygiene cases and the new
          utf8_safe_prefix case) plus the four independent tests/abi executables
          (cvf.abi.c11_surface, cvf.abi.runtime, cvf.abi.cpp20_include, cvf.abi.header_isolation).
      - command: "cmake --build --preset wsl-gcc-debug --target format-check"
        exit_code: 0
        detail: "format-check passed: 16 file(s) conform to .clang-format"
      - command: "cmake --build --preset wsl-gcc-debug --target abi-check"
        exit_code: 0
        detail: "abi-check passed: exactly 5 export(s)"
      - command: "cmake --preset wsl-clang-analysis && cmake --build --preset wsl-clang-analysis --target static-analysis --parallel"
        exit_code: 0
        detail: "static-analysis passed: 6 file(s) clean under .clang-tidy"
      - command: "cmake --preset wsl-gcc-asan && cmake --build --preset wsl-gcc-asan --parallel && ctest --preset wsl-gcc-asan --output-on-failure"
        exit_code: 0
        tests_run: 25
        tests_passed: 25
        tests_failed: 0
      - command: "gcc -std=c11 -Wall -Wextra -Werror -I include -fsyntax-only tests/abi/test_c11_surface.c tests/abi/test_abi_runtime.c tests/abi/test_header_isolation.c; g++ -std=c++20 ...; gcc -std=c11 ... -nostdinc -I tests/abi/isolation_stub -I include -fsyntax-only tests/abi/test_header_isolation.c"
        exit_code: 0
      - command: "nm -D --defined-only build/wsl-gcc-debug/libcvforwin.so | grep cvf_"
        exit_code: 0
        export_count: 5
        symbols: [cvf_get_abi_version, cvf_initialize, cvf_reload_recipes, cvf_inspect, cvf_shutdown]
    summary: "harness failures=0"
  independent_abi_executables_direct:
    - "cvf_abi_runtime: checks=59 failures=0 (exit 0)"
    - "cvf_abi_cpp20_include: ok [cpp20_abi_version] 1 (exit 0)"
    - "cvf_abi_c11_surface: exit 0"
    - "cvf_abi_header_isolation: exit 0"
  first_attempt_note: >-
    The first amendment harness run failed one new developer test because the malformed-struct
    sections checked a sentinel byte that an earlier test case had already cleared; the test was
    corrected (the implementation was not at fault) and the final run above is the recorded evidence.
  independence_recheck: >-
    This amendment modified no test-owner file. tests/abi/** and .ai/test-ownership.yaml were
    refreshed by the test owner between cycles (manifest recorded_at 2026-09-15, test_abi_runtime.c
    sha256 d748bef2c9c750b3fce5ddc07a1d9829094802a7cfa525820856bd141412f983) and all six recorded
    hashes were re-verified as MATCH during this amendment. The grown independent runtime suite
    (59 checks, including inspect reserved-nonzero boundary cases) passes against the fixed boundary.
  scope: >-
    Changes limited to src/core/text.{h,cpp}, src/c_api/cvf_entry_points.cpp, tests/unit/** (one new
    test file plus additions), CMakeLists.txt (unit-test include path and link), the report, and
    .ai/validation/cvf-001-amendment-verify.{sh,log}. No contract, review, test-brief, test-ownership,
    or tests/abi file was modified by this amendment.
