    detail: >-
      "the installed package reports its own version as 1.1.0 to a consumer" can
      only be fully exercised against an installed Windows package; no Windows
      package build exists in this WSL author environment. The source-side
      single-source derivation is checked here, and the installed-package
      consumer remains deferred to a Windows package build. Not claimed as
      verified.
  - id: OB-2
    detail: >-
      The staged package directory, package ZIP, and symbols ZIP names are
      generated from PROJECT_VERSION at configure/build time; their literal
      values are only observable in a Windows package run, which is deferred.

