red_assertions:
  - id: OB-1
    test_case: "CVF-108 OB-1: the top-level build definition declares product version 1.1.0"
    assertion: "CHECK(observed == kProductVersion)"
    expected: "CMakeLists.txt project VERSION == 1.1.0"
    observed: "1.0.0"
  - id: OB-1
    test_case: "CVF-108 OB-1: the top-level build definition declares product version 1.1.0"
    assertion: "CHECK_FALSE(contains_exact_version(file.text, kLegacyVersion))"
    expected: "no whole-token 1.0.0 product version in CMakeLists.txt"
    observed: "1.0.0 present (VERSION 1.0.0)"
  - id: OB-1
    test_case: "CVF-108 OB-1: the dependency manifest version field matches the product version"
    assertion: "CHECK(version == kProductVersion)"
    expected: "vcpkg.json version field == 1.1.0"
    observed: "version-string = 1.0.0"
  - id: OB-2
    test_case: "CVF-108 OB-2: CI artifact and package-path names carry product version 1.1.0"
    assertion: "CHECK(stale.empty())"
    expected: "all cvforwin-<version> CI names == 1.1.0"
    observed: "5 names all windows.yml:1.0.0 (artifact 'cvforwin-1.0.0-package', path '.../package/cvforwin-1.0.0.zip', artifact 'cvforwin-1.0.0-symbols', path '.../symbols/cvforwin-1.0.0-symbols.zip', consumer root '.../package/cvforwin-1.0.0')"
  - id: OB-6
    test_case: "CVF-108 OB-6: documentation quotes current 1.1.0 package/artifact names"
    assertion: "CHECK(saw_current)"
    expected: "at least one current cvforwin-1.1.0 name/path in docs/**"
    observed: "false (no 1.1.0 documentation name)"
  - id: OB-6
    test_case: "CVF-108 OB-6: documentation quotes current 1.1.0 package/artifact names"
    assertion: "CHECK(stale.empty())"
    expected: "no non-historical stale cvforwin-1.0.0 name/path in docs/**"
    observed: "14 non-historical names: docs/development.md x9 and docs/packaging.md x5, all 1.0.0"
  - id: OB-6
    test_case: "CVF-108 OB-6: documentation describes background artifact retention"
    assertion: "CHECK_FALSE(evidence.empty())"
    expected: "some doc describes background retention"
    observed: "no doc/retention line with a background/asynchronous/off-the-inspection-path marker"
  - id: OB-7
    test_case: "CVF-108 OB-7: notices cover the image codec and name the current release"
    assertion: "CHECK(version == kProductVersion)"
    expected: "LICENSES/README.md current-release claim == 1.1.0"
    observed: "1.0.0 ('the cvforwin 1.0.0 release')"

green_assertions:
  - id: OB-1
    detail: >-
      packaging_modules(test) finds cmake/CvfPackage.cmake, CvfPackage.cmake.in,
      and CvfPackageVerify.cmake.in; every staged/archive name is built from
      PROJECT_VERSION (@PROJECT_VERSION@ / ${PROJECT_VERSION}); no stale version
      literal is present. The single-source rule holds structurally; after the
      CMakeLists project bump the package directory, ZIP, and symbols ZIP follow
      automatically. Gated by CMakeLists project VERSION, which is RED above.
  - id: OB-1
    detail: "CMakePresets.json has no three-part product-version token and no whole-token 1.0.0."
  - id: OB-4
    detail: >-
      include/cvforwin/cvf_api.h defines CVF_ABI_VERSION_V1 1u; every
      ABI_VERSION macro is 1; the header declares all five approved entry points.
      ABI stays at version 1. Runtime rejection of a non-1 ABI value remains
      covered by the existing CVF-001/CVF-006 ABI suites; this test pins the
      compile-time constant and the public surface.
  - id: OB-5
    detail: >-
      src/c_api/cvforwin.def parses to exactly five exports and the set equals
      {cvf_get_abi_version, cvf_initialize, cvf_reload_recipes, cvf_inspect,
      cvf_shutdown}. Four or six is rejected by the parser boundary case.
  - id: OB-6
    detail: >-
      docs/** mentions template.match together with a recipe and an asset/.png
      (docs/development.md documents config/examples/recipes/template.match.json
      and config/examples/assets/tmpl.asymmetric.png).
  - id: OB-7
    detail: >-
      LICENSES/** contains OpenCV-LICENSE.txt and LICENSES/README.md maps OpenCV
      core/imgproc/imgcodecs and the image-codec components libpng and
      libjpeg-turbo to notice files. Coverage is already complete.
  - id: boundary
    detail: >-
      Synthetic demonstrations (intentionally GREEN at author time; they prove
      the check logic, not the product): exact "1.1.0" matching rejects
      "1.1.0-something-else", "1.1.0.0", "1.10.0", "2.0.0", "1.1", "11.1.0",
      "01.1.0", and "1.0.0"; a changelog/version-heading mention of
      cvforwin-1.0.0 is classified historical and not reported, while a current
      usage line is reported; the .def parser counts 5 and rejects 4/6, tolerates
      comments/ordinals; the ABI parser reads 1 and 2; a missing required file
      yields exists=false rather than a skip.

boundary_checks_demonstrated:
  - 'exact "1.1.0" match: supersets such as "1.1.0-something-else" and
    "1.1.0.0" are rejected, as are "1.1", "1.10.0", "2.0.0", "11.1.0" and "01.1.0".'
  - 'ABI stays exactly 1: header macro CVF_ABI_VERSION_V1 == 1; a synthetic
    value of 2 is parsed as a mismatch input.'
  - "exactly five exports: real .def is the five-symbol set; synthetic four- and six-symbol lists are counted as non-five."
  - "historical mentions are not reported: a changelog entry and a version heading exempt a cvforwin-1.0.0 reference, while a current usage reference fails."
  - "required-file absence is a failure: every real-file case REQUIREs file.exists first; a dedicated case asserts the missing-file detector returns exists=false (no silent skip)."

