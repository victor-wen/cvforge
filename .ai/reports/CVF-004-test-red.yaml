      - tests/unit/cvf004_config_test.cpp
      - tests/unit/cvf004_recipe_test.cpp
      - tests/unit/cvf004_catalog_test.cpp
      - tests/unit/cvf004_holder_test.cpp
  - command: >-
      g++ -std=c++20 -Wall -Wextra -Werror -I src -I include
      -isystem build/wsl-gcc-debug/vcpkg_installed/x64-linux/include
      -isystem build/wsl-gcc-debug/vcpkg_installed/x64-linux/include/opencv4
      -fsyntax-only tests/unit/cvf004_<test>.cpp
      (run per test TU; real project-local include roots)
    exit_code: 1
    counts: "compiled=0, failed=6"
    red_tests:
      - tests/unit/cvf004_error_codes_test.cpp
      - tests/unit/cvf004_config_test.cpp
      - tests/unit/cvf004_recipe_test.cpp
      - tests/unit/cvf004_catalog_test.cpp
      - tests/unit/cvf004_holder_test.cpp
