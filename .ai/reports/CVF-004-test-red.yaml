      clang-format --dry-run --Werror tests/unit/cvf004_test_support.h
      tests/unit/cvf004_error_codes_test.cpp tests/unit/cvf004_config_test.cpp
      tests/unit/cvf004_recipe_test.cpp tests/unit/cvf004_catalog_test.cpp
      tests/unit/cvf004_holder_test.cpp
    exit_code: 0
    counts: "n/a (no format drift)"
  - command: >-
      VCPKG_ROOT=/home/administrator/vcpkg g++ -std=c++20 -Wall -Wextra -Werror
      -I src -I include -isystem "$VCPKG_ROOT/installed/x64-linux/include"
