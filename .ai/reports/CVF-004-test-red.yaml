schema_version: 1
change_id: CVF-004
phase: AUTHOR
owner: test-engineer
recorded_at: 2026-09-15
target: >-
  Recipe store: strict global config + versioned recipes + immutable catalog +
  atomic holder.
suite:
  framework: Catch2 v3 / C++20, -Wall -Wextra -Werror
  files:
    - tests/unit/cvf004_test_support.h
    - tests/unit/cvf004_error_codes_test.cpp
    - tests/unit/cvf004_config_test.cpp
    - tests/unit/cvf004_recipe_test.cpp
    - tests/unit/cvf004_catalog_test.cpp
    - tests/unit/cvf004_holder_test.cpp
  behaviors_covered:
    - B1 valid config/recipe parsing, field preservation, optional capture defaults
    - B2 config errors (1600-1605, 1607, 1011) plus token, selector, type, UTF-8, bounds
    - B3 recipe errors (1610-1621, 1623) plus algorithm-aware parameter delegation
    - B4 catalog load, sorted ids, empty/missing dir, filtering, all-or-nothing, duplicates
    - B5 find known/unknown, recipe_ids and size
    - B6 RecipeHolder default, swap, bounded concurrent readers
    - B7 failed candidate load preserves the published catalog
  contract_checks:
    - frozen error-code numbering 1600-1623 and broad-status mapping (1622 -> recipe_not_found)
    - path_not_absolute keeps 1011 -> invalid_argument
