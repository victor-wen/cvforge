phase: VERIFY
amendment: TV-2
report: .ai/reports/CVF-004-test-red-amendment-2.yaml
owner: test-engineer
scope: >-
  Test-side defect fix (no production code, no other roles' files). Deterministic
  synchronization of the hash-pinned holder concurrency test reported by the independent
  quality gate as TV-2.
defect:
  id: TV-2
  test: "CVF-004 B6: concurrent readers never observe a partial or mixed catalog"
  ctest_number: 192
  observed_by: "independent quality gate under ctest --preset wsl-gcc-asan --output-on-failure"
  failure: "tests/unit/cvf004_holder_test.cpp:112: CHECK( observations.load() > 0 ) -> 0 > 0"
  sanitizer_diagnostics: "none (no ASan/UBSan diagnostic; violations == 0 assertion passed)"
  root_cause: >-
    Intermittent liveness race in the test itself: the writer thread could complete all
    200 publish rounds (600 publishes) and set stop before the reader threads were first
    scheduled, so the final observations counter remained 0. Under ASan the whole suite
    ran slowly enough to expose it once. Repeating the single test 20x passed.
fix:
  file: tests/unit/cvf004_holder_test.cpp
  previous_sha256: b19baa48deb34e854e3244eaafb83a4ad5df35a2dd9e78f12d7bf059b35d23a9
  new_sha256: 7c4cd52c2ad7f5bf7acdcb9b0b27d628b1cb20950414c67d15beef43445dd465
  description: >-
    Deterministic start-up synchronization. Each of the 3 reader threads increments
    readers_ready before entering its observe loop; the writer performs a bounded spin
    (std::chrono::steady_clock deadline, 30 s timeout, std::this_thread::yield) until
    readers_ready == 3 and observations >= 3, then records success in the atomic
    concurrency_established and only then begins the unchanged 200 publish rounds of 3
    catalogs. On timeout the test fails deterministically on
    CHECK(concurrency_established.load()) instead of racing, hanging, degrading to a
    writer-only run, or being skipped. Since observations is monotonic and the writer only
    publishes after observations >= 3, CHECK(observations.load() > 0) is now unreachable
    by the former race while remaining a real liveness assertion.
  invariance:
    - "Invariant assertions preserved exactly: every observed snapshot must be one of the three complete published id sets AND ids.size() == snapshot->size(), violations must stay 0."
    - "No assertion removed, disabled, skipped, or weakened; concurrency coverage is still 3 concurrent readers vs. a publishing writer over 3 catalogs and 200 rounds."
    - "Added assertion CHECK(concurrency_established.load()) only makes scheduler failure explicit."
    - "Bounded and hardware-free; no sleeps introduced (bounded yield-spin only)."
