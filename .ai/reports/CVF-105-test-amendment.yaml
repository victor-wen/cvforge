scope: >-
  Bounded, test-only amendment of one case in tests/unit/cvf105_abi_pairs_test.cpp.
  No production source, public header, .ai/changes/**, or .ai/project-contract.yaml
  was modified.

reason: >-
  The B3 section "object with surrounding whitespace is accepted" fed input_json
  "  { \"a\" : 1 }  " and asserted cvf_inspect == CVF_STATUS_OK. The
  example.threshold algorithm rejects unknown input_json keys as
  algorithm_input_invalid, and that strict rejection behaviour is independently
  pinned by tests/unit/cvf003_example_threshold_test.cpp ("an unsupported
  input_json key is rejected" -> invalid_argument / algorithm_input_invalid). The
  case therefore conflated "the JSON text was parsed" with "the algorithm accepted
  the keys" and could never pass against the frozen algorithm.

change:
  file: tests/unit/cvf105_abi_pairs_test.cpp
  previous_sha256: 726c4646ae36754c61b7ae39dd102fccd306afdaa94f129f33cbb28e4cc2fcbb
  new_sha256: 16ee2d563d5f2f6d4edd83576a23158c59d140afc5e635846fbc00d234fde8e7
  preserved_intent: >-
    The amended section still proves leading/trailing whitespace is accepted by
    the C ABI input path; only the payload is changed to an algorithm-accepted
    object.
  cases:
    - name: "object with surrounding whitespace is accepted"
      old_input_json: "  { \"a\" : 1 }  "
      new_input_json: "  { \"invert\" : false }  "
      assertion: "CHECK(status == CVF_STATUS_OK) (unchanged)"
      rationale: >-
        example.threshold accepts the optional boolean key "invert" (pinned by
        cvf003_example_threshold_test.cpp "a boolean invert value is accepted"),
        so the object is valid JSON and algorithm-accepted while still carrying
        surrounding whitespace.
    - name: "malformed JSON with surrounding whitespace is rejected"
      added_input_json: "  { \"a\" : }  "
      assertions:
        - "CHECK(status == CVF_STATUS_INVALID_ARGUMENT)"
        - "CHECK(buffer.result.verdict == CVF_VERDICT_NOT_EVALUATED)"
      rationale: >-
        Brief boundary_cases already require "invalid JSON" coverage; this
        distinct section proves the whitespace-tolerant JSON input path still
        rejects malformed JSON with a technical INVALID_ARGUMENT and no
        NOT_EVALUATED verdict, consistent with the existing malformed-JSON case.
  not_weakened: >-
    No other assertion, SECTION, or test case was removed, skipped, disabled, or
    weakened. The pre-existing malformed-JSON and non-object-top-level sections
    are untouched.

