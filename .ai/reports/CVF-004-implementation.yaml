decisions:
  - id: d1
    area: strict JSON loader sharing
    detail: >-
      Duplicate-key detection and missing-vs-unreadable classification live once in
      recipes::detail::load_json_document (declared in src/recipes/config.h, defined in
      src/recipes/config.cpp) instead of a new detail header outside the contract's allowed_files
      list or duplicated logic in both loaders. The helper is internal (detail namespace) and does
      not alter the frozen public types; recipe.cpp includes recipes/config.h.
  - id: d2
    area: duplicate-key detection
    detail: >-
      One nlohmann parse with a parser callback that tracks the key set of every open object.
      nlohmann reports object keys one depth below object_start, so starting an object clears the
      next depth's set; sibling objects inside arrays therefore never produce false positives. The
      callback's duplicate flag is inspected after the parse. Semantics were verified against the
      installed nlohmann 3.12.0 event stream before implementation, and both the false-positive and
      true-positive cases are pinned by developer tests.
  - id: d3
    area: atomic holder
    detail: >-
      RecipeHolder stores std::atomic<std::shared_ptr<const RecipeCatalog>> with release store /
      acquire load, so readers observe exactly one complete old or new catalog. The catalog is
      immutable after load and find() returns a pointer into the owned recipe vector; the vector is
      never mutated after construction.
  - id: d4
    area: catalog directory IO
    detail: >-
      A missing recipes directory maps to 1606; a directory iteration failure maps to 1607
      (config_io_error) because the frozen numbering has no dedicated directory-unreadable code.
      Not covered by the independent suite; documented for the reviewer.
  - id: d5
    area: save_policy spec alignment
    detail: >-
      The on-disk CVF-004 contract revision freezes ArtifactsConfig::save_policy as std::string
      with strict token validation {always, fail_or_error, never}. The implementation matches it
      and the frozen independent tests' text comparison; recorded as a spec-alignment note, not a
      deviation.
  - id: d6
    area: validation ordering and defaults
    detail: >-
      Unknown keys are rejected before missing-key checks; schema_version must be the integer 1.
      camera.backend is required; device_path/vendor_id/product_id/friendly_name default to empty
      when absent and are then subject to the selector and 4-hex rules. base_capture, logging and
      retention fields are all required. Messages are bounded ASCII literals plus validated keys.

blockers:
  - id: TV-1
    owner: test-engineer
    severity: blocking-for-203/203
    evidence: ".ai/validation/cvf004-developer/ctest-gcc.log and ctest-asan.log, CTest test #153"
    detail: >-
      tests/unit/cvf004_test_support.h valid_config_json_text() writes logging as
      '"max_files": 5' with no trailing comma, but tests/unit/cvf004_config_test.cpp line 154
      (section 'nested logging duplicate') calls replace_once(..., R"("max_files": 5,)", ...).
      replace_once therefore fails REQUIRE(position != std::string::npos) at
      cvf004_test_support.h:115 before load_global_config is ever called (12/13 assertions pass).
      No production change can affect this. Required action: the test owner adds the comma to the
      fixture (or changes the anchor), re-runs the suite, and updates the CVF-004 ownership hash.
      The intended production behavior is already covered by developer test 'CVF-004 dev: a nested
      duplicate configuration key is rejected', which passes.
  - id: B-1
    owner: none (platform)
    severity: informational
    detail: >-
      Windows MSVC preset was not executed in this WSL session; Windows ABI/package evidence
      remains a CI concern per the baseline.

next_phase: "independent verification (test-engineer verify run); test owner resolves TV-1 for 203/203"

