summary: >-
  Completed the CVF-105 implementation record. The four production fixes were
  already present in the tree and compile: canonical VID/PID handling
  (src/recipes/config.*), the C ABI pointer-length/capacity pre-validation and
  verbatim payload copy (src/c_api/cvf_entry_points.cpp), atomic diagnostics
  warning bits (src/diagnostics/diagnostics.*), and the single canonical,
  bounded pre-serialized result payload plus exact-identity matching
  (src/runtime/context.*, src/camera/camera_backend.cpp). The one remaining
  wiring gap was closed: tests/unit/test_cvf105_hardening.cpp was registered in
  CMakeLists.txt as cvf105_hardening_developer_tests inside the
  CVFORWIN_BUILD_TESTS path and nested under CVFORWIN_BUILD_TEST_BACKENDS (it
  drives the production runtime against the deterministic synthetic backend),
  never inside CVFORWIN_BUILD_HARDWARE_TESTS. It builds and runs clean on the
  portable debug preset (105 assertions / 6 cases) and under ASan. The full
  wsl-gcc-debug ctest suite is 412/412 green including the amended CVF-004 test,
  format-check and clang static-analysis are clean, abi-check still exports
  exactly the five v1 symbols, and the independent cvf105 test files and
  .ai/test-ownership.yaml are byte-identical to their pinned hashes. One
  blocker is recorded below: two independent CVF-105 ASan cases use a
  heap-use-after-free that is a test-owned lifetime defect in a hash-pinned file
  and cannot be fixed from the developer scope.

