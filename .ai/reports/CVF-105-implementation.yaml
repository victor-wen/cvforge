    status: done
    note: >-
      Added cvf105_hardening_developer_tests in CMakeLists.txt immediately after
      the independent CVF-105 block, inside the enclosing if(CVFORWIN_BUILD_TESTS)
      block and nested in if(CVFORWIN_BUILD_TEST_BACKENDS). It links cvforwin,
      cvforwin_runtime, cvforwin_recipes, cvforwin_camera, cvforwin_diagnostics,
      cvforwin_test_backends, nlohmann_json, opencv_core, Threads and
      Catch2::Catch2WithMain, defines CVFORWIN_TEST_BACKENDS_ENABLED=1, applies
      cvforwin_apply_test_compile_options and cvforwin_apply_sanitizers, calls
      cvforwin_place_shared_library (shared libcvforwin.so), and registers via
      catch_discover_tests. No production source logic was touched by the wiring.
  - requirement: "Build and run the developer target; fix only its own file"
    status: done
    note: >-
      Built and ran clean with no compile, sanitizer, clang-tidy, or
      clang-format issues. No edit to tests/unit/test_cvf105_hardening.cpp was
      required.
