blockers:
  - id: CVF-105-IMPL-ASAN-UAF
    severity: blocking-for-asan-gate
    owner: test-engineer
    status: open
    summary: >-
      Two hash-pinned independent CVF-105 cases fail under AddressSanitizer with
      heap-use-after-free inside the test file itself. The developer cannot fix
      them: the file is test-owner owned and must remain hash-pinned.
    failing_cases:
      - "ctest #384 / TEST_CASE 'CVF-105 B3: a valid pointer set with a missing root fails without publishing a context', tests/unit/cvf105_abi_validation_test.cpp:310-327"
      - "ctest #391 / TEST_CASE 'CVF-105 B4: a short error message buffer reports the primary failure status and the required size', tests/unit/cvf105_abi_validation_test.cpp:230-261"
    root_cause: >-
      The helper options_for(const std::string& config_root, const std::string&
      output_root) (cvf105_abi_validation_test.cpp:43-56) stores
      options.config_root_utf8 = config_root.c_str() and
      options.config_root_utf8_bytes = config_root.size(). Both failing cases call
      it with the const char* literal kMissingRoot ("/nonexistent/cvf105-1007-
      config-root", line 58), so a temporary std::string is materialized that is
      destroyed at the end of the initializing full-expression (B3 line 317, B4
      lines 238 and 250). cvf_initialize then reads options.config_root_utf8 in
      validate_root_path -> core::validate_text -> string_view::find (memchr), a
      heap-use-after-free. Every other case in the file passes a named std::string
      test-local, so its pointer outlives the call and those cases do not trip ASan.
    not_a_production_defect: >-
      include/cvforwin/cvf_api.h:15-16 states "Input pointers and the log callback
      must stay valid for the duration of the call that uses them; cvf_initialize
      copies the values it retains." Production builds a string_view from the
      caller's pointer and byte length and reads it synchronously, which is the
      documented contract. Nothing production can do detects a pointer that was
      freed by the caller before the call. src/core/abi_validation.cpp and
      src/core/text.cpp are unchanged by CVF-105 (not in the change diff).
    asan_evidence: >-
      ASan: heap-use-after-free, READ of size 3 at the freed 37-byte kMissingRoot
      buffer, in std::char_traits<char>::find <- core::validate_text
      (src/core/text.cpp:78) <- validate_root_path (src/core/abi_validation.cpp:52)
      <- validate_init_options (abi_validation.cpp:126) <- validate_options_struct
      (src/c_api/cvf_entry_points.cpp:259) <- initialize_impl (:397) <-
      cvf_initialize (:595). Allocation and free both at the test's
      options_for(kMissingRoot, ...) statement.
    required_action: >-
      Test owner to bind the literal to a named std::string local (e.g.
      const std::string missing_root = kMissingRoot;) in both cases so the buffer
      lives across the cvf_initialize call, re-run wsl-gcc-asan ctest, and update
      the pinned hash. No production change is warranted.
    impact: >-
      All other gates are green; only ctest --preset wsl-gcc-asan exits non-zero
      (410/412). The non-sanitized wsl-gcc-debug suite is 412/412 green because
      the freed 37-byte buffer is still readable there.

