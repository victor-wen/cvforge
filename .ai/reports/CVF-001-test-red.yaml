ambiguities:
  - case: inspect_null_context_struct_size_zero_not_ok / inspect_null_context_result_struct_size_zero_not_ok / inspect_null_context_abi_version_two_not_ok
    issue: >-
      The brief pins CVF_STATUS_INVALID_CONTEXT only for otherwise well-formed
      request/result structures, and pins struct_size/abi_version statuses
      without stating which validation runs first. With a malformed struct and a
      null context simultaneously, the exact status is underdetermined.
    handling: "Only no-crash and non-OK (no fake OK) are asserted; no exact status is guessed."
  - case: initialize_reserved_nonzero_not_ok
    issue: >-
      No successful initialize exists in this change (nonexistent config root is
      the only reachable path), so a nonzero-reserved rejection cannot be
      isolated from the config failure; both are non-OK.
    handling: "Only the brief's documented non-OK property is asserted."
  - case: initialize_error_message_capacity_zero / initialize_error_message_capacity_one
    issue: >-
      The brief does not state whether an undersized error buffer changes the
      returned status. The tests assert the operation status is unchanged and
      message_bytes_required is identical to the full-capacity run, derived from
      B6 (required reports the needed size even when the buffer is too small)
      plus deterministic error reporting.
    handling: "Asserted with traceability to B6; flagged for reviewer attention."
