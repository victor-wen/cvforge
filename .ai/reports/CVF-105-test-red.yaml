cross_change_conflict:
  id: CVF-004-vs-FR-024
  file: tests/unit/cvf004_config_test.cpp
  file_sha256: 3cd3f957b5887b7dfbede112384c52e7befa67f25f5c9df5fb43077436750335
  pinned_in_manifest: true
  conflict: >-
    The hash-pinned CVF-004 test asserts uppercase VID/PID preservation
    (e.g. vendor_id == "1A2B"), while FR-024 canonicalizes VID/PID to four
    lowercase hex digits. Once the FR-024 behavior lands, the CVF-004 uppercase
    expectation and the CVF-105 lowercase expectation cannot both hold.
  observed_evidence: >-
    CVF-105 selector/config cases currently fail with "1A2B" == "1a2b" and
    "0C3D" == "0c3d", i.e. the current implementation still returns the uppercase
    form, which is exactly what the pinned CVF-004 assertion requires.
  action: >-
    Do NOT modify tests/unit/cvf004_config_test.cpp in this task. The test owner
    must reconcile it as a recorded amendment during CVF-105 verify (update the
    pinned uppercase expectation to the FR-024 lowercase canonical form and record
    the new sha256 in .ai/test-ownership.yaml).
  status: open

author_assumptions:
  - >-
    Frozen seam spellings used by the tests: cvforwin::recipes::canonicalize_hex4
    (std::string_view) returning core::Result<std::string>;
    cvforwin::runtime::k_max_result_payload_bytes == 65535u;
    cvforwin::runtime::serialize_result_payload(const nlohmann::json&) returning
    core::Result<std::string>; std::string
    cvforwin::runtime::InspectionOutcome::output_text.
  - >-
    Diagnostics::warnings()/clear_warnings() keep their existing signatures and
    are backed by atomics; the tests observe only the returned warning bits and the
    documented core::WarningFlags values.
  - >-
    Configuration VID/PID canonicalization is observed through the existing strict
    config parse entry point; device_path and friendly_name stay byte-exact.
  - >-
    ABI status numbers asserted by the tests come from the frozen public header
    (INVALID_ARGUMENT == 1, CONFIG_ERROR == 5, BUFFER_TOO_SMALL == 10).
  - >-
    Each test target links only library targets (cvforwin_recipes, cvforwin_camera,
    cvforwin_runtime, cvforwin_diagnostics, cvforwin) plus Catch2 and
    nlohmann_json; no production .cpp is included and no production source is read.
  - >-
    The ABI request-pair and runtime output_text targets require the deterministic
    test backends; on the canonical wsl-gcc-debug preset CVFORWIN_BUILD_TEST_BACKENDS
    was enabled, so all seven targets were registered.
  - >-
    CMakeLists.txt registration was applied by .ai/validation/cvf105-register.py
    (idempotent, append-only) rather than by hand, because the repository-root path
    is outside the test engineer's direct edit policy; CMakeLists.txt is build
    configuration and is not an owned test artifact.
  - >-
    Tests are Catch2 v3 / C++20, deterministic, and hardware-free; any filesystem
    state is created under per-test temporary directories at run time, so no binary
    fixture is checked in.
  - note: >-
      Reconstructed from the persisted author harness and manifest notes because
      the author-phase session context is not available; no assumption was inferred
      from production source.

