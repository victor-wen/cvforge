schema_version: 1
change_id: CVF-003
phase: AMENDMENT
owner: test-engineer
recorded_at: 2026-09-19
program: cvforwin-hardening-1.1.0
amendment_of: .ai/reports/CVF-003-test-red.yaml
amendment_number: 2
implementing_change: CVF-106
reason: >-
  Contract 1.1.0 FR-029 (approved) adds the compiled template.match reference
  algorithm, and algorithm_extension_contract.required_fields plus the CVF-003 B2
  intent require registration to publish every compiled algorithm by stable key.
  register_compiled_algorithms() therefore publishes two keys, example.threshold and
  template.match. The hash-pinned CVF-003 B2 cases in tests/unit/cvf003_registry_test.cpp
  still asserted a hard-coded registry.size() == 1u (lines 161 and 182) and therefore
  became stale relative to FR-029: the test asserted the pre-FR-029 set, not the
  contract's registration invariant. This is the same class of correction as the
  CVF-004 Amendment 4 (FR-024) precedent and is test-only.
prior_amendment_note: >-
  .ai/reports/CVF-003-test-amendment.yaml did not exist at write time (recorded as
  "File not found"), so there was no prior amendment content to append to. This report
  is recorded as amendment 2 per the task instruction; no earlier separate CVF-003
  amendment report exists in .ai/reports/. The CVF-003 verify-phase coverage update did
  not modify cvf003_registry_test.cpp.
artifact:
  path: tests/unit/cvf003_registry_test.cpp
  previous_sha256: d43c2ec1b75848e3bcfb8d2b7dc09cd67234f3a8072975bfc385fee8c2186937
  new_sha256: 72d058116187731df1aa85f844c7f5254a282ecea2fd39ed1ae9279bd76c4076
  case_count_change: "0 (11 registry cases before and after; 37 CVF-003 cases before and after)"
include_change:
  added:
    - "#include <algorithm>"
  reason: std::sort for the order-independent exact key-set comparison.
changed_assertions:
  # The registration precondition and the duplicate-key failure expectation are unchanged.
  - case: "CVF-003 B2: register_compiled_algorithms publishes example.threshold on a fresh registry"
    renamed_to: "CVF-003 B2: register_compiled_algorithms publishes every compiled algorithm on a fresh registry"
    location: tests/unit/cvf003_registry_test.cpp:161 (old) -> tests/unit/cvf003_registry_test.cpp:167-176 (new)
    old_assertion: 'CHECK(registry.size() == 1u);'
    new_assertions:
      - 'CHECK(registry.size() == expected_keys.size());  // expected_keys = {example.threshold, template.match}'
      - 'CHECK(published_keys == expected_keys);  // keys() sorted, exact set independent of registration order'
      - 'REQUIRE(registry.find(key).has_value()) and REQUIRE(found.value() != nullptr) and CHECK(found.value()->key() == key) for each of example.threshold and template.match'
    rationale: >-
      The old count-only assertion pinned the pre-FR-029 snapshot. The new assertions pin
      the exact registered key set and each key's find() resolution, which is strictly
      stronger (a count of 2 with a wrong key would now fail).
  - case: "CVF-003 B2 negative: a second registration fails with algorithm_duplicate_key and keeps the original"
    location: tests/unit/cvf003_registry_test.cpp:182 (old) -> tests/unit/cvf003_registry_test.cpp:195-198 (new)
    old_assertion: 'CHECK(registry.size() == 1u);'
    new_assertions:
      - 'CHECK(registry.size() == expected_keys.size());  // two-key set after the duplicate rejection'
      - 'CHECK(published_keys == expected_keys);  // exact set retained, order-independent'
      - 'CHECK(registry.find("example.threshold").value() == original);  // unchanged pointer-identity retention'
    rationale: >-
      The negative case still proves the second registration is rejected with
      algorithm_error/algorithm_duplicate_key and that the pre-existing entry is retained.
      It now pins the exact two-key set instead of a stale count.
behavior_preserved:
  registration_publishes_every_compiled_algorithm: >-
    Both amended cases still assert that a successful register_compiled_algorithms()
    publishes every compiled algorithm and that find() resolves each published key to a
    non-null instance whose key() equals that key. The intent "registration publishes
    every compiled algorithm" is preserved and no longer hard-codes the count.
  duplicate_rejection_and_retention: >-
    The B2 negative case still requires the second call to fail with
    core::Status::algorithm_error / core::ErrorCode::algorithm_duplicate_key and still
    requires the original example.threshold pointer to be retained by find().
  no_case_deleted: >-
    No test case was deleted. All 11 registry cases and all 37 CVF-003 cases remain.
assertion_integrity: >-
  No assertion was removed, skipped, disabled, or weakened. The two count assertions were
  replaced by exact-set and per-key assertions that are strictly stronger than the old
  hard-coded count; no test case, boundary case, or negative case was deleted. The change
  is test-only: no production source, header, build file, or interface was modified.
