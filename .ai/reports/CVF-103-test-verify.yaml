requirement_checks:
  - id: 1
    request: "uvc_stream_generation.h implements the gate exactly per contract and has no Windows/MF/OpenCV dependency"
    method: >-
      Behavioral: the portable target builds and runs
      tests/unit/cvf103_stream_generation_test.cpp against the real seam header, which
      asserts first generation 1, strictly increasing generations, accepts() true only
      for the active generation, retire() rejecting every generation, and
      discard_stale() counting stale events while leaving the active generation
      untouched. Structural: the portable target is configured with include dirs
      src + tests/unit and links only Catch2::Catch2WithMain (no OpenCV include/link
      path, no Windows SDK); a green Linux build therefore shows the transitively
      included seam header compiles without Windows/Media Foundation/OpenCV headers.
    result: PASS
    evidence: "108 assertions in 15 test cases (exit 0); canonical portable build exit 0"
  - id: 2
    request: >-
      uvc_backend.cpp creates a fresh callback per stream, tags completions with the
      callback generation, applies only gate-accepted completions, increments
      stale_events_discarded without setting read_completed/read_status/read_flags/
      read_sample/flush_completed, retires before releasing reader/source/callback,
      and cannot satisfy the next capture with a late completion
    method: >-
      Not independently verifiable in this session. The behavior is Windows/Media
      Foundation only and cannot execute on Linux; direct source inspection is
      outside the independent test-engineer boundary. The owner's Windows component
      TU (tests/windows/uvc/cvf103_uvc_callback_snapshot_test.cpp) asserts the
      observable snapshot contract and compiles cleanly against the real headers.
    result: DEFERRED
    evidence: "windows TU syntax-only compile exit 0; no Windows execution claimed"
  - id: 3
    request: "UvcCallbackSnapshot + callback_snapshot() are internal and no public header/export changed"
    method: >-
      Structural symbol-presence audit (counts only) on the public C header, the
      ICameraBackend contract header, and the export allowlist, plus the independent
      ABI/contract suites passing in the full portable ctest run.
    result: PASS
    evidence: >-
      UvcCallbackSnapshot=0 and callback_snapshot=0 in include/cvforwin/cvf_api.h,
      src/camera/camera_backend.h, and src/c_api/cvforwin.def; no tests/abi file
      references the internal seam; full portable ctest 307/307 passed.
  - id: 4
    request: "CVF-103 CMake targets gated correctly"
    method: >-
      Build-configuration inspection: combined-gate context in CMakeLists.txt and the
      CVFORWIN_BUILD_TEST_BACKENDS flag in the Windows presets; plus host configure/ctest.
    result: PASS
    evidence: >-
      cvf103_windows_uvc_tests is inside
      "if(WIN32 AND CVFORWIN_BUILD_TESTS AND CVFORWIN_BUILD_TEST_BACKENDS)" (CMakeLists.txt
      line ~1154); windows-msvc-release sets CVFORWIN_BUILD_TESTS=ON and
      CVFORWIN_BUILD_TEST_BACKENDS=OFF; windows-msvc-tests sets both ON; the Linux
      configure discovers 0 instances of cvf103_windows_uvc_tests; cvf103_generation_tests
      is registered and discovered on the portable host (15 cases).

edge_cases_added:
  portable_unit:
    - "boundary: the maximum uint64 generation is rejected while inactive and counted exactly once when discarded, without disturbing the active generation"
    - "boundary: discard_stale() of the active generation is a non-discard and leaves active_generation()/accepts() unchanged"
    - "boundary: the zero sentinel is a stale generation and never disturbs the active one"
    - "B4: retire() then begin_stream() activates only the replacement generation and rejects retired, replacement-1, and replacement+1"
    - "B4: repeated retire() is idempotent and still leaves no generation accepted"
    - "negative: three consecutive generations accept only the newest and exactly two stale discards are counted"
  windows_component:
    - "boundary: close before open and repeated close keep an idle, consistent snapshot and a capture afterward still fails deterministically"
    - "B4: snapshot counters are monotonic non-decreasing across three repeated open/capture/reconnect/close cycles"
    - "boundary: a capture at the expired-deadline boundary accepts no completion, reports timeout/capture_timed_out, and counts no stale event"
  note: >-
    A true 2^64 generation wraparound cannot be reached from the frozen public surface
    (no seeding/reset hook); the closest requirement-derived boundary is the maximum
    representable generation, which is covered. No existing assertion was removed,
    disabled, skipped, or weakened.

