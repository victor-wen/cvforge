program: cvforwin-hardening-1.1.0
amendment_of: .ai/reports/CVF-004-test-red.yaml
amendment_number: 4
implementing_change: CVF-105
reason: >-
  Contract FR-024 (approved 1.1.0) requires configured and enumerated UVC VID/PID values to
  be canonicalized to four lowercase ASCII hexadecimal digits before identity comparison.
  The interface global_configuration_v1.normalization states the same rule: camera.vendor_id
  and camera.product_id accept either hexadecimal case at the JSON boundary and are stored
  as exactly four lowercase ASCII hexadecimal digits. The hash-pinned CVF-004 test
  tests/unit/cvf004_config_test.cpp instead asserted uppercase preservation and therefore
  contradicted FR-024. This is the open finding CVF105-CONFLICT-01 recorded in
  .ai/workflow-state.yaml and cross_change_conflict in .ai/reports/CVF-105-test-red.yaml.
artifact:
  path: tests/unit/cvf004_config_test.cpp
  previous_sha256: 3cd3f957b5887b7dfbede112384c52e7befa67f25f5c9df5fb43077436750335
  new_sha256: a4d46eaad3b2414c7f5ad4adf4c2f6fb60fc7c16b9018b493527d07e30cf2b93
changed_assertions:
  # The JSON fixture input for these cases is unchanged: valid_config() writes the
  # camera selector as uppercase "1A2B"/"0C3D". Only the observable expectation changed.
  - case: "CVF-004 B1: a valid cvforwin.json parses to the documented values and records both roots"
    location: tests/unit/cvf004_config_test.cpp:28
    old_assertion: 'check_text(config.camera.vendor_id, "1A2B", "camera.vendor_id");'
    new_assertion: 'check_text(config.camera.vendor_id, "1a2b", "camera.vendor_id");'
  - case: "CVF-004 B1: a valid cvforwin.json parses to the documented values and records both roots"
    location: tests/unit/cvf004_config_test.cpp:29
    old_assertion: 'check_text(config.camera.product_id, "0C3D", "camera.product_id");'
    new_assertion: 'check_text(config.camera.product_id, "0c3d", "camera.product_id");'
  - case: "CVF-004 B2: the camera selector accepts device_path or a VID/PID pair (VID/PID pair alone selects)"
    location: tests/unit/cvf004_config_test.cpp:93
    old_assertion: 'check_text(loaded.value().camera.vendor_id, "1A2B", "camera.vendor_id");'
    new_assertion: 'check_text(loaded.value().camera.vendor_id, "1a2b", "camera.vendor_id");'
behavior_preserved:
  case_insensitive_acceptance: >-
    The three amended cases keep the uppercase JSON input "1A2B"/"0C3D" and now require it
    to be observable as "1a2b"/"0c3d", so together with the untouched lowercase-acceptance
    section (tests/unit/cvf004_config_test.cpp:96-105) they prove both cases are accepted
    and canonicalized to lowercase.
  no_case_deleted: >-
    No test case was deleted. The invalid-value rejection case
    "VID/PID values must be exactly four hexadecimal characters" (~lines 286-297) and all
    other assertions are untouched.
assertion_integrity: >-
  No assertion was removed, skipped, disabled, or weakened. Only the expected case of three
  uppercase literals was corrected to the FR-024 canonical lowercase form; coverage of
  case-insensitive acceptance and lowercase canonicalization is retained and strengthened.
