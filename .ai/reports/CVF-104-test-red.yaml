seam_selection:
  finalization_header: src/runtime/finalization.h
  finalization_declaration_used: >-
    SaveRequirement save_requirement_for(save_policy, required), struct
    FinalizeRequest, struct FinalizeDecision, FinalizeDecision
    finalize_after_frame(request, warn_base).
  save_worker_header: src/artifacts/save_worker.h
  save_worker_declaration_used: >-
    SaveJob, SaveState, SaveOutcome, class ArtifactSink (write_temp/commit/discard),
    class SaveWorker (try_submit/wait_until/cancel_pending/drain/executing/queued).
  retention_scheduler_header: src/artifacts/retention_scheduler.h
  retention_scheduler_declaration_used: >-
    RetentionScheduler (on_capture_committed/due/on_retention_run/committed_captures)
    plus k_retention_time_trigger and k_retention_capture_trigger.
  runtime_injection_point: "RuntimeOptions.artifact_sink (default null)"
  note: >-
    All seams are frozen by the change contract (quoted in the brief). The test
    files include frozen headers only and read no production .cpp. The
    save_worker and end-to-end cases substitute the frozen ArtifactSink with a
    deterministic test double in cvf104_test_support.h.

cases:
  finalization_unit:
    acceptance:
      - id: B2
        name: "a committed optional save with a valid PASS/FAIL keeps OK and publishes the image path"
      - id: B3/B4
        name: "post-frame algorithm/serialization error returns its status and publishes the committed image path"
      - id: B6
        name: "required save plus expired deadline returns TIMEOUT with NOT_EVALUATED"
      - id: B7
        name: "required save failure before the deadline returns REQUIRED_ARTIFACT_ERROR with NOT_EVALUATED"
    negative:
      - name: "required save that simply did not commit is also a required-artifact error"
      - name: "deadline expiry takes precedence over a required failure, even with an earlier post-frame error"
      - name: "required failure takes precedence over an earlier post-frame technical error"
    boundary:
      - "post-frame technical error without a committed save publishes no image path"
      - "required save committed just before expiry keeps the verdict and publishes the image path"
      - "required save not committed at the exact expiry times out"
      - "no valid frame makes no artifact attempt and reports the capture failure; a required policy still never becomes a required-artifact error"
      - "unknown and empty save_policy tokens skip (SaveRequirement::none)"
    contract:
      - "save_requirement_for maps never/always/fail_or_error x required exactly"
      - "warn_base is OR-ed into every decision and never changes status"
  worker_unit:
    acceptance:
      - "at most one save executes and one is queued; a third submit is rejected"
      - "a completed save returns a committed path inside the managed root"
    negative:
      - "an injected write failure yields a failed outcome with no published path"
      - "cancel_pending drops the queued job and never publishes its file"
      - "shutdown during an in-flight save does not deadlock and leaves no temp file"
    boundary:
      - "wait_until returns within the deadline when the save cannot complete"
  retention_unit:
    acceptance:
      - "the time trigger fires at exactly 60 seconds after a completed run"
      - "the capture trigger fires on the 100th committed capture"
      - "on_retention_run resets the committed-capture counter"
      - "a completed run resets the time baseline"
    boundary:
      - "the frozen scheduling constants are 60 seconds and 100 captures"
      - "whichever trigger comes first fires"
      - "the scheduler stays due (coalesced) until a completed run is recorded"
      - "custom triggers replace the defaults"
  end_to_end:
    acceptance:
      - id: B1
        name: "a PASS with save_policy never returns no image_path and warning-free OK"
      - id: B2
        name: "a FAIL with fail_or_error returns OK with a committed image_path inside the captures root"
      - id: B8
        name: "inspect waits for finalization, measures it in elapsed_ms, and never runs retention before returning"
      - id: B9
        name: "repeated inspections commit one bounded file each and never await retention"
      - id: B9
        name: "reaching the capture trigger runs retention off the caller path and removes the aged file"

expected_red:
  reason: >-
    None of the three frozen seams is implemented yet: src/runtime/finalization.h,
    src/artifacts/save_worker.h, and src/artifacts/retention_scheduler.h do not
    exist. The canonical build therefore stops before the four CVF-104 test
    executables are linked; CTest registers their discovered tests but reports
    them NOT_BUILT (Not Run). This is the honest RED for a pre-implementation
    author phase.
  failing_targets:
    - cvf104_finalization_tests
    - cvf104_worker_tests
    - cvf104_retention_tests
    - cvf104_end_to_end_tests

