assumptions:
  - >-
    The finalize_after_frame decision fields are the brief-frozen status,
    verdict, error_code, publish_image_path, and warning_flags; the detailed
    error_code enumerator for timeout/required_artifact_error is not pinned, so
    those cases assert nonzero code and status_for(error_code) == status.
  - >-
    The image-save warning bit is the second lowest warning flag (1u << 1u); the
    tests observe it through the decision's warning_flags and assert warn_base
    is OR-ed in, not replaced.
  - >-
    The managed captures root is discovered through a first completed save and
    then used as the containment anchor for later saved paths.
  - >-
    The retention triggers are 60 seconds and 100 committed captures, and a
    completed run is the only thing that clears the due state.
  - >-
    Reaching the 100-committed-capture trigger schedules retention on a
    background worker that is never awaited by inspect; the end-to-end case
    waits up to 15 seconds for the aged file to be removed asynchronously.

