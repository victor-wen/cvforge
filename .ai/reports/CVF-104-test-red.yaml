summary: >-
  Independent black-box tests were authored for the CVF-104 end-to-end absolute
  deadline, post-frame finalization, deadline-bounded artifact save, and
  background retention change before the frozen seams or their implementation
  exists. Five authored files cover the three frozen seams (finalization.h,
  save_worker.h, retention_scheduler.h) plus the runtime end-to-end path through
  RuntimeOptions.artifact_sink with the deterministic synthetic camera override.
  RED is honest and structural: the canonical build stops because the three
  frozen seams do not exist yet, so the four CVF-104 test executables are never
  built and CTest reports them NOT_BUILT. No execution output is fabricated or
  claimed. To show RED is the absent seams and not broken tests, the three
  portable unit TUs are additionally run against from-spec reference seams
  (finalization 100 assertions / 11 cases, worker 53 / 6, retention 331 / 8) and
  the end-to-end TU is syntax-checked against a from-spec overlay (exit 0).

