review_response:
  source: >-
    Independent review of docs/development.md returned REQUEST_CHANGES; the two
    blocking findings below were fixed in this round.
  fixes:
    - id: F1
      severity: major
      finding: >-
        The "Running a subset" direct-binary example selected no tests: the Catch2
        pattern "example.threshold*" matches no cvf003_tests case (all are named
        "CVF-003 ..."), and the example.threshold cases live in
        tests/unit/test_inspection_contract.cpp on the cvf_unit_tests target.
      edit: >-
        Replaced the single broken example with two verified commands
        (build/wsl-gcc-debug/cvf_unit_tests "example.threshold*" and
        build/wsl-gcc-debug/cvf003_tests "CVF-003*") and documented which target
        owns which case names.
      evidence:
        - command: build/wsl-gcc-debug/cvf003_tests "example.threshold*"
          exit_code: 2
          observed: >-
            No test cases matched, "No tests ran"; pre-fix reproduction of the
            reported defect.
        - command: build/wsl-gcc-debug/cvf_unit_tests "example.threshold*"
          exit_code: 0
          observed: All tests passed (32 assertions in 5 test cases).
        - command: build/wsl-gcc-debug/cvf003_tests "CVF-003*"
          exit_code: 0
          observed: All tests passed (295 assertions in 37 test cases).
    - id: F2
      severity: minor
      finding: >-
        Sections 11 and 13 claimed the package-symbols target exists on portable
        hosts and refuses with a designed non-zero exit. cmake/CvfPackage.cmake
        creates refusal targets only for package and package-verify on non-Windows
        and returns before package-symbols is defined.
      edit: >-
        Section 11 now states that package and package-verify are refusal targets
        while package-symbols is not defined on portable hosts; section 13 splits
        the old row into two rows matching the real behaviour.
      evidence:
        - command: cmake --build build/wsl-gcc-debug --target package
          exit_code: 1
          observed: >-
            Designed refusal: "package is Windows-only - run the
            windows-msvc-release preset on windows-2022 CI" followed by cmake -E false.
        - command: cmake --build build/wsl-gcc-debug --target package-verify
          exit_code: 1
          observed: >-
            Designed refusal: "package-verify is Windows-only - run the
            windows-msvc-release preset on windows-2022 CI" followed by cmake -E false.
        - command: cmake --build build/wsl-gcc-debug --target package-symbols
          exit_code: 1
          observed: >-
            "ninja: error: unknown target 'package-symbols'"; the target is not
            defined in the portable build tree.
  full_command_recheck:
    description: >-
      Every other filter/command example in the manual was re-run or re-audited
      after the edits.
    evidence:
      - command: ctest --preset wsl-gcc-debug -N
        exit_code: 0
        observed: 263 registered tests.
      - command: ctest --preset wsl-gcc-debug -R "cvf\.abi\." --output-on-failure
