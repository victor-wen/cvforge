        observed: >-
          0 cited-but-nonexistent presets; all 19 unique preset names appear with
          an explicit command.
      - command: grep -c '^```' docs/development.md
        observed: 18 (9 balanced fenced code blocks).
      - command: grep for the removed broken example
        exit_code: 1
        observed: no match; the old cvf003_tests "example.threshold*" example is gone.
