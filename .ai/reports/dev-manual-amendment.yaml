      - command: ctest --preset wsl-gcc-debug -R "CVF-006" --output-on-failure
        exit_code: 0
        observed: 100% tests passed, 0 failed out of 19.
      - command: ctest --preset wsl-gcc-debug -R "example\.threshold" --output-on-failure
        exit_code: 0
        observed: 100% tests passed, 0 failed out of 7.
      - command: cmake --build --preset wsl-gcc-debug-format-check
        exit_code: 0
        observed: format-check passed, 83 files conform to .clang-format.
      - command: cmake --build --preset wsl-gcc-debug-abi-check
        exit_code: 0
        observed: abi-check passed, exactly 5 exports.
      - command: cmake --build --preset wsl-clang-analysis --target static-analysis --parallel
        exit_code: 0
        observed: static-analysis passed, 21 files clean under .clang-tidy.
      - command: preset citation audit (comm of doc --preset names against the four live lists)
