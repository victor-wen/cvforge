findings:
  - id: NBF-01
    severity: medium
    file: tests/hardware/uvc_smoke.cpp
    lines:
      - "55-68 (operator note: symmetric control is not a substitute)"
      - "966-1027 (run_orientation_case)"
      - "972-984 (mandatory gate)"
      - "1008-1026 (positive checks first, additive negative control)"
    changed: >-
      run_orientation_case now reads orientation_test and symmetric_control
      separately. (a) A required orientation check (stress mode or
      CVF_HW_REQUIRE_ORIENTATION=1) with CVF_HW_ORIENTATION_TEST unset now calls
      report.check(false, ...) and returns, regardless of
      CVF_HW_ORIENTATION_SYMMETRIC_CONTROL; the failure message states the control
      is not a substitute for the positive target. (b) When both flags are set the
      positive asymmetric checks (contrast >= min and bright TOP at visual top)
      run first, and the negative symmetric control is then added in addition with
      no early return after it. (c) The original non-required skip path is kept
      only when neither flag is set. A comment block above the gate records that
      the control is not a substitute. No assertion was removed, weakened,
      disabled, or skipped; the file gained the mandatory-orientation failure
      branch and the additive ordering.
    before: >-
      With CVF_HW_ORIENTATION_SYMMETRIC_CONTROL set the function ran only the
      negative control and returned, so with CVF_HW_ORIENTATION_TEST also set the
      positive asymmetric checks never ran; a required check was satisfiable by a
      vertically symmetric card.
    after: >-
      A required check fails closed when the positive target is not requested;
      both flags set runs the positive asymmetric checks and then the negative
      control on the same captured frame, with no silent skip.

  - id: NBF-02
    severity: medium
    file: docs/hardware-uvc.md
    lines:
      - "32-39 (discover section: enumerated VID/PID are empty on this backend)"
      - "46-56 (selector table: DEVICE_PATH/NAME work; VID/PID only on a backend that populates them)"
    changed: >-
      Documented plainly that on the Windows Media Foundation backend this suite
      targets, enumerate() leaves vendor_id and product_id empty and populates only
      device_path and friendly_name, so VID/PID can never match. The selector table
      now marks CVF_HW_UVC_DEVICE_PATH and CVF_HW_UVC_NAME as working (preferred),
      and states that CVF_HW_UVC_VID/CVF_HW_UVC_PID only match on a
      platform/backend that populates those fields, with an explicit note that
      Windows operators should use DEVICE_PATH or NAME. The code's selector logic
      was not changed.

  - id: NBF-03
    severity: low
    file: docs/hardware-uvc.md
    lines:
      - "156-162 (section 8 reconnect wording)"
    changed: >-
      Replaced the false "The suite always exercises a bounded reconnect" claim
      with an accurate statement that the bounded-reconnect / unplug-replug case
      (H6) runs only when CVF_HW_UNPLUG_TEST=1 and is skipped (reported as a skip,
      not executed) otherwise; the existing in-section sentence that the case is
      skipped when the variable is unset was retained.

  - id: NBF-04
    severity: low
    file: docs/hardware-uvc.md
    lines:
      - "12-24 (build section)"
      - "246 (operator $exe path)"
    changed: >-
      Replaced the ad-hoc "cmake -S . -B build\\hw -G Visual Studio 17 2022 ..."
      build command with the contract's canonical windows-msvc-tests preset
      invocation (cmake --preset windows-msvc-tests
      -DCVFORWIN_BUILD_HARDWARE_TESTS=ON, then cmake --build --preset
      windows-msvc-tests --config Release --target cvf_hw_uvc_smoke --parallel),
      noting the preset supplies the MSVC v143 x64 generator, the build directory,
      the vcpkg toolchain/triplet, and the warning-as-error policy. All binary-path
      references now use build\\windows-msvc-tests\\Release\\cvf_hw_uvc_smoke.exe,
      matching the contract.

