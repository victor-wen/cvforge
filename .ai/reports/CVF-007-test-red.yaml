cases:
  - id: H1
    location: "tests/hardware/uvc_smoke.cpp :: check_enumeration()"
    trace: "brief observable_behaviors H1"
    checks:
      - "backend.backend_key() == \"uvc\""
      - "enumerate(deadline) succeeds"
      - "every enumerated descriptor has backend_key \"uvc\" and a non-empty device_path"
      - "vendor_id/product_id are empty or exactly 4 lowercase hex (descriptor contract)"
      - "exposed optional identity fields are printed; fields the OS does not expose are not fabricated or required"
    category: acceptance

  - id: H2
    location: "tests/hardware/uvc_smoke.cpp :: run_suite(), run_resolution_cases()"
    trace: "brief observable_behaviors H2"
    checks:
      - "empty selector -> invalid_argument/selector_empty (never a first-device fallback)"
      - "selector matching no enumerated device -> camera_not_found/camera_not_found"
      - "selector matching multiple devices (synthetic twin pair) -> camera_not_found/camera_identity_ambiguous"
      - "operator selector from CVF_HW_UVC_DEVICE_PATH/VID/PID/NAME is mandatory and must resolve exactly one device"
    category: acceptance

  - id: "H2 boundary: friendly_name-only selector"
    location: "tests/hardware/uvc_smoke.cpp :: run_resolution_cases()"
    trace: "brief boundary_cases item 1"
    checks:
      - "friendly_name-only selector resolves the same descriptor, or fails per rules (ambiguous/not found), never a fallback"
      - "friendly_name matching is exact: a suffixed name yields camera_not_found"
      - "skipped with a reason if the device exposes no friendly_name"
    category: boundary

  - id: "H2 boundary: zero devices attached"
    location: "tests/hardware/uvc_smoke.cpp :: run_suite()"
    gate: "CVF_HW_EXPECT_ZERO_DEVICES=1 (camera-less station)"
    trace: "brief boundary_cases item 2"
    checks:
      - "enumerate is empty"
      - "resolution fails with camera_not_found/camera_not_found"
    category: boundary

  - id: H3
    location: "tests/hardware/uvc_smoke.cpp :: run_open_capture_close_session()"
    trace: "brief observable_behaviors H3"
    checks:
      - "open with the resolved descriptor and configured settings (default 640x480 BGR8, env-overridable) succeeds"
      - "three consecutive captures return owned BGR8 frames with the configured dimensions and strictly increasing sequence"
      - "consecutive frames do not alias one pixel buffer"
      - "close() is idempotent (called twice) and capture afterwards fails with camera_io, no crash"
      - "the backend can reopen the same descriptor and capture again"
      - "held pixels stay valid after close and backend destruction"
    category: acceptance

  - id: H4
    location: "tests/hardware/uvc_smoke.cpp :: run_repeated_cycles_case()"
    trace: "brief observable_behaviors H4"
    checks:
      - "50 repeated captures (CVF_HW_CYCLES overridable) all return valid BGR8 frames with configured dimensions and increasing sequence"
      - "one further capture succeeds after the loop"
      - "the device is still enumerated after the loop (no resource exhaustion)"
    category: acceptance

  - id: H5
    location: "tests/hardware/uvc_smoke.cpp :: run_expired_deadline_case()"
    trace: "brief observable_behaviors H5"
    checks:
      - "capture with an already-expired deadline (core::Deadline::immediate()) -> timeout/capture_timed_out"
      - "a normal capture afterwards succeeds (device not wedged)"
    category: acceptance

  - id: H6
    location: "tests/hardware/uvc_smoke.cpp :: run_manual_replug_case()"
    gate: "CVF_HW_UNPLUG_TEST=1 plus an interactive console; unset -> reported skipped, never runs automatically"
    trace: "brief observable_behaviors H6 and constraints"
    checks:
      - "first capture after unplug fails with camera_io"
      - "bounded capture_with_one_retry fails with camera_io while the device is absent, within deadline + 2000 ms slack"
      - "after replug into the same USB port, one bounded reconnect + recapture recovers with a valid BGR8 frame"
      - "the at-most-one-retry rule itself is pinned deterministically by the hardware-free CVF-002 suite; this case observes the bounded recovery end to end"
    category: acceptance, manual

  - id: "negative: open before resolve / stale descriptor"
    location: "tests/hardware/uvc_smoke.cpp :: run_negative_cases()"
    trace: "brief negative_cases"
    checks:
      - "capture before open fails with status camera_io, no crash"
      - "open with a fabricated stale descriptor fails with status camera_not_found, no crash; the exact detail code is printed, not pinned"
      - "close() on a never-opened backend returns without crashing"
    category: negative

