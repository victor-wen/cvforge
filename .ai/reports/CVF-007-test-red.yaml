  required_wiring: "see developer_wiring below; the target must exist before any execution claim"
  operator_steps:
    - "configure with -DCVFORWIN_BUILD_HARDWARE_TESTS=ON"
    - "run the built executable with --list and record the identity"
    - "set CVF_HW_UVC_DEVICE_PATH (or VID/PID/NAME) and run the suite; it must refuse to run without a selector"
    - "for the manual case set CVF_HW_UNPLUG_TEST=1 and follow the two on-screen prompts (unplug, then replug into the same USB port)"
    - "record raw command, exit code, and output on the station; add the verify report via the test owner"

