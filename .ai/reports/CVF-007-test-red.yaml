      The target (suggested name cvf_hw_uvc_smoke) builds tests/hardware/uvc_smoke.cpp as
      an executable and links the UVC backend library plus opencv_core; include dirs src/
      and include/ cover the frozen headers.
  - id: W3
    required: >-
      Do not add this target to ctest or to the mandatory wsl_*/windows_full_quality
