summary: >-
  Finished and verified the interrupted CVF-104 work. The tree was non-compiling:
  src/runtime/context.cpp referenced an undefined deadline_failure() helper and a
  stale serialization_failure symbol, passing an extra argument that
  finalize_post_frame() does not accept at three call sites, and failure_outcome()
  dereferenced the value-type core::Failure as a pointer. I fixed the three
  post-frame call sites to build local core::Failure values and call
  finalize_post_frame(&failure, ...), restored failure_outcome() to read
  failure.message, and preserved the original bounded error_message for a
  required-save failure/timeout that has no primary technical failure. I also
  removed a clang-tidy-flagged redundant member initializer in
  retention_scheduler.h and corrected a false-positive assertion in my own
  developer test (filenames may legally embed dots; the real invariant is a
  single direct-child filename component, matching the established CVF-005
  sanitization test). Every post-frame outcome now routes through
  finalize_after_frame exactly once under one absolute Deadline; the save worker
  performs encode/write/commit off the caller thread through the injected or
  production CaptureStoreSink; and retention is a coalesced background run.
  Portable debug and ASAN suites are 342/342, the four independent CVF-104
  targets pass, format-check and clang static-analysis are clean, and the five
  independent test files hash to their pinned values.

root_cause_of_interrupted_tree:
  kind: mid-edit incomplete refactor
  detail: >-
    The session that introduced the single-finalization refactor left three
    call sites that still passed a fabricated second failure pointer
    (&serialization_failure) and an inline &deadline_failure(...) temporary that
    were never declared, while finalize_post_frame() takes exactly one
    const core::Failure*. failure_outcome() had already been migrated to a
    const core::Failure& reference parameter but one line still used the old
    pointer form. No behavior was stubbed; the declarations were simply missing
    and the signatures mismatched.

deliverables:
  - requirement: "One absolute Deadline created once and passed unchanged to every inspect stage"
    status: done
    note: >-
      inspect() computes a single core::Deadline::from_timeout_ms at the top and
      passes it unchanged to the serialization gate wait, capture_with_one_retry,
      settle capture, algorithm dispatch, and save wait. The only other
      from_timeout_ms in src/runtime is in Context::create() for camera
      enumeration/open (lifecycle, outside inspect); src/camera/uvc_windows and
      src/inspection contain no per-stage deadline construction.
  - requirement: "Every post-frame outcome routes through finalize_after_frame exactly once"
    status: done
    note: >-
      All seven post-frame exits (settle deadline expiry, settle capture failure,
      algorithm lookup failure, dispatch failure, payload-too-large, serialization
      exception, success) call finalize_post_frame(), which invokes
      finalize_after_frame() once and builds the public InspectionOutcome from its
      decision. Pre-frame failures (closed context, bad input_json, queue timeout,
      missing snapshot, recipe not found, first capture failure) use
      failure_outcome() with frame_valid false, so no artifact attempt is made.
  - requirement: "fail_or_error persists the latest valid frame after a technical error; no attempt when capture failed"
    status: done
    note: >-
      finalize_post_frame() sets execution_ok=false and the primary
      status/error but keeps the latest valid frame; decide_capture_save() with
      fail_or_error then saves it when execution failed. The first-capture-failure
      path returns before any save and never constructs a SaveJob.
  - requirement: "Save runs on SaveWorker off the caller thread via the injected/production ArtifactSink"
    status: done
    note: >-
      RuntimeOptions.artifact_sink (default null) selects an injected sink;
      otherwise CaptureStoreSink wraps the managed CaptureStore. SaveJob owns a
      cloned cv::Mat. write_temp encodes PNG into a same-root .cvftmp_*.part and
      commit publishes by same-root std::filesystem::rename; discard removes the
      temporary. The caller only blocks in wait_until(deadline).
  - requirement: "Required waits to the absolute deadline; optional uses remaining time, warns, no image_path, verdict unchanged"
    status: done
    note: >-
      wait_until(deadline) uses deadline.remaining(); a required save that cannot
      be queued is awaited only to the deadline and becomes TIMEOUT; an optional
      non-commit only sets warning_image_save_failed via finalize_after_frame and
      leaves the PASS/FAIL verdict and status OK intact. cancel_pending() drops
      this inspection's queued job; the executing job is not interruptible in the
      frozen seam, so no queued temporary is ever published and no path is
      reported before a completed atomic commit.
  - requirement: "Retention via RetentionScheduler and a separate maintenance worker; inspect never scans/sorts/deletes"
    status: done
    note: >-
      schedule_retention() only updates the retention root, records the committed
      capture/asks due(), and notifies the condition variable. The maintenance
      thread performs CaptureStore::enforce_retention() (non-recursive, skips
      temporary names, age-then-size). No directory iteration, sort, stat, or
      remove appears on the inspect path.
  - requirement: "Shutdown drains/cancels the save worker and stops the maintenance worker without deadlock"
    status: done
    note: >-
      ~Impl sets closed_, signals and joins the maintenance worker, then calls
      save_worker_.drain() (cancels the queued job, completes/cancels in-flight
      work, joins), then closes the camera. The independent shutdown test drives
      an in-flight blocked save and confirms no deadlock and no orphan temporary.
  - requirement: "Preserve observable status/verdict/error/warning semantics and error precedence; public C ABI unchanged"
    status: done
    note: >-
      Finalization precedence is exactly contract rules 0-4; required failure
      precedes an earlier technical error unless the absolute deadline expired.
      The original bounded required-save diagnostic message is restored for the
      no-primary-failure case. No include/cvforwin/** or src/c_api/** file changed.

