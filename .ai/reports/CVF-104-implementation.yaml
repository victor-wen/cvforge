contract_conformance:
  wiring_requirements:
    - "inspect() creates one absolute Deadline once; every stage receives it unchanged; no stage calls Deadline::from_timeout_ms."
    - "Every post-frame outcome reaches finalize_after_frame exactly once; the public result is built from its decision."
    - "The latest valid frame is retained until finalization; fail_or_error persistence happens only with frame_valid, never after the first capture fails."
    - "Required save waits to the absolute deadline; optional save uses remaining time and on non-commit leaves the verdict intact, sets warning_image_save_failed, publishes no image_path, and leaves no queued temporary."
    - "Retention is requested through RetentionScheduler and executed on the maintenance worker; inspect never scans, sorts, or deletes."
    - "Shutdown joins the maintenance worker and drains/cancels the save worker without deadlock."
  invariants:
    - "No PNG encode, disk-write wait, directory iteration, stat/sort, or retention deletion on the inspection caller thread."
    - "No image_path before an atomic commit; no queued artifact cancelled by cancel_pending is published."
    - "Optional artifact work never converts a valid PASS/FAIL into TIMEOUT."
    - "Diagnostics callback serialization and internal-lock policy untouched (no diagnostics change)."
  interface_freeze: >-
    finalization.h, save_worker.h, and retention_scheduler.h match the frozen
    declarations in .ai/changes/CVF-104.yaml (clang-format whitespace only in
    finalization.h). RuntimeOptions.artifact_sink is internal and default-null.
    No include/cvforwin/** or src/c_api/** file was modified; the C ABI is
    unchanged.

