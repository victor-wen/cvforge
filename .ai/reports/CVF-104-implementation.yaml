release_fix_toctou:
  recorded_at: 2026-09-19
  author: developer
  finding: ".ai/reports/batch-2-runtime-artifacts-release.yaml segment A finding 1 (non_blocking): cancellation/commit TOCTOU in save_worker.cpp:154-167"
  status: FIXED
  root_cause: >-
    execute() released mutex_ after its is_cancelled(id) check and then called
    sink_.commit() with no lock held, so the cancellation marker that wait_until's
    timeout path (cancel_target) writes under mutex_ could land in that window. The
    commit then published a final file after the job had been marked cancelled,
    violating project-contract artifact_finalization_v1's "no cancelled artifact is
    published". No deadline was visible to execute(), so a save that only started
    after the caller's deadline could still publish.
  fix: >-
    Added a second mutex publish_mutex_, separate from the submit/queue mutex_, that
    makes the cancellation/deadline decision and sink_.commit() one critical section:
    execute() decodes/writes the temporary outside the gate, then under the gate
    re-checks cancellation AND the awaited deadline and either discards or commits.
    cancel_target() now takes the same gate, so ordering is deterministic: cancellation
    either wins (execute discards; no final file) or execute's decision already
    completed and cancel_target refuses to mark it (the job is committed/terminal).
    wait_until() publishes its deadline under the gate before waiting (so execute can
    discard a save that starts after it), and on a timeout re-checks the target after
    cancel_target(): if a completed outcome won the race (recorded in completed_ or
    still in the decided_outcome_ hand-off), it is returned instead of a synthetic
    cancelled outcome, so the caller is never told "cancelled" for a job that
    published. worker_loop() moves decided_outcome_ into completed_ under mutex_ so a
    timed-out waiting caller holding mutex_ can always recover it. Lock order is
    mutex_ (when held) before publish_mutex_; execute() takes only publish_mutex_,
    so blocking sink I/O never stalls try_submit/executing/queued and no cycle exists.
  preserved:
    - "One executing + one queued bound unchanged (try_submit saturation untouched)."
    - "No final file after a winning cancellation; every temporary is discarded or committed."
    - "Deadlock-free drain; public API/ABI of SaveWorker unchanged."
    - "Frozen signatures try_submit/wait_until/cancel_pending/drain/executing/queued unchanged."
