post_review_fix:
  recorded_at: 2026-09-19
  author: developer
  finding: ".ai/reviews/CVF-104.yaml B-1 (blocking, high)"
  status: FIXED
  root_cause: >-
    SaveWorker::wait_until returned SaveState::cancelled when its deadline expired but
    recorded no cancellation for the target job, and SaveWorker::execute called
    sink_.commit() unconditionally. A job still executing when the caller gave up
    therefore published a late final file (atomic rename) after the runtime had already
    reported the save as failed/timed out, and its temporary was never removed.
  fix: >-
    Added a private cancel-request set (std::set<std::uint64_t> cancelled_ids_) to
    SaveWorker. On a wait_until deadline expiry the target id is marked under mutex_:
    an executing target is inserted into cancelled_ids_ (and then observed by execute()'s
    pre-commit check, which calls sink_.discard(temp) and returns SaveState::cancelled),
    and a queued target is dropped (never executed, so it cannot publish). execute() now
    takes the job id and rechecks cancellation after write_temp and before commit, so a
    cancellation arriving while write_temp is blocked is observed. worker_loop clears the
    per-id flag after each terminal outcome. take() also prunes completed_ entries older
    than the consumed monotonic target, reclaiming outcomes of jobs whose wait already
    timed out (non-blocking NB-1). cancel_pending()/drain() keep their frozen semantics:
    cancel_pending still drops only the queued job and drain still completes the executing
    job, which is required by the pinned independent worker tests
    (cvf104_save_worker_test.cpp:160-182).
  frozen_public_api_unchanged:
    - "try_submit / wait_until / cancel_pending / drain / executing / queued signatures unchanged."
    - "ArtifactSink, SaveJob, SaveState, SaveOutcome unchanged."
    - "One-executing/one-queued bound and deadlock-free drain preserved."
  changed_files:
    - path: src/artifacts/save_worker.h
      sha256: 364ce676e95c990c74443c06da4b97bdeff4ae27bea966ae3dea8032814865dc
      role: "cancelled_ids_ set, cancel_target/is_cancelled declarations, execute(job,id)."
    - path: src/artifacts/save_worker.cpp
      sha256: b05ac268f024aaf8fc253201a9c3bdde2de1ddb867761912a4c25900d062d867
      role: "Pre-commit cancellation check + discard, wait-timeout propagation, NB-1 prune."
    - path: tests/unit/test_artifact_save_worker.cpp
      sha256: a03525efa6bb73595a1c3dab7ad4a0ba23ee78e6e348d70aefa555ea1bfaf769
      role: "Developer regression test + BlockingWriteSink double."
  regression_test:
