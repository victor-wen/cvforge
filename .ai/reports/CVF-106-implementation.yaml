portability_fix_2026_09_19:
  change_id: CVF-106
  phase: IMPLEMENTATION
  author: developer
  recorded_at: 2026-09-19
  trigger: >-
    Windows CI run 35409749859 (commit b102946) failed to compile in BOTH
    windows-msvc jobs at src/recipes/recipe_catalog.cpp(72,47) with MSVC C2665:
    'std::basic_string<wchar_t,...>::starts_with': no overloaded function could
    convert all the argument types. WSL GCC compiled the same line because
    path::native() is std::string there.
  root_cause: >-
    load_asset_bytes() detected an assets-root escape with
    `relative.native().starts_with("..")`. On Windows path::native() is
    std::wstring, so the member starts_with() expects wchar_t arguments and a
    narrow ".." literal cannot convert. This is a real portability defect, not a
    WSL-only artifact: the check silently relied on narrow-native path strings.
  fix:
    file: src/recipes/recipe_catalog.cpp
    symbol: load_asset_bytes
    description: >-
      Replaced the native-string prefix test with a first-path-component
      comparison: `const std::filesystem::path parent_component{".."}; if
      (relative.empty() || *relative.begin() == parent_component)`. This is
      correct for narrow- and wide-native platforms, uses only ASCII ".." (so it
      can never throw on non-representable characters), and preserves the
      rejection message and every other bound/behavior. It still rejects a
      leading ".." component (including nested a/../.. lexically-normalized
      paths) and still accepts legitimate relative and nested references.
    intended_component_semantics: >-
      Component equality (not a ".." string prefix) is the intended semantics.
      A component that merely begins with dots but is not ".." (for example a
      directory named "..data") does not escape the root and is now accepted;
      the old prefix test rejected it. This is the correct reading of the
      contract intent "reject any reference that escapes the assets root ...
      and still accept legitimate nested references" and is exercised by a
      dedicated developer case.
  hazard_sweep:
    commands:
      - "rg -n '\\.native\\s*\\(' src"
      - "rg -n 'starts_with|ends_with' src"
      - "rg -n 'wstring|wchar_t|wstring_view' src"
    result: >-
      Exactly one .native() call existed in src/ (the fixed line); zero
      starts_with/ends_with remain in src. The only other wide-character
      production code is the Windows-only src/camera/uvc_windows/uvc_backend.cpp
      wide_to_utf8() helper, which is outside CVF-106 and converts explicitly;
      it is not a hazard. No equivalent wide-vs-narrow path-string comparison
      remains. (path comparisons against narrow literals/string_views elsewhere
      are portable because std::filesystem::path accepts char string types on
      every platform; only the removed starts_with() member call was the
      defect.)
  developer_test:
    path: tests/unit/test_recipe_asset_reference_developer.cpp
    target: recipe_asset_reference_developer_tests
    cmake_registration: >-
      Registered under the existing if(CVFORWIN_BUILD_TESTS) block as
      recipe_asset_reference_developer_tests; it needs no test backend, so it is
      also compiled by the test-backends-OFF Windows release configuration.
    cases:
      - "a plain relative asset reference remains accepted (catalog loads and prepares)"
      - "a legitimate nested asset reference remains accepted"
      - "a parent-directory asset reference is rejected"
      - "a nested parent-directory escape (a/../../x) is rejected"
      - "an absolute asset reference is rejected"
      - "a dot-prefixed component that is not parent (..data) is not an escape"
      - "POSIX: a reference canonicalizing outside the assets root through a symlinked directory is rejected by the catalog containment check"
    counts: "48 assertions in 7 test cases (exit 0)"
    red_evidence: >-
      Temporarily restoring the old `relative.native().starts_with("..")` line
      and rebuilding the target produced 1 failed case (dot-prefixed component
      not parent, REQUIRE(loaded.has_value()) false) with 46/47 assertions;
      restoring the component comparison returned 48/48 in 7 cases, exit 0.
      The POSIX symlink case is the only case that reaches the catalog
      canonical-path containment directly; the "..", nested-escape and absolute
      cases are also rejected earlier by the recipe reference validator, which
      is the intended layered behavior.
  verification_2026_09_19:
