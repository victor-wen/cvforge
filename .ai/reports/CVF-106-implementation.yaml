blocker:
  id: CVF106-B1
  severity: gate
  files:
    - tests/unit/cvf003_registry_test.cpp
    - .ai/test-ownership.yaml
  failing_tests:
    - "119 - CVF-003 B2 negative: a second registration fails with algorithm_duplicate_key and keeps the original (tests/unit/cvf003_registry_test.cpp:182)"
    - "120 - CVF-003 B2: register_compiled_algorithms publishes example.threshold on a fresh registry (tests/unit/cvf003_registry_test.cpp:161)"
  root_cause: >-
    The approved additive CVF-106 seam registers TemplateMatchAlgorithm in
    register_compiled_algorithms() (src/algorithms/compiled_algorithms.cpp), so a
    fresh registry has size 2. The two hash-pinned CVF-003 cases still assert
    size() == 1u. The independent cvf106 tests require template.match to be
    registered by that same function, so the production behaviour is correct and
    the pinned expectation is stale. src/algorithms/compiled_algorithms.cpp was
    already modified (registering template.match) at the start of this session
    (git status showed it as modified before any edit here), so this session did
    not introduce the count change.
  why_developer_cannot_fix: >-
    tests/unit/cvf003_registry_test.cpp is test-engineer-owned and pinned in
    .ai/test-ownership.yaml (current sha256 d43c2ec1b75848e3bcfb8d2b7dc09cd67234f3a8072975bfc385fee8c2186937
    matches the pinned value). Editing it, or updating the ownership hash, is
    outside the developer scope and would be an independence violation.
  requested_action: >-
    A bounded test-owner amendment (like CVF-004 Amendment 4): update the two
    CVF-003 count expectations to the new compiled-algorithm count (2) while
    keeping the existing example.threshold assertions, and record the new hash in
    .ai/test-ownership.yaml with amendment evidence. Alternatively assert
    example.threshold is found and template.match is found without a brittle exact
    count.
  impact: >-
    Blocks the "full ctest fully green" completion criterion only. All 24
    independent CVF-106 cases and the developer suite pass in debug and ASan;
    format-check, static-analysis and abi-check pass; the two failures are
    orthogonal to the deliverables completed in this session.

