context_override_change:
  file: src/runtime/context.cpp
  symbol: select_descriptor
  what_changed: >-
    Context::create() now computes `const bool overridden = options.camera_override != nullptr;`
    before backend selection and passes it to the new select_descriptor() helper.
    When overridden is false the helper calls camera::resolve_identity(candidates,
    selector) exactly as the previous inline code did. When overridden is true it
    requires exactly one enumerated descriptor and returns candidates.front()
    as-is, without applying the config-derived CameraSelector.
  why_needed: >-
    A test injects a deterministic backend (FileCameraBackend/SyntheticCameraBackend)
    whose descriptor identifiers come from the injected config, while the selector
    was built from cvforwin.json camera fields (e.g. vendor_id/product_id/friendly_name)
    that describe the *real* device. resolve_identity() treats non-empty selector
    fields as exact matches, so the injected backend's single descriptor did not
    match and Context::create() failed with camera_not_found even though the
    override was already the chosen device. The override is the testing hook that
    already bypasses build_backend(); making its enumerated descriptor authoritative
    is the additive, test-only fix. It is covered by the developer regression
    "an injected camera override is authoritative for descriptor selection", whose
    config selector (vendor FFFF / product EEEE / friendly "configured-not-injected")
    deliberately cannot match the injected file backend.
  no_override_behavior: >-
    Confirmed unchanged: when options.camera_override is null, overridden is false
    and select_descriptor() returns camera::resolve_identity(candidates, selector),
    byte-for-byte the same call and arguments the code made before. The only new
    branch is gated on an injected override, which does not exist in production
    configurations. No public ABI, error code, or status value changed.

