      command: "cmake --preset wsl-gcc-debug"
      exit_code: 0
    debug_build:
      command: "cmake --build --preset wsl-gcc-debug --parallel"
      exit_code: 0
      result: "27/27 targets linked, including recipe_asset_reference_developer_tests"
    debug_ctest:
