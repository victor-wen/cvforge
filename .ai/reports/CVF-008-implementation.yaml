defects_found_and_fixed:
  - id: D1
    description: >-
      examples/c_host/main.c failed the canonical build with -Werror=comment because a block
      comment contained the 'recipes/*.json' path; reworded to 'the recipes directory'.
    evidence: "02-build.log (final build exit 0)."
  - id: D2
    description: >-
      cmake/CvfPackage.cmake.in used file(COPY <dir> DESTINATION <root>), which copies directory
      contents and flattened config/examples, docs, and LICENSES into the package root; the
      staged layout required by the package-consumer kit was produced incorrectly. Fixed with
      explicit per-tree destinations.
    evidence: "harness 09 (staged layout check) after the fix."
  - id: D3
    description: >-
      The packaged-vs-built hash check in CvfPackageVerify.cmake.in ran inside a CMake function,
      so a failure was appended to a function-local list and lost, letting the script report
      'all checks passed' despite a mismatch. Converted to a macro operating on the file-scope
      failure list.
    evidence: "harness 09 tampered-DLL probe (rejected with exit 1 only after the fix)."

