summary: >-
  Implemented the CVF-008 delivery surface inside the approved baseline: a strict C11 native C
  host example that consumes only cvf_api.h and runs end-to-end on WSL against the test-enabled
  build; schema-valid example configuration and recipes for a "uvc" deployment and for local
  synthetic runs; the packaging fixes F3 (script-mode configuration resolution, no literal
  generator expression in a -P body), F4 (real package-verify: contents, exactly one project
  DLL, notices, packaged-vs-built hash equality, exact five exports from cvforwin.def, runtime
  dependency allowlist, upload archive), and QE-1 (shell-metacharacter-free portable refusal
  that exits non-zero without the /bin/sh syntax error); the F1 Windows test preset
  (windows-msvc-tests with CVFORWIN_BUILD_TEST_BACKENDS=ON, release kept OFF); auditable
  LICENSES notices and a component mapping; usage/build/packaging documentation; and the
  windows-2022 workflow with immutable action references, least permissions, and no secrets.
  Portable WSL evidence: configure exit 0, build exit 0, ctest 263/263 with no delta,
  format-check 83/83 files, clang static-analysis 21 files clean, ASan 263/263, example run exit
  0 with PASS/JSON/image path, refusals exit 1 cleanly under Ninja and non-zero under Unix
  Makefiles, and a 17/17 local harness of the package script logic. Windows MSVC
  build/test/abi-check/package/package-verify, the real dumpbin export and dependency checks,
  the symbols archive, and the clean package-consumer run remain deferred to windows-2022 CI;
  no Windows result is claimed.

