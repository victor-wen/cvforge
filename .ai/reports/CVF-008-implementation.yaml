  modified:
    - path: CMakeLists.txt
      role: "Added add_subdirectory(examples/c_host) so the C11 example builds on every platform."
    - path: CMakePresets.json
      role: >-
        F1: new windows-msvc-tests configure/build/test presets with
        CVFORWIN_BUILD_TEST_BACKENDS=ON; windows-msvc-release now pins the option OFF; new
        windows-msvc-release-symbols, windows-msvc-tests-* build presets; windows-ci extended
        with the symbols step; new windows-tests-quality workflow preset.
    - path: cmake/CvfOptions.cmake
      role: >-
        Pinned CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=ProgramDatabase for MSVC so the Release PDB
        exists for the separate symbols archive (PDB never enters the package ZIP).
    - path: cmake/CvfFormat.cmake
      role: "format-check now also covers examples/c_host/*.c (83 files instead of 82)."
    - path: cmake/CvfPackage.cmake
      role: >-
        QE-1: refusal targets use a helper with a metacharacter-free message and cmake -E false.
        F3: package and package-verify receive CVF_CONFIG=$<CONFIG> plus genex-resolved
        CVF_DLL/CVF_IMPORT_LIB; dumpbin is resolved next to the linker or on PATH. Added the
        package-symbols target and the verify wiring.
    - path: cmake/CvfPackage.cmake.in
      role: >-
        F3: resolves outputs through the passed CVF_CONFIG with the explicit path preferred;
        no generator expression appears in the script body. Strict required-input checks;
        layout-preserving copies of config/examples, docs, and LICENSES (fixed a real bug where
        file(COPY) had flattened them); creates the upload ZIP.
    - path: cmake/CvfPackageVerify.cmake.in
      role: >-
        F4: implemented contents, notices, exactly-one-DLL, SHA256 packaged-vs-built equality,
        exact five exports parsed from src/c_api/cvforwin.def, dumpbin runtime dependency
        allowlist with PATH/vswhere fallback and hard failure when dumpbin is absent, and upload
        archive presence. Failure aggregation uses a macro because a CMake function scope
        silently discarded the hash-check failure (caught by the harness).

packaging_fixes:
  F3:
    description: >-
      Script-mode configuration expansion: CvfPackage.cmake passes the concrete
      CVF_CONFIG=$<CONFIG> and the generator-expression-resolved output paths into the -P body;
      CvfPackage.cmake.in locates bin[/<config>]/cvforwin.dll and lib[/<config>]/cvforwin.lib
      from that configuration and fails with a clear message otherwise. No script body contains
      a literal generator expression (asserted by the harness).
    evidence: "harness 09: package script resolves build outputs through CVF_CONFIG=Release (exit 0, staged layout + ZIP)."
  F4:
    description: >-
      package-verify is implemented: DLL/import library/header/example config/recipes/docs/
      notices presence, exactly one runtime DLL in bin/, packaged-vs-built SHA256 equality,
      exactly the five cvf_* exports from cvforwin.def, system-only runtime dependency
      allowlist, and upload ZIP presence. dumpbin comes from the caller, then PATH, then vswhere;
      absence is a hard failure, never a silent pass.
    evidence: >-
      harness 09: 17/17 probes (good path accepted; extra export, vcruntime140 dependency,
      tampered DLL, missing notices, and missing dumpbin all rejected with non-zero).
    caveat: "Harness dumpbin output is simulated; the real export/dependency checks require windows-2022 MSVC."
  QE-1:
    description: >-
      Portable refusal-path quoting: the refusal message contains no parentheses or other shell
      metacharacters and the target ends with cmake -E false, so the refusal exits non-zero
      through the intended command.
    evidence: >-
      Ninja: package/package-verify exit 1 with 'package[-verify] is Windows-only - run the
      windows-msvc-release preset on windows-2022 CI' and no Syntax error (logs 07, 08).
      Unix Makefiles scratch tree: make exit 2, same message, no /bin/sh syntax error (log 16).

f1_presets:
  windows_msvc_release: "CVFORWIN_BUILD_TEST_BACKENDS=OFF explicitly pinned; release package stays uvc-only."
  windows_msvc_tests: >-
    Visual Studio 17 2022 x64, x64-windows-static, CVFORWIN_BUILD_TESTS=ON,
    CVFORWIN_BUILD_TEST_BACKENDS=ON, warnings as errors ON; runs the camera/ABI/lifecycle
    suites and produces the test-enabled package variant required by the clean consumer kit.
  workflows: >-
    windows-ci (release full quality + symbols) and windows-tests-quality (test-enabled suite +
    test-enabled package + package-verify). Both validated with cmake --list-presets.

