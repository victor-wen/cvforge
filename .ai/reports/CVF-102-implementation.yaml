changed_files:
  note: >-
    Current CVF-102 deliverable set (unchanged by the developer during this re-verification
    session). No file in this list was edited in this session.
  production:
    - path: src/camera/uvc_windows/uvc_command_worker.h
      sha256: 0fd9351d24f899b5e4abbe8a4167805c14cff196747bb02d8ff8a5867c91ada4
      role: >-
        Portable single-thread command marshaller (CommandWorker). Owns the worker thread, runs the
        caller startup hook on it, completes each command synchronously under the caller deadline,
        and runs teardown exactly once after the loop ends (including after a failed startup). No
        Windows/MF/OpenCV dependency.
      changed_this_session: false
    - path: src/camera/uvc_windows/uvc_backend.h
      sha256: 60cd5de53470bf30c0c2b7a662fcabfc567d1e71d2a91acaff7eafcb042c1c80
      role: >-
        Adds the Windows-only internal observability struct UvcWorkerSnapshot and the non-ABI
        accessor UvcCameraBackend::worker_snapshot() const noexcept. No existing ICameraBackend
        signature changed.
      changed_this_session: false
    - path: src/camera/uvc_windows/uvc_backend.cpp
      sha256: 4342bb67a568e79e839a2fd3d9be2d468e92c82aec99969b2d1f92be2fda195a
      role: >-
        Worker-marshalled Media Foundation lifetime: startup_worker() runs
        CoInitializeEx(nullptr, COINIT_MULTITHREADED) then MFStartup(MF_VERSION, MFSTARTUP_LITE) on
        the worker; teardown_worker() releases stream/callback then MFShutdown then CoUninitialize
        on the worker before join. enumerate/open/capture/reconnect submit std::function commands
        to worker_ and finalize() maps completed/timeout/unavailable to the frozen result contract.
        worker_snapshot() reports the counters.
      changed_this_session: false
  developer_tests:
