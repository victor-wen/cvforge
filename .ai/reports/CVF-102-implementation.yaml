contract_conformance:
  behavior:
    - "Worker lifecycle: start -> CoInitializeEx(MTA) -> MFStartup(MF_VERSION, MFSTARTUP_LITE) -> command loop -> MFShutdown -> CoUninitialize -> join (verified in uvc_backend.cpp startup_worker/teardown_worker and CommandWorker::worker_main)."
    - "Commands marshalled to the worker and completed synchronously; each wait bounded by the caller deadline (CommandWorker::submit wait_for deadline.remaining())."
    - "All backend-held MF objects and buffer access occur on the worker (stream/reader/callback referenced by the worker; owned BGR8 frames cross back by value via shared_ptr<Result<T>>)."
    - "Host COM state is not consulted; enumerate/open/capture/reconnect/close only touch CommandWorker."
    - "One balanced startup/shutdown per backend lifetime; failed startup returns camera_io and the worker is joined in start() (no leak)."
    - "close() is idempotent, drains the worker and joins (CommandWorker::stop_and_join is idempotent and safe on a never-started worker)."
  invariants:
    - "No host CoInitializeEx requirement is introduced."
    - "No Media Foundation interface pointer escapes the worker; public ABI and ICameraBackend signatures are unchanged."
    - "Teardown order is teardown_stream()/callback_.reset() before MFShutdown before CoUninitialize."
    - "Portable builds are unaffected (Windows sources compile only under if(WIN32); CommandWorker is portable and tested)."
  interface_freeze: >-
    UvcCameraBackend::worker_snapshot() and UvcWorkerSnapshot match the frozen seam declaration in
    .ai/changes/CVF-102.yaml interface_v1.frozen_test_seam. No include/cvforwin or src/c_api change.

