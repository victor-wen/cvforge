summary: >-
  Re-ran the canonical CVF-102 evidence on the implementation already on disk (no redesign, no
  production or developer-test change was needed). The UVC backend now owns one DLL worker thread
  that initializes COM as MTA and balances one MFStartup/MFShutdown lifetime; every backend
  operation (enumerate/open/capture/reconnect/close) is marshalled onto that worker and completed
  synchronously, bounded by the caller's absolute deadline. All portable gates are green with real
  exit code 0: configure, build, ctest 284/284, format-check 90 files, static-analysis 22 files,
  ASAN build + ctest 284/284, and the developer unit binaries (149 assertions in 8 cases plus 1
  assertion in 1 Windows-gated case). The frozen independent test
  tests/windows/uvc/cvf102_uvc_worker_lifecycle_test.cpp was observed at sha256
  ce2cc80ee41e7cf5579dd4cf6c7a46f29eaa066179912ab46beb54e195562109, exactly the pinned value, both
  before and after the run. Windows MSVC compilation/execution of cvf102_windows_uvc_tests is NOT
  verifiable on this Linux host and is explicitly deferred to the windows-tests-quality CI; the
  Linux portable run is not Windows evidence and is not claimed as such.

