        in-order execution, teardown once on failed startup, restart after stop, idempotent
        stop_and_join, expired-deadline no-op, timeout-that-still-completes, concurrent submissions.
      changed_this_session: false
    - path: tests/unit/uvc_worker_snapshot_test.cpp
