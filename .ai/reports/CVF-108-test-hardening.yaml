new_detection_controls:
  file: tests/unit/cvf108_release_metadata_test.cpp
  test_case: "CVF-108 boundary: historical context is scoped to the same logical unit"
  observed: >-
    ctest test #471 "CVF-108 boundary: historical context is scoped to the same
    logical unit" Passed; direct binary reports all 121 assertions passed
    (exit 0); 0 skipped.
  control_a_reported:
    requirement: >-
      A stale current-release mention adjacent to, but in a different logical
      unit from, a genuine historical mention must be REPORTED.
    input: >-
      "# Release history\n\n## 1.0.0 - 2025-01-01\n
      - prior release; archived build/cvforwin-1.0.0.zip\n
      Download cvforwin-1.0.0.zip as the current release.\n"
    expectation: 'scan_current_version_mismatches == {"1.0.0"}'
    observed: 'PASS: the prior-release list item under its 1.0.0 heading is exempt; the next line, a different logical unit that presents 1.0.0 as current, is reported.'
  control_b_not_reported:
    requirement: >-
      A genuine historical mention must NOT be reported.
    input: >-
      (i) "# Release history\n\n## 1.0.0 - 2025-01-01\n
      - prior release; archived build/cvforwin-1.0.0.zip\n";
      (ii) "Download cvforwin-1.0.0.zip from the previous release archive.\n"
    expectation: "scan_current_version_mismatches is empty for both inputs"
    observed: "PASS: both inputs report no mismatch."
  extra_controls:
    - name: same-line-different-sentence
      input: '"The 1.0.0 build was historical. Download cvforwin-1.0.0.zip as the current release.\n"'
      expectation: '== {"1.0.0"}'
      observed: "PASS: the historical marker is in the first sentence; the second sentence is reported."
    - name: table-row-unit
      input: >-
        "# Changelog\n\n| Version | Status | Artifact |\n| --- | --- | --- |\n
        | 1.0.0 | prior release | cvforwin-1.0.0.zip |\n
        | 1.0.0 | current download | cvforwin-1.0.0.zip |\n"
      expectation: '== {"1.0.0"}'
      observed: "PASS: the prior-release row is exempt; the current row is reported."

