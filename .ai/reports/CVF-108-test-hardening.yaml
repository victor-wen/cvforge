change_id: CVF-108
phase: REVIEW-FIX HARDENING
title: "Harden the historical-context heuristic in the CVF-108 release-metadata test"
author: test-engineer
recorded_at: 2026-09-19
finding: CVF108-NBF-05
brief: .ai/test-briefs/CVF-108.yaml
contract: .ai/project-contract.yaml (contract_version 1.1.0, APPROVED)
host: "WSL native Linux, GCC 13.3.0, Ninja, portable wsl-gcc-debug preset"
scope: >-
  Test-owner work only. Edited tests/unit/cvf108_release_metadata_test.cpp and
  the CVF-108 entry in .ai/test-ownership.yaml. No production file
  (src/**, include/**, .github/**, CMakeLists.txt, docs/**, vcpkg.json,
  .ai/project-contract.yaml) and no other test file was touched.

problem: >-
  is_historical_context(lines, line) exempted any earlier-version reference that
  sat within a fixed +/-3-line window of a historical marker or version heading.
  A stale current-release mention that merely sat next to a genuine historical
  mention was therefore wrongly exempted even though it presented the old
  version as the current product version. The exact-token version matching and
  the missing-file handling were sound and were not changed.

resolution: >-
  The exemption now depends on the version reference's own logical unit rather
  than a fixed line distance. find_cvforwin_versions() records the match
  position; is_historical_context(text, position) resolves the containing unit
  and requires the historical marker to be in that same unit:
    * a table row is its own unit (the whole row);
    * a heading is its own unit;
    * a list item is its own unit plus its indented continuation lines;
    * any other line is scoped to the containing sentence (split on sentence
      terminators, with decimal/version dots excluded);
    * a list item or sentence that is the direct body of a version heading owns
      that heading as its changelog-entry unit (only blank lines may intervene),
      which keeps genuine changelog entries exempt.
  A marker-word match or a version heading must occur inside that unit; a marker
  one or two lines away in a different unit no longer exempts the reference.
  No existing assertion was removed, disabled, skipped, or weakened.

