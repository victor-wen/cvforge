decisions_and_deviations:
  - id: D1
    item: "RuntimeOptions.camera_override type"
    decision: "std::shared_ptr<camera::ICameraBackend> (frozen in the change contract)"
    reason: "The independent harness keeps its own reference and asserts counters after the calls, so the runtime must share ownership."
  - id: D2
    item: "InspectionRequest.timeout_ms type"
    decision: "TimeoutMs wrapper assignable from std::uint32_t and std::chrono::milliseconds; value() returns the millisecond count"
    reason: >-
      tests/unit/cvf006_test_support.h assigns both spellings in two branches
      of an if constexpr in a non-template function, where both branches are
      hard-checked; no single standard type satisfies both assignments.
      Observable semantics stay the frozen millisecond count (0 -> 5000 ms).
  - id: D3
    item: "InspectionOutcome.output_json type"
    decision: "nlohmann::json, dumped to text once at the C API boundary"
    reason: >-
      The same test header calls .dump() and .is_object() on the field in
      non-template if constexpr branches; the frozen 'JSON object' semantics are
      preserved and the public buffer still receives UTF-8 text with the v1 byte
      rules. Failure outcomes carry a null JSON object.
  - id: D4
    item: "Error code 1900-1904 names"
    decision: "runtime_queue_timeout/runtime_result_too_large/runtime_required_artifact_failed/runtime_reload_failed/runtime_context_closed with the mappings listed above"
    reason: "The change file fixed the numbers and mappings but not the spellings; names follow the existing subsystem numbering convention."
  - id: D5
    item: "Result capacity pre-check"
    decision: "The C API performs the capacity check itself (src/core/abi_validation.* untouched) and publishes bytes_required = 65536/4096/1024"
    reason: "The frozen CVF-006 buffer rule maps undersized result buffers to BUFFER_TOO_SMALL, which the CVF-001 validator did not express."
  - id: D6
    item: "cvf006_tests warning policy"
    decision: "The independent C++ target adds -Wno-narrowing (GCC/Clang) after the standard test policy"
    reason: >-
      tests/unit/cvf006_test_support.h passes int frame dimensions into the
      uint32_t SyntheticCameraConfig fields; the read-only test file is warning
      clean under its documented syntax check but not under -Werror. No other
      test target is affected.
  - id: D7
    item: "uvc backend"
    decision: "config_error/subsystem_unavailable outside test builds"
    reason: "src/camera/uvc_windows/** is CVF-007 scope and is not compiled in baseline 1.0.0."

