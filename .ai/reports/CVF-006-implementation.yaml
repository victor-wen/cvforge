implementation:
  runtime_orchestrator:
    - >-
      Context::create initializes in dependency order (global config ->
      compiled registry -> recipe catalog -> diagnostics -> managed capture
      store -> camera backend -> enumerate/resolve/open) with RAII rollback:
      each resource is a local smart pointer until the Context is published
      last, so every failure destroys exactly what was created and returns the
      precise Failure.
    - >-
      inspect() runs one cycle under one Deadline: a timed serialization gate
      (std::timed_mutex, try_lock_for(remaining) -> runtime_queue_timeout),
      recipe lookup by recipe_id from the atomic snapshot, capture through
      camera::capture_with_one_retry (at most one reconnect/recapture),
      settle_frames additional captures, registry dispatch, measurements+defects
      merge into one JSON object, save policy (always/fail_or_error/never) with
      optional warning versus required REQUIRED_ARTIFACT_ERROR + NOT_EVALUATED,
      and retention after saves (failure adds the image-save warning). Every
      execution outcome is a valued Result<InspectionOutcome>; a Result failure
      is returned only for a closed context.
    - >-
      reload_recipes() loads and validates a complete candidate catalog against
      the compiled registry and publishes it with one atomic store
      (RecipeHolder); on any rejection the previous snapshot stays active and
      the caller receives config_error/runtime_reload_failed with the candidate
      diagnostic.
    - >-
      warning_flags() = accumulated per-call warnings | Diagnostics::warnings(),
      so the degraded file sink (1u<<0) and optional image/retention failures
      (1u<<1) are observable without changing a valid verdict.
    - >-
      Test-backend addressing: synthetic uses the fixed descriptor
      {backend_key "synthetic", device_path "synthetic0", vendor_id "0000",
      product_id "0000", friendly_name "Synthetic camera"} with base_capture
      width/height; file uses device_path = absolute frames directory with the
      regular files directly under it sorted by filename (empty existing
      directory is a valid camera that fails captures with frames_exhausted;
      a missing directory fails initialization with camera_not_found).
    - >-
      Camera selection honors RuntimeOptions.camera_override first; otherwise
      the config camera.backend drives construction ("uvc" always known,
      "file"/"synthetic" only under CVFORWIN_TEST_BACKENDS_ENABLED). The
      Windows-only uvc backend is not compiled in baseline 1.0.0 and reports
      config_error/subsystem_unavailable outside test builds.
  public_c_api:
    - >-
      All five entry points are wired to the runtime. cvf_initialize validates
      the error struct and options, checks the single-live-context slot under
      the lifecycle mutex, maps flags to enable_file_logging/enable_callback_logging
      and the callback binding, creates the runtime, and publishes the opaque
      context only after complete success.
    - >-
      cvf_inspect validates context -> null pointers -> result struct_size ->
      result reserved -> v1 required capacities -> request struct before any
      side effect. Undersized output_json (<65536), image_path (<4096), or
      error_message (<1024) returns CVF_STATUS_BUFFER_TOO_SMALL with the field's
      bytes_required set to the required capacity; malformed structures are
      never modified. Result text is written with the v1 byte rules
      (bytes_written excludes NUL, bytes_required includes it), and a serialized
      result that exceeds the caller capacity reports the real required size.
    - >-
      cvf_reload_recipes and cvf_shutdown follow the frozen validation order;
      shutdown atomically removes and deletes the context (orderly camera /
      diagnostics / artifacts teardown) under the lifecycle mutex; a second
      shutdown on NULL returns INVALID_CONTEXT. Every exported function contains
      a catch-all, so no exception crosses the ABI.
  recipes_backend_extension:
    - >-
      validate_camera accepts "uvc" always and "file"/"synthetic" only when
      CVFORWIN_TEST_BACKENDS_ENABLED is defined nonzero; the message is
      build-mode aware. CMake defines it on cvforwin_recipes (PRIVATE when
      CVFORWIN_BUILD_TEST_BACKENDS=ON).
  diagnostics_extension:
    - >-
      DiagnosticsConfig gained the trailing additive field
      bool enable_file_sink = true; when false, open_file_sink() creates no
      directory/sink and records no warning. Existing CVF-005 tests and
      designated initializers remain valid.
  error_codes:
    - "runtime_queue_timeout = 1900 -> Status::timeout"
    - "runtime_result_too_large = 1901 -> Status::buffer_too_small"
    - "runtime_required_artifact_failed = 1902 -> Status::required_artifact_error"
    - "runtime_reload_failed = 1903 -> Status::config_error"
    - "runtime_context_closed = 1904 -> Status::invalid_context"
    - "All five have stable error_code_name() strings and status_for() mappings."
  cmake:
    - >-
      cvforwin_runtime static library (all internal modules + nlohmann) linked
      into the shared cvforwin library; CVFORWIN_TEST_BACKENDS_ENABLED=1 on
      cvforwin_runtime when the option is ON.
    - >-
      cvf006_lifecycle C11 target (cvforwin + Threads::Threads,
      CVF_TEST_FIXTURES_DIR/CVF_TEST_TMP_DIR absolute definitions) and
      cvf006_tests C++ target (runtime, test backends, opencv_imgcodecs,
      Threads, Catch2), plus cvf006_developer_tests for the developer-owned
      regression file. All three are registered only when test backends are ON.
    - "CVFORWIN_TEST_BACKENDS_ENABLED=1 is also defined on cvf004_tests when test backends are ON."

