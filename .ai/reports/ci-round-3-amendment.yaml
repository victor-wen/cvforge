    WORKING_DIRECTORY, missing cmake -E chdir, missing configure-time mkdir), proving the
    harness catches a reverted fix.

deferred_to_ci:
  - topic: MSBuild behavior
    status: deferred
    statement: >-
      No Windows host locally; the fix is reasoned from the generator mechanics (the batch's
      directory change is removed entirely, and cmake -E chdir runs inside the cmake
      process). Next windows-2022 run must show the release job's package-symbols target
      succeeding and "Upload release symbols archive" finding
      build/windows-msvc-release/symbols/cvforwin-1.0.0-symbols.zip. The archive should
      contain cvforwin.pdb at its root.
  - topic: vcpkg binary cache effectiveness
    status: deferred
    statement: >-
      Round 4 is the first run with the new cache key, so it is expected to be a cache miss
      and still compile OpenCV; actions/cache saves the vcpkg_cache directory at job end.
      The following run with unchanged vcpkg.json/vcpkg-configuration.json must restore it
      (CI log: "Cache restored from key: vcpkg-Windows-..."; vcpkg log: cached binary
      packages) and cut the install phase from ~9-10 min to seconds/minutes. Because the two
      jobs run in parallel, cross-job reuse within the same run is only possible if one job
      saves before the other restores; the reliable win is across runs. Cache edits to the
      manifest rotate the key and force one rebuild by design. GitHub Actions cache is
      limited to 10 GB per repository with 7-day unused eviction; the x64-windows-static
      binary cache is large but single-instance, so watch quota in later rounds.
  - topic: CI-3B clean consumer
    status: deferred
    statement: >-
      The test-enabled job's clean consumer failure is owned by the test-engineer
      (tests/package/package_checks.cmake `cmake -E env --modify PATH=prepend:` invalid op).
      This developer amendment deliberately does not touch it; the next run must confirm the
      test-owner fix.

