ci_evidence:
  workflow_run: windows-2022 CI run 34960459232 (round 3, 12m1s)
  diagnostics:
    - id: CI-3A
      file: cmake/CvfPackage.cmake
      target: package-symbols
      reported_by: MSBuild on windows-2022
      observed: >-
        The release job passed configure/build/test/abi-check/package/package-verify and
        failed only at package-symbols with "The system cannot find the path specified.".
      cause: >-
        The target set WORKING_DIRECTORY "${CMAKE_BINARY_DIR}/symbols" while that directory
        was created only by the target's own first command. Build tools change into the
        working directory BEFORE running the command batch, so no command ever ran.
    - id: CI-3B
      file: tests/package/package_checks.cmake
      owner: test-engineer
      observed: >-
        The test-enabled job's clean consumer step used
        `cmake -E env --modify PATH=prepend:...`; 'prepend' is not a valid op, so env exited
        1 before the consumer ran.
      developer_action: none
      note: >-
        tests/package/** is test-owner property and was not touched by this role; recorded
        here only as context for the round-3 failure.

root_cause:
  statement: >-
    A custom target may not use a WORKING_DIRECTORY that its own commands create: Ninja
    emits `cd <dir> && <commands>` and MSBuild changes directory before executing the
    custom build step. The first command (`cmake -E make_directory`) therefore never got
    the chance to create the directory, and the batch failed before any command ran.
  local_repro: >-
    Scratch Ninja project mirroring the original target: build fails with
    "/bin/sh: 1: cd: can't cd to .../scratch" (exit 1), no archive produced. Root cause
    confirmed before any fix (see .ai/validation/ci-round-3-package-symbols-probe.log
    section 1).

changes:
  - file: cmake/CvfPackage.cmake
    defect: CI-3A
    change: >-
      Added `file(MAKE_DIRECTORY "${CMAKE_BINARY_DIR}/symbols")` before
      add_custom_target(package-symbols) and removed WORKING_DIRECTORY. The commands now run
      from the always-existing build root; the tar step runs through
      `cmake -E chdir "${CMAKE_BINARY_DIR}/symbols" "${CMAKE_COMMAND}" -E tar cf
      "cvforwin-${PROJECT_VERSION}-symbols.zip" --format=zip "cvforwin.pdb"`.
    rationale: >-
      cmake -E chdir is executed inside the cmake process, so the directory is created by
      the immediately preceding make_directory command first. Absolute tar input paths were
      rejected because `cmake -E tar` records CWD-relative entries and would have produced
      symbols/cvforwin.pdb instead of the root-level cvforwin.pdb entry.
    preserved:
      - "archive at exactly ${CMAKE_BINARY_DIR}/symbols/cvforwin-${PROJECT_VERSION}-symbols.zip"
      - "zip entry layout: cvforwin.pdb at the archive root"
      - "copy_if_different of $<TARGET_PDB_FILE:cvforwin>"
      - "DEPENDS cvforwin and VERBATIM"
      - "runtime `cmake -E make_directory` kept as the first command, so a symbols/ directory deleted after configure is recreated safely"
      - "the if(NOT WIN32) refusal targets package and package-verify are byte-identical"
    not_changed: "no test, src/**, CMakePresets.json, or other role artifact was touched"
  - file: .github/workflows/windows.yml
    defect: "CI duration (vcpkg rebuilt from source every run, ~9-10 min per job)"
    change: >-
      Job-level env VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache added to
      both jobs. Each job gets, right after checkout and before the quality workflow,
      (1) a pwsh step `New-Item -ItemType Directory -Force -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null`
      and (2) an actions/cache step pinned to
      actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4 with
      path ${{ github.workspace }}/vcpkg_cache,
      key vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }},
      and restore-keys prefix vcpkg-${{ runner.os }}-.
    rationale: >-
      vcpkg requires VCPKG_DEFAULT_BINARY_CACHE to exist before use; both jobs share one key
      so cached ports are reused across jobs and runs. Header comment updated; immutable
      refs (full commit SHA with # v4 comment), least permissions (contents: read) and the
      no-secrets property are unchanged.
  - file: .ai/validation/ci-round-3-package-symbols-probe.sh
    defect: "local detection of the WORKING_DIRECTORY-on-self-created-dir class"
    change: >-
      New executable harness (31 checks). Section 1 builds the original pattern with Ninja
      and requires the cd failure; section 2 builds the fixed pattern and checks configure-time
      directory creation, archive path, single root-level cvforwin.pdb entry, and recovery
      after deleting symbols/; section 3 extracts the REAL package-symbols block from
      cmake/CvfPackage.cmake, substitutes the PDB generator expression, configures/builds it
      with Ninja and checks the archive; section 4 asserts the structural invariants
      (no WORKING_DIRECTORY, cmake -E chdir, configure-time mkdir before the target,
      DEPENDS/VERBATIM, archive name, refusal targets).
    rationale: >-
      Section 3 makes the harness test the production text, not a hand-copied pattern, so a
      future regression in CvfPackage.cmake fails locally without a Windows host.

cache_recipe:
  source: "vcpkg documented GitHub Actions binary-cache recipe"
  key_files:
    - vcpkg.json
    - vcpkg-configuration.json
  snippet: |
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
    steps:
      - run: New-Item -ItemType Directory -Force -Path "${{ env.VCPKG_DEFAULT_BINARY_CACHE }}" | Out-Null
        shell: pwsh
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-
  pin_verification: >-
    refs/tags/v4 resolves to commit 0057852bfaa89a56745cba8c7296529d2fc39830
    ("Merge pull request #1655 from actions/Link-/prepare-4.3.0", 2025-09-24), confirmed via
    git ls-remote and the GitHub API; newest v4.x line commit, matching the full-SHA +
    version-comment style already used in this workflow.

