  rationale: >-
    Requirement-derived cases from the CVF-104 brief boundary_cases/negative_cases
    and the contract's artifact_finalization_v1 precedence rules. No existing
    assertion was removed, weakened, disabled, or skipped.
  tests_unit_cvf104_finalization_test_cpp:
    - "required save that failed at an already-expired deadline is TIMEOUT, never REQUIRED_ARTIFACT_ERROR; NOT_EVALUATED; no publish; no image-save warning; injected warn_base preserved"
    - "committed required save exactly at the expiry boundary succeeds (OK, verdict preserved, image_path published)"
    - "committed optional save at the expiry boundary publishes and keeps the verdict"
    - "no frame_valid makes no save attempt and claims no image warning for optional; the required variant still reports the engine error, not a required-artifact error"
  tests_unit_cvf104_save_worker_test_cpp:
    - "wait_until with an already-expired deadline (Deadline::immediate) returns promptly without completing a blocked save and without publishing a path"
    - "cancel_pending with nothing queued is a safe no-op and does not wedge the worker"
    - "drain called twice is idempotent and leaves no temporary or queued work"
  tests_unit_cvf104_retention_scheduler_test_cpp:
    - "explicit 99th/100th committed-capture trigger boundary (99 -> not fired, count 99; 100 -> fired, count 100)"
    - "due() is false one millisecond before 60s and true exactly at 60s"
  tests_unit_cvf104_end_to_end_test_cpp: []
  tests_unit_cvf104_test_support_h: []

correction_during_verify:
  file: tests/unit/cvf104_retention_scheduler_test.cpp
  description: >-
    A first draft of the 99/100 boundary case asserted
    RetentionScheduler::due() became true on the 100th committed capture. The
    frozen observable (already pinned by the pre-existing
    "whichever trigger comes first fires" case) is that the capture trigger is
    the boolean returned by on_capture_committed while due() is the independent
    time trigger, so due() is false after 100 captures when 60s has not elapsed.
    The single self-invented expectation was corrected to match the contract;
    it was not weakened and no existing assertion changed. No implementation
    defect was involved. This is recorded for transparency, per the
    never-guess-an-expected-value rule.

