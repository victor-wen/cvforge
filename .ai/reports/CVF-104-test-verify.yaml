      severity: informational
      summary: >-
        RetentionScheduler::due() is the time-trigger query only; the
        committed-capture trigger is observed as the boolean return of
        on_capture_committed(). This is consistent with the frozen contract
        ("requested after 60 seconds ... or 100 committed captures") and the
        pre-existing pinning case, but the two trigger channels are distinct and
        must not be conflated by callers. Not a defect.
