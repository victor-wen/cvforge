windows_fix_2026_09_19:
  trigger: >-
    windows-tests-quality CI run 35383859693 (native MSVC, commit 8b96cb8)
    failed exactly three CVF-104 independent CHECKs, all from one root cause.
  failing_checks:
    - file: tests/unit/cvf104_save_worker_test.cpp
      line: 93
      observed: "CHECK(path_within(sink->root(), outcome.path)) -> false"
    - file: tests/unit/cvf104_end_to_end_test.cpp
      line: 87
      observed: "CHECK(path_within(sink->root(), file)) -> false"
    - file: tests/unit/cvf104_end_to_end_test.cpp
      line: 191
      observed: "CHECK(path_within(managed_root, outcome.image_path)) -> false"
  root_cause: >-
    tests/unit/cvf104_test_support.h path_within() compared
    root.lexically_normal().string() with child.lexically_normal().string() as a
    raw prefix and then required child_text[root_text.size()] == '/'. On Windows
    lexically_normal().string() uses '\\', so the boundary test always failed
    there while passing on Linux (307+ portable cases).
  fix:
    file: tests/unit/cvf104_test_support.h
    summary: >-
      path_within() now decomposes root and child into native
      std::filesystem::path components (via lexically_normal()), additionally
      splits every component on both '/' and '\\', and returns true exactly when
      root's component list is a prefix of the child's (equal length means child
      == root). Added #include <algorithm> for std::equal.
    intent_preserved: >-
      A sibling that only extends root's final component name ("<root>_x/...")
      or an escape ("root/../outside") still returns false; root itself and any
      real descendant return true on both separator spellings.
  regression_guard:
    file: tests/unit/cvf104_save_worker_test.cpp
    case: "CVF-104 support: path_within is separator-agnostic and still rejects siblings and escapes"
    coverage: >-
      root itself; native '/' descendants; a backslash-joined child
      (root.string() + "\\frame.png") simulating Windows separators on Linux; a
      Windows drive-style pair "C:\\root\\captures" /
      "C:\\root\\captures\\frame.png"; a "<root>_x" sibling; a
      "C:\\root\\captures_x" sibling; a different subtree; and a ".." escape.
      9 assertions. cvf104_save_worker_test.cpp grew 74 -> 83 assertions and
      9 -> 10 test cases; no assertion was removed, weakened, disabled, or
      skipped.
  changed_files_sha256:
    tests/unit/cvf104_test_support.h: d8bd5191bd3aa3bbd0ce79443422a51b2d617e436bbdd47a70e385f2776224ce
    tests/unit/cvf104_save_worker_test.cpp: 5cc3c1bedd9a69ee95e9325dc56ecfff1c1c109122becd709fccb3b276c21ea4
    .ai/test-ownership.yaml: 05ed76e55b93f9c075d66fdb5baa3313ceaceea67267a8f46a984226a060a51e
