    - id: B2
      name: "CVF-101 B2: a bottom-up buffer (pitch < 0) yields the same visual orientation with no double flip"
      observable: "pitch = -18; same visual content; output row0==A, row2==B (no inversion)"
    - id: B3
      name: "CVF-101 B3: RGB24, RGB32, and YUY2 all preserve top/bottom orientation for both pitch signs"
      observable: "6 format/sign combinations; gray ramp 0/128/255; output row0 black, row2 white for each"
    - id: B4
      name: "CVF-101 B4: a padded row is decoded by pitch and pad bytes never appear in the output"
      observable: "rgb24 width 5 (15 packed bytes), pitch 20 (5 pad bytes 0xEE); rows correct by pitch and no output channel equals 0xEE"
    - id: B5
      name: "CVF-101 B5: an accessible length too short for every addressed row fails with camera_io/capture_failed"
      observable: "top-down one-byte-short, first-row-only, and bottom-up truncated locks; failure status camera_io, code capture_failed, no value"
    - id: B6
      name: "CVF-101 B6: dimension and pitch arithmetic that would overflow fails cleanly"
      observable: "height 0xFFFFFFFF; width 0xFFFFFFF0; pitch+dimension product overflow; camera_io/capture_failed, no crash, no read"
  boundary:
    - name: "1x1 packed image with positive and negative pitch (rgb24 and rgb32)"
    - name: "height-1 and width-1 edges (rgb24, rgb32; yuy2 minimum even width 2)"
    - name: "accessible length exactly the minimum extent accepted vs one byte short rejected (rgb24 4x3 pitch 12; rgb32 4x2 pitch 16)"
    - name: "padded row where width is not a multiple of 4 (rgb24 width 5, pitch 20)"
  negative:
    - name: "null base pointer with nonzero extent and dimensions -> camera_io/capture_failed, no crash"
    - name: "zero width with nonzero height; zero height with nonzero width -> camera_io/capture_failed, no crash"
    - name: "pitch magnitude smaller than one packed row (pitch 11 and -11 for a 12-byte rgb24 row) -> camera_io/capture_failed"
    - name: "zero pitch with more than one row -> camera_io/capture_failed"

