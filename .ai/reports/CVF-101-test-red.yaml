correction_2026_09_18:
  reason: >-
    A semantic defect in the authored test was found and confirmed against the
    change contract (.ai/changes/CVF-101.yaml) and the pre-existing production
    behavior: the test assumed NativePixelFormat rgb24/rgb32 mean R,G,B byte
    order in memory. That is wrong. The contract fixes Media Foundation native
    memory layouts: rgb24 (D3DFMT_R8G8B8) and rgb32 (X8R8G8B8) store B,G,R,
    argb32 stores B,G,R,A, and the seam always outputs BGR8. YUV formats
    (yuy2/uyvy/nv12/i420/yv12) use U=V=128 as neutral with no fixed
    limited-versus-full range in the contract.
  changes:
    - id: C1
      description: >-
        fill_rgb24_row now writes native bytes (b, g, r), i.e. byte0=blue,
        byte1=green, byte2=red, honoring D3DFMT_R8G8B8 memory order, so a byte
        sequence [b,g,r] yields BGR8 (b,g,r) with no channel swap. SyntheticLock
        and every fill_rgb24 call site were re-parameterized to (b,g,r) to match.
    - id: C2
      description: >-
        Added fill_bgr32_row and SyntheticLock::fill_bgr32 for 32-bit packed
        formats, writing native bytes (b,g,r,a) so rgb32 and argb32 follow their
        documented memory order.
    - id: C3
      description: >-
        Added the dedicated regression guard TEST_CASE "CVF-101 B3: packed
        B,G,R native memory decodes to the identical BGR8 channel order"
        [cvf-101][B3][channel-order] with 4 SECTIONs: rgb24 2x1 top-down, rgb24
        2x2 bottom-up, rgb32 2x1 top-down+bottom-up, and argb32 2x1
        top-down+bottom-up. Each uses DISTINCT B,G,R values (kBgrA=(30,20,10),
        kBgrMid=(60,50,40), kBgrB=(100,150,200)) and asserts the exact BGR8
        triple, so a channel-swapping decoder fails.
    - id: C4
      description: >-
        The YUY2 orientation cases assert only structural neutrality (equal B, G,
        R channels for U=V=128) and monotonic ordering (dark row before bright
        row); no assertion pins a specific limited-versus-full YUV range. The
        boundary yuy2 minimum-width case likewise asserts neutrality only.
    - id: C5
      description: >-
        All orientation (B1, B2, B3 orientation), padding (B4), boundary, bounds
        (B5), overflow (B6), and negative cases are retained. The only relaxed
        expectations are the YUY2 luminance value pins described in C4; every
        orientation, channel-order, structural-neutrality, padding, bounds, and
        negative assertion remains.
  updated_file:
    path: tests/windows/uvc/cvf101_uvc_frame_convert_test.cpp
    previous_sha256: 1c006a1d11b89b261943ba553ebfe85a6f74f877a17988e7f0aa25b61ded1595
    new_sha256: 5db636e6b22685de8097cfd82953228874c3476766bf46eedcd18969d1fda6e1
  expected_red:
