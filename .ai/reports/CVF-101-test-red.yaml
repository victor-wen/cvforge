correction_2_2026_09_18:
  reason: >-
    An implementation-side verification proved the corrected test was internally
    contradictory: it could not pass with ANY decoder. The first correction
    re-parameterized fill_rgb24_row/SyntheticLock::fill_rgb24 to (blue, green,
    red) writing (b,g,r) memory and added an identity channel-order case, but
    four call sites still passed the old R,G,B-style literals while expecting the
    kBgr* constants. Specifically B1 (~line 344) and B2 (~line 365) called
    fill_rgb24(0u, 10u, 20u, 30u) / (1u, 40u, 50u, 60u) / (2u, 200u, 150u,
    100u) and expected kBgrA(30,20,10) / kBgrMid(60,50,40) / kBgrB(100,150,200);
    under B,G,R identity semantics those calls produce (10,20,30) etc., so B1/B2
    failed. The two rgb24 1x1 boundary SECTIONs (~line 554/564) had the same
    stale argument order. This was a test defect, not an implementation defect:
    the change contract's native_memory_semantics and pre-existing production
    behavior both define rgb24/rgb32 as B,G,R memory order, and the
    implementation conforms. Only the test owner may change the test.
  changes:
    - id: D1
      description: >-
        B1 and B2 now pass the expected-constant channel values in (blue, green,
        red) order: fill_rgb24(0u, kBgrA[0], kBgrA[1], kBgrA[2]),
        fill_rgb24(1u, kBgrMid[0], kBgrMid[1], kBgrMid[2]),
        fill_rgb24(2u, kBgrB[0], kBgrB[1], kBgrB[2]). Because the constants are
        BGR8 triples and the packer writes (b,g,r) memory, the arguments and the
        expected BGR constants now agree byte-for-byte.
    - id: D2
      description: >-
        Both rgb24 1x1 boundary SECTIONs (top-down pitch 3 and bottom-up pitch
        -3) now call fill_rgb24(0u, kBgrA[0], kBgrA[1], kBgrA[2]) instead of the
        stale (10u, 20u, 30u).
    - id: D3
      description: >-
        Intent preserved: three visually distinct asymmetric rows proving
        TOP/BOTTOM orientation under both pitch signs, plus the 1x1 edges. The
        distinct-RGB channel-order case (identity assertion) is unchanged in
        intent. All other formatting remains (blue, green, red).
  updated_file:
    path: tests/windows/uvc/cvf101_uvc_frame_convert_test.cpp
    previous_sha256: 5db636e6b22685de8097cfd82953228874c3476766bf46eedcd18969d1fda6e1
    new_sha256: 4fb03ee44b0c0fb33c5d43cc52aca5488775bb2fc3c7d91e083580629110e08c
