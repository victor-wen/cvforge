win32_semantics_probe:
  kind: >-
    Auxiliary, explicitly NOT MSVC evidence. A scratch CMake project under
    /tmp/opencode/cmake-dll-probe reproduces the helper command and the
    catch_discover_tests ordering with a multi-config generator
    (Ninja Multi-Config), pinning the shared object to bin/<config> and
    emulating the Windows loader rule with install RPATH $ORIGIN so the
    discovery-like run step can only succeed when the library was copied next
    to the executable.
  commands:
    - command: "cmake -S /tmp/opencode/cmake-dll-probe -B build-with -G 'Ninja Multi-Config' && cmake --build build-with --config Debug && cmake --build build-with --config Release"
      exit_code: 0
      summary: >-
        Debug and Release: libmylib.so ends up in both build-with/<config>/ next
        to myexe; the discovery-like POST_BUILD run after link prints
        probe_value=42 in both configurations. Logs:
        .ai/validation/ci-round-2-dll-probe-with-{debug,release}.log
    - command: "negative control: same project with -DPROBE_NO_COPY=ON"
      exit_code: 1
      summary: >-
        Fails exactly in the discovery-like step: "error while loading shared
        libraries: libmylib.so: cannot open shared object file" - the Linux
        analogue of STATUS_DLL_NOT_FOUND. Proves the probe is meaningful and
        the helper removes the failure. Log:
        .ai/validation/ci-round-2-dll-probe-negative-control.log
  conclusion: >-
    The generator expressions, copy_if_different semantics and POST_BUILD
    ordering used by cvforwin_place_shared_library behave as intended for both
    configurations of a multi-config build.

