  expected_ci_assertions:
    - "windows-msvc-release: build completes; cvf_unit_tests Catch discovery exits 0; ctest runs."
    - "windows-msvc-tests: cvf006_lifecycle compiles with no C4996/C2220; ctest runs the full test-enabled suite."

