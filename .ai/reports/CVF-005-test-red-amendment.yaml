schema_version: 1
change_id: CVF-005
phase: AUTHOR
amendment: A6
date: 2026-09-15
owner: test-engineer
subject: >-
  Test-side lifetime defect in the independent save_request() helper: the frozen
  CaptureSaveRequest identifier fields are non-owning string_views, and the helper
  moved std::string temporaries into them, leaving dangling views after it returned.

defect:
  reported_by: developer
  assumption_id: A6
  file: tests/unit/cvf005_test_support.h
  description: >-
    save_request(...) took recipe_id/request_id by value and std::move()d them into the
    returned CaptureSaveRequest's recipe_id/request_id fields. The string parameters are
    destroyed when the helper returns, so every view in the returned request dangled for
    the duration of the save() call under test: undefined behaviour, and not a compile
    error, which is why the earlier -fsyntax-only RED run could not see it.
  interface_status: >-
    The frozen interface is correct: CaptureSaveRequest carries non-owning string_view
    identifiers. The defect was entirely test-side and is corrected here; no production
    or spec change was requested or made.

fix:
  summary: >-
    save_request() now returns a SaveRequestHolder that owns both identifier strings and
    builds the CaptureSaveRequest from that owned storage; each test takes the request via
    holder.request() on a named holder so the storage outlives the save() call.
  mechanism:
    - >-
      SaveRequestHolder declares recipe_storage_ (std::string) and request_storage_
      (std::string) before request_ and builds the frozen request from those members, so
      the string_view fields point at holder-owned buffers.
    - >-
      request() is lvalue-ref-qualified (const&) and the const&& overload is deleted, so
      calling request() on a temporary holder does not compile: the corrected dangling
      pattern cannot be reintroduced.
    - >-
      SaveRequestHolder is non-copyable and non-movable; returning it from the helper and
      initializing a named holder relies on C++17 guaranteed copy elision.
  call_sites_updated: 10
  call_site_file: tests/unit/cvf005_capture_store_test.cpp
  assertions_changed: none
  coverage_changed: none
  spec_expectations_changed: none
  restructure_note: >-
    Only the call shape changed (store->save(holder.request()) with a named
    SaveRequestHolder before it). Test names, tags, SECTION structure, expected values,
    and every CHECK/REQUIRE are unchanged in intent; nothing was weakened, skipped, or
    removed.

