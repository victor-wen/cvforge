decisions:
  - id: D1
    topic: spdlog rotating sink bound
    decision: >-
      The frozen rule is "the rotating-log family stays within max_files". spdlog's
      rotating_file_sink keeps max_files + 1 files (current file + max_files rotated;
      verified empirically: max_files=1 -> 2 files, max_files=2 -> 3 files with the
      installed spdlog 1.17.0). The store therefore constructs the sink with
      max_files - 1 rotated files (0 when max_files == 1, which truncates on
      rotation). Probe evidence: cvforwin* regular files = 1 for max_files=1 and
      2 for max_files=2 with max_file_bytes=1024 and 40 entries.
  - id: D2
    topic: encode vs write failure split
    decision: >-
      cv::imencode into a buffer (image_encode_error on empty pixels, exception, or
      false return), then std::ofstream binary write (image_write_error on open or
      write/flush failure). A failed write removes any partial file, so no .png
      artifact remains after a failure (matches author assumption A14).
  - id: D3
    topic: degraded diagnostics
    decision: >-
      Directory creation or sink open failure does not fail create(): the instance
      keeps warning_log_sink_failed, log_file_path() still reports
      <log_dir>/cvforwin.log, callback delivery continues, and log() stays noexcept.
  - id: D4
    topic: path validation and root normalization
    decision: >-
      std::filesystem::path::is_absolute() is used (matching the recipe-store
      precedent for filesystem roots). CaptureStore normalizes a trailing separator
      so the returned path's parent is the configured root and returned paths are
      always direct children.
  - id: D5
    topic: retention classification
    decision: >-
      Entries are classified with directory_entry::symlink_status, so symlinks and
      all other non-regular entries are skipped and never followed; age deletions
      run first, then size deletions over the survivors, both oldest-last_write_time
      first with a path tie-break for determinism.

assumption_outcomes:
  - id: A6
    topic: CaptureSaveRequest identifier lifetime
    outcome: resolved_by_test_owner
    detail: >-
      The developer reported that the original save_request() helper moved
      std::string parameters into the frozen string_view fields, leaving dangling
      views. The test owner replaced it with SaveRequestHolder (owns identifier
      storage; lvalue-qualified request(); rvalue overload deleted) and amended
      .ai/test-ownership.yaml with new hashes
      (cvf005_test_support.h 41d4009c..., cvf005_capture_store_test.cpp b9cb8cce...).
      All 7 current hashes match the amended manifest; the developer did not modify
      any test file. All capture-store test cases now pass.
  - id: A10
    topic: rotating log file count bound
    outcome: confirmed_and_handled
    detail: >-
      spdlog keeps max_files + 1 files; the implementation passes max_files - 1 so
      the frozen "<= max_files" bound holds (see D1). Directly verified for
      max_files = 1 and 2.

test_defects:
  - id: TD-1
    test: "tests/unit/cvf005_diagnostics_logging_test.cpp - CVF-005 B4: rolling files stay within max_files"
    ctest: 221
    classification: test_defect_irreconcilable_with_frozen_spec
    summary: >-
      Both B4 sections call create_diagnostics(..., 128u, {1,2}u) and REQUIRE
      create() to succeed, but the frozen rule says "max_file_bytes < 1024 or
      max_files < 1 -> invalid_argument/diagnostics_invalid_config" and the same
      suite's B1 test explicitly requires 1023 to be rejected as
      diagnostics_invalid_config. 128 < 1023, so no implementation can satisfy both;
      production follows the frozen rule and B1.
    evidence: >-
      evidence_probe: create(128) -> invalid_argument/1700; create(1023) ->
      invalid_argument/1700; create(1024) -> ok; rotation at 1024 with max_files=1
      and 2 keeps exactly 1 and 2 cvforwin* files, so B4's assertions pass once the
      test uses an accepted size.
    suggested_test_fix: >-
      Use max_file_bytes = 1024u in both B4 sections (entries are ~90 bytes each and
      40 entries exceed 1024, so rotation is still exercised) or raise the bound via
      an approved contract revision. No production change is warranted.
    note: >-
      The change contract notes contain "Use small bounds in tests (e.g.
      max_file_bytes=128, max_files=2...)", which conflicts with the normative
      interface_v1 rule (minimum 1024). This is a contract-internal inconsistency the
      architect may want to reconcile; the developer implemented the normative rule.
  - id: TD-2
    test: "tests/unit/cvf005_capture_store_test.cpp - CVF-005 B8 boundary: empty identifiers become unnamed"
    ctest: 228
    classification: test_expectation_typo
    summary: >-
      The both-empty section checks name.find("_unnamed__unnamed_") (double
      underscore) while the frozen filename grammar
      <utcstamp>_<recipe>_<request>_<sequence>.png with empty -> "unnamed" yields a
      single underscore between the two tokens. The other 10 assertions of the test
      case pass, including the single-empty sections.
    evidence: >-
      evidence_probe: both-empty filename 20260915T024706-274_unnamed_unnamed_0.png;
      contains _unnamed_unnamed_ = yes; contains _unnamed__unnamed_ = no.
    suggested_test_fix: >-
      Expect "_unnamed_unnamed_" (single underscore) instead of
      "_unnamed__unnamed_". No production change is warranted; changing the
      filename grammar would contradict interface_v1.

