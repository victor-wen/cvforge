findings:
  - id: B4A-01
    title: mandatory colour check could be satisfied by the neutral spread control
    status: FIXED
    requirement: >-
      A required colour check must fail closed when the saturated CVF-COLOR-1
      target is not actually tested; the neutral control is never a substitute.
    changes:
      tests_hardware_uvc_smoke_cpp:
        - "1109-1146 run_color_case: added the required+!CVF_HW_COLOR_TEST fail-closed gate (1116-1123), the non-required skip gate (1125-1128), and the required+CVF_HW_COLOR_EXPECT=neutral fail-closed gate (1137-1146); the gate now reads the CVF_HW_COLOR_TEST flag before any expectation is honoured"
        - "1168-1170 comment in the neutral branch stating the neutral spread control is a non-required control and never a substitute for the positive saturated target"
        - "93-95 header colour procedure note stating the same"
    failure_message_names_flags: true

  - id: B4A-02
    title: orientation positive check and symmetric control were required on one frame
    status: FIXED
    requirement: >-
      The positive asymmetric-target checks and the symmetric negative control
      must not be required to hold on one captured frame; each runs on its own
      capture and neither invalidates the other when only one target is set up.
    changes:
      tests_hardware_uvc_smoke_cpp:
        - "1025-1100 run_orientation_case rewritten: the positive checks capture and evaluate one frame (1051-1073) and the symmetric control captures and evaluates its own separate frame at control time (1075-1099), with no early return between them; each report.check is independent"
        - "69-72 header orientation procedure note: the control is captured/evaluated separately and needs its own run with a vertically symmetric card"
      docs_hardware_uvc_md:
        - "121-126 section 5: the symmetric control is a separate, non-required negative check evaluated on its own captured frame and needs its own run with a vertically symmetric card; it is never a substitute for the positive target"
    regression_invariants_preserved: >-
      CMake wiring untouched; the developer wiring tests #451-#453 still pin
      WIN32 + opt-in, never-registered-with-CTest, and no hosted CI job.

  - id: B4A-03
    title: recorded evidence could not prove which requirement/control flags were set
    status: FIXED
    requirement: >-
      Every relevant CVF_HW_* requirement/control flag in effect is recorded in
      the release-evidence block, and each mandatory-check failure message names
      the specific flags that were set.
    changes:
      tests_hardware_uvc_smoke_cpp:
        - "424-435 EvidenceRecord: added orientation_test, orientation_min_contrast, orientation_symmetric_control, color_test, color_expect, color_min_dominance, color_min_level, color_max_spread, color_tolerance, color_reference_configured, unplug_test, expect_zero_devices"
        - "498-509 evidence_text(): emit the twelve added fields"
        - "712-734 added orientation_flag_state() and color_flag_state() helpers that render the flags in effect"
        - "1475-1495 run_suite(): populate the added evidence fields from the live environment"
        - "1038-1042 orientation mandatory failure message now appends the orientation flag state"
        - "1117-1121 and 1140-1144 colour mandatory failure messages now append the colour flag state"
      docs_hardware_uvc_md:
        - "90-92 section 4: flags in effect are recorded and named in mandatory-failure messages"
        - "225-236 section 10 example block: added the orientation/colour/unplug/zero-device flag lines"
        - "258-264 section 10: documents that the block records the flags and that mandatory-failure messages name them"
