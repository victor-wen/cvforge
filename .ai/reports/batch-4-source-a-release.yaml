item_1_cvf107_mandatory_check_machinery:
  status: PASS_WITH_FINDINGS
  nbf01_fix_verification: REAL_AND_COMPLETE_FOR_ORIENTATION
  evidence:
    - "Mandatory orientation gate is unconditional and precedes all control logic: tests/hardware/uvc_smoke.cpp:977-984 fails with report.check(false) whenever required && !CVF_HW_ORIENTATION_TEST, regardless of CVF_HW_ORIENTATION_SYMMETRIC_CONTROL (the required_fix from CVF107-NBF-01 part (a))."
    - "Both-flags path runs the positive asymmetric checks first (uvc_smoke.cpp:1010-1016: |top-bottom| >= min AND signed top-bottom >= min), then adds the negative control with no early return (uvc_smoke.cpp:1021-1026) — required_fix part (b)."
    - "Skip path survives only when neither flag is set and the check is not required (uvc_smoke.cpp:986-989)."
    - "Colour mandatory gate is fail-closed when the target is not requested (uvc_smoke.cpp:1036-1045), but see finding B4A-01 for the neutral-control analogue."
    - "Stress mode forces require_orientation/require_color/require_timeout (uvc_smoke.cpp:1348-1350), rejects CVF_HW_EXPECT_ZERO_DEVICES in stress (1374-1377 / 1395-1398), and refuses short stress runs (1127-1131)."
    - "On-hardware confirmation of the fixed code: cvf107-hw-verifyB-stress-shortcycle-guard.txt:45 (short-stress guard fired, exit 1) and :43 (new H7 message with the 'not a substitute' parenthetical), cvf107-hw-verifyC-symmetric-control-failclosed.txt:42,60 (H7 mandatory failure with require_orientation=yes, RESULT: FAIL, exit 1)."
    - "1000-cycle stress run honestly failed H7/H8 as mandatory checks (cvf107-hw-1000cycles.txt:43-44,70-73,94)."
  selector_invariant: PASS
  evidence_selector:
    - "The only device selection is cam::resolve_identity(devices, selector) at uvc_smoke.cpp:1434; no devices[0]/first-device indexing exists anywhere in the suite."
    - "Shared resolver is fail-closed with no fallback: src/camera/camera_backend.cpp:62-87 (empty -> selector_empty/invalid_argument; multiple -> camera_identity_ambiguous; none -> camera_not_found)."
    - "Suite-level negatives pin the same (uvc_smoke.cpp:759-812); missing selector is a configuration failure (1423-1432)."
    - "On-hardware fail-closed proof: cvf107-hw-selector-failclosed.txt:3,12-14,16-18,39 — with YLX-4K-S858 absent and ACER present, H2 failed camera_not_found, H3-H8 skipped, exit 1; the suite did not capture from the single attached camera."
  target_gating: PASS
  evidence_gating:
    - "Hardware target: CMakeLists.txt:1795-1822 — add_executable(cvf_hw_uvc_smoke) inside if(CVFORWIN_BUILD_HARDWARE_TESTS) AND nested if(WIN32); no add_test and no catch_discover_tests/gtest_discover_tests in the block; non-Windows branch reports the option is ignored (1818-1820)."
    - "Option default OFF: cmake/CvfOptions.cmake:55."
    - "MSVC _CRT_SECURE_NO_WARNINGS is PRIVATE and target-scoped (CMakeLists.txt:1805-1810), matching the cvf006_lifecycle precedent at 770-775; no global add_compile_definitions/add_definitions carries it (pinned by the wiring test)."
    - "No CMakePresets.json entry sets the option (grep over *.json found no CVFORWIN_BUILD_HARDWARE_TESTS/CVF_HW/hw_uvc reference outside .ai/**)."
    - ".github/** contains no reference to HARDWARE/hw_uvc/CVF_HW (grep, no matches)."
    - "Wiring invariants are machine-pinned by tests/unit/test_cvf107_hardware_wiring_developer.cpp:270-437 (gate nesting at 279-335, CTest ban at 338-356, CRT scoping at 358-407, .github ban at 409-436), with mutation evidence that all four defect classes go RED (CVF-107-build-wiring-test.yaml:83-125; four mutations RED, file restored byte-identical)."
  findings:
    - id: B4A-01
      severity: non_blocking
      owner: test-engineer
      issue: >-
        The colour-check analogue of NBF-01 was not hardened. When the colour check is mandatory
        (stress mode or CVF_HW_REQUIRE_COLOR=1), an operator can set CVF_HW_COLOR_TEST=1 with
        CVF_HW_COLOR_EXPECT=neutral and pass H8 using only the neutral spread control
        (uvc_smoke.cpp:1073-1081 returns after the spread check), i.e. without the documented
        CVF-COLOR-1 saturated swatch and without any dominance/level evidence. Orientation received
        the explicit "control is not a substitute" gate (uvc_smoke.cpp:977-984); colour did not.
        docs/hardware-uvc.md:120-124 calls the gray card "the documented neutral target" while the
        suite header calls the same mode a "neutral control" (uvc_smoke.cpp:81), so the manual and
        the code disagree on its status.
      evidence: "tests/hardware/uvc_smoke.cpp:81,1036-1045,1073-1081; docs/hardware-uvc.md:120-124"
      why_not_blocking: >-
        The captured stress evidence failed H8 honestly (cvf107-hw-1000cycles.txt:44,72) and
        orientation/colour are recorded UNVERIFIED for this release, so no false evidence was
        manufactured; the substitution would be visible in the log (expected=neutral is printed at
        uvc_smoke.cpp:1065-1067) rather than silent.
      required_fix: >-
        Mirror the orientation hardening: when the colour check is required, reject
        CVF_HW_COLOR_EXPECT=neutral (or at minimum record a distinct 'neutral-control-only' outcome
        that cannot be counted as CVF-COLOR-1 saturated-target evidence), and align the docs wording
        so neutral is described as a control, not a target.
    - id: B4A-02
      severity: non_blocking
      owner: test-engineer
      issue: >-
        Setting both CVF_HW_ORIENTATION_TEST=1 and CVF_HW_ORIENTATION_SYMMETRIC_CONTROL=1 can never
        produce a fully passing run: the positive check requires |top-bottom| >= min_contrast
        (uvc_smoke.cpp:1011-1015) while the control requires |top-bottom| < min_contrast
        (uvc_smoke.cpp:1022) on the same captured frame, so exactly one of the two must fail.
        docs/hardware-uvc.md:117-118 describes the combined mode without telling the operator it is
        inherently un-passable.
      evidence: "tests/hardware/uvc_smoke.cpp:1010-1026; docs/hardware-uvc.md:110-118"
      why_not_blocking: >-
        The failure direction is fail-closed (it can never manufacture a false PASS); this matches
        the reviewer-prescribed NBF-01 fix verbatim. It is an operator-ergonomics/documentation
        gap, not a soundness hole.
      required_fix: >-
        Document that the symmetric control must be run in a separate non-required run with a
        symmetric card (the only mode in which it is exercisable), or capture two frames when both
        flags are set.

