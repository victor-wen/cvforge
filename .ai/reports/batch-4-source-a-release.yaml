item_3_cvf107_h3_amendment:
  status: PASS
  conclusion: LEGITIMATE — real coverage was not removed
  evidence:
    - "Frozen design: production owns one worker for the backend's whole lifetime — src/camera/uvc_windows/uvc_backend.cpp:832-838 (constructor starts the single worker); open() after close() returns worker_unavailable ('the camera open worker is not running', uvc_backend.cpp:886-888); close() permanently joins the worker (uvc_backend.cpp:996-1000, worker_.stop_and_join()); there is no restart path."
    - "Contract uvc_worker_lifecycle_v1 pins this: 'One application-created worker thread ... one balanced MFStartup/MFShutdown lifetime' and 'Close ... joins the worker' (.ai/project-contract.yaml:742,747)."
    - "The pre-amendment H3 asserted that the SAME instance reopens after close() (removed lines in CVF-107-test-amendment.yaml:34-41) — behavior the frozen design forbids, i.e. an unpassable-by-design assertion, not coverage. In-session re-activation is reconnect()'s job (uvc_backend.cpp:946-989)."
    - "The amended block (uvc_smoke.cpp:891-900) opens the same descriptor with a FRESH instance and captures from it — the meaningful invariant (descriptor stays usable) — and the closed-instance negative is still pinned separately: capture after double close() must fail camera_io (uvc_smoke.cpp:877-884; observed on hardware, e.g. cvf107-hw-1000cycles.txt:29-30 'the camera capture worker is not running')."
    - "All surrounding H3 checks are preserved (open 831; three validated captures 840-870; frame ownership 872-875; held-pixels validity after close/destruction 1466-1473); no check was weakened or removed (CVF-107-test-amendment.yaml:59-64; reverse-hash scope proof :66-74)."
    - "Post-amendment hardware evidence on two different devices: cvf107-hw-smoke-10cycles.txt:31-32 and cvf107-hw-builtin-acer-10cycles.txt:30-31."
    - "The only residual: the open-after-close worker-unavailable failure mode itself is not asserted directly (only capture-after-close is); acceptable, since capture-after-close pins the joined-worker state."

