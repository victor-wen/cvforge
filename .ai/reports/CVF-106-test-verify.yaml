scope: >-
  Bounded amendment of two authored CVF-106 expectations that were provably
  inconsistent with the frozen production behaviour. No intent was weakened and
  no assertion was removed, skipped, disabled, or deleted.

corrections:
  - id: C1
    file: tests/unit/cvf106_test.helpers.h
    symbol: outcome_measurements
    before: >-
      outcome_measurements() required the runtime output JSON to contain a nested
      "measurements" key and returned output.at("measurements"); outcome_score()
      and outcome_int("x"/"y") therefore required the nested shape.
    after: >-
      outcome_measurements() returns the flat top-level final result object and
      its REQUIRE(output.is_object()) is retained; outcome_score() and
      outcome_int() keep their meaning by reading score/x/y/width/height directly
      from that top-level object. No nested-key requirement is added.
    basis: >-
      .ai/project-contract.yaml interfaces.final_result_payload_v1 requires one
      final object "assembled from measurements and optional defects"; the frozen
      runtime flattens the algorithm measurements and adds an optional "defects"
      key at the top level (the hash-pinned CVF-006 expectations read
      output_json.at("total_pixels") at the top level).
    intent_preserved: >-
      Every measurement accessor still fails if the named measurement is absent,
      and still returns the same typed value as before.

  - id: C2
    file: tests/unit/cvf106_lifecycle_test.cpp
    case: "CVF-106 B8 example.threshold keeps its observable output through the lifecycle"
    before: >-
      The case drove the synthetic camera and asserted output_text was
      byte-identical across three Context::inspect calls, including across a
      reload.
    after: >-
      The case drives a fixed single-frame file camera, so every capture serves
      byte-identical pixels and the serialized output is genuinely deterministic.
      The byte-identical output_text assertions (second and third versus first)
      and output_json equality are retained across two inspects and across
      reload, and the stable structural observables are additionally pinned:
      same status, same verdict, top-level white_pixels/total_pixels/pass_ratio
      present, and every numeric measurement finite.
    basis: >-
      The frozen SyntheticCameraBackend produces sequence-dependent pixels
      (pixel = f(x, y, sequence)); white-pixel counts differ per capture,
      observed 209/224/239 for sequences 0/1/2, so byte-identical text was not a
      valid fixed expectation for that backend. Brief observable B8 still
      requires example.threshold to keep its observable output through the new
      lifecycle; a constant frame preserves that intent deterministically.
    intent_preserved: >-
      Not a tautology: the case still compares full serialized output text and
      JSON across calls/reload and would fail if the lifecycle changed the
      observable output at all.

  - id: C3
    files: unchanged
      - tests/unit/cvf106_prepare_test.cpp
      - tests/unit/cvf106_template_match_test.cpp

