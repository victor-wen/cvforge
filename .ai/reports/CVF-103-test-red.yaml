      evidence.

assumptions:
  - >-
    The first active generation is 1 and 0 is the "no active stream" sentinel;
    the brief fixes "first active generation 1, strictly increasing". The
    accepts(0)-false assertions follow from 0 never being an active generation.
  - >-
    The uint64 return value of discard_stale() is not semantically pinned by the
    brief, so the tests observe its effect through stale_events_discarded()
    (value N increment -> N+1) instead of guessing the return value.
  - >-
    A stale generation is defined as any generation that is not the active
    generation. The brief's boundary "only the active one is accepted" makes
    discard_stale(stale) a discard and discard_stale(active) a non-discard.
  - >-
    Zero-device enumeration and absent-identity failing opens are the brief's
    mandated deterministic backend cases; the successful-stream properties
    (fresh callback per started stream, monotonic reconnect generations, retired
    stale rejection) are asserted in their observable monotonic/no-fabrication
    form and unit-tested portably for pure logic.
  - >-
    Documented camera failures for the hardware-free host are camera_not_found
    or camera_io, matching the frozen uvc_backend.h open/capture/reconnect
    documentation.

