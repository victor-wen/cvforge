schema_version: 1
change_id: CVF-103
phase: AUTHOR
author: test-engineer
recorded_at: 2026-09-18
host: Linux (WSL) GCC 13.3.0; Windows suite authored-but-not-executed on this host

summary: >-
  Independent black-box tests were authored for the CVF-103 per-stream callback
  generation and stale-callback rejection change before the frozen seams or
  their implementation exists. Two seams are covered: (a) the portable
  StreamGenerationGate in src/camera/uvc_windows/uvc_stream_generation.h, and
  (b) the Windows-only UvcCallbackSnapshot + UvcCameraBackend::callback_snapshot()
  in src/camera/uvc_windows/uvc_backend.h. RED is honest and structural: the
  portable seam header is absent, so the portable TU fails to compile, and the
  Windows accessor is absent, so the Windows TU fails to compile. No execution
  output is fabricated or claimed. To show the RED is the absent seam and not a
  broken test, the portable TU is additionally run against a from-spec reference
  gate (all 70 assertions pass) and the Windows TU is syntax-checked against a
  from-spec overlay that only adds the frozen snapshot struct and accessor (clean).

