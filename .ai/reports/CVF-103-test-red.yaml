    Neither frozen seam is implemented yet: uvc_stream_generation.h does not
    exist, and UvcCameraBackend has no callback_snapshot() member. Both TUs
    therefore fail to compile against the real include tree. This is the honest
    RED for a pre-implementation author phase.
  portable_suite: >-
    the portable TU is registered by the canonical preset and stops the canonical
    build (exit 1); ctest reports its discovered test as NOT_BUILT (Not Run)
  windows_suite_execution: "authored-but-not-executed on this Linux host; not claimed as passing"

