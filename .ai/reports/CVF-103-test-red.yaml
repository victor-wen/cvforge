seam_selection:
  portable_header: src/camera/uvc_windows/uvc_stream_generation.h
  portable_declaration_used: >-
    cvforwin::camera::uvc::StreamGenerationGate with begin_stream() -> uint64
    (first active generation 1, strictly increasing), retire(), accepts(gen) const
    -> bool, discard_stale(gen) -> uint64, active_generation() const,
    stale_events_discarded() const.
  windows_header: src/camera/uvc_windows/uvc_backend.h
  windows_declaration_used: >-
    cvforwin::camera::UvcCameraBackend::callback_snapshot() const noexcept
    returning UvcCallbackSnapshot with the brief-frozen fields active_generation,
    callbacks_created, stale_events_discarded, stream_open.
  note: >-
    Both seams are frozen by the CVF-103 change contract (quoted in the brief).
    The Windows snapshot fields are read through `auto`, so the file does not
    depend on any non-frozen snapshot type spelling. Both files include frozen
    headers only; no production .cpp was read.

cases:
  portable_unit:
    acceptance:
      - id: B4
        name: "first begin_stream returns generation 1"
        observable: "begin_stream() == 1 and active_generation() == that value"
      - id: B4
        name: "consecutive begin_stream generations are strictly increasing"
        observable: "six successive begin_stream() values each strictly greater than the previous; active_generation tracks the latest"
      - id: B4
        name: "accepts is true only for the active generation"
        observable: "active true; active+1, active+2, and the 0 sentinel false; a fresh gate has active_generation 0 and accepts(0) false"
      - id: B4
        name: "after retire no generation is accepted"
        observable: "retire() then accepts(active), accepts(active+1), accepts(0) all false"
      - id: B4
        name: "a begin_stream after retire continues the sequence"
        observable: "replacement > retired; only replacement active; retired rejected"
      - id: B4
        name: "accepting the active generation does not increment the stale counter"
        observable: "five accepts(active) leave stale_events_discarded unchanged"
      - id: B4
        name: "active_generation and stale_events_discarded are consistent across the sequence"
        observable: "from 0/0 through five begin/discard rounds, both counters match the independently tracked expectation; a future generation is never accepted"
    negative:
      - name: "a stale generation is rejected and discard_stale increments the counter"
        observable: "after begin/begin, stale is rejected; stale_events_discarded increments once per discard_stale(stale), twice for two discards"
      - name: "two consecutive generations both delivering completions accept only the active one"
        observable: "generation_one rejected, generation_two accepted; discarding both increments the stale counter exactly once"
    boundary:
      - name: "sentinel generation 0 is never active before any stream or after retire"
      - name: "repeated accepts() of the active generation are idempotent for counters"
  windows_component:
    acceptance:
      - id: B4
        name: "a fresh backend exposes a consistent no-stream callback snapshot"
        observable: "stream_open false, callbacks_created 0, stale_events_discarded 0; repeated reads stable"
      - id: B4
        name: "callback_snapshot is safe from a no-COM and an STA caller thread"
        observable: "both caller threads observe a consistent idle snapshot and enumerate succeeds"
      - id: B4
        name: "callbacks_created never decreases and stays zero while no stream starts"
        observable: "four failing opens with zero devices leave stream_open false and callbacks_created unchanged"
      - id: B4
        name: "active_generation never decreases across open, capture, reconnect, and close"
        observable: "monotonic non-decreasing active_generation across the whole sequence"
      - id: B4
        name: "stream_open reflects open failure and close"
        observable: "false before; false after a failed open; false after close and after repeated close"
      - id: B4
        name: "a started stream creates a fresh callback and a retired generation is not reused"
        observable: >-
          device-present branch: stream_open true, callbacks_created increased,
          active_generation advanced, close leaves it closed with counters
          non-decreasing; hardware-free branch: failing open is documented,
          creates no callback, leaves the stream closed, generation non-decreasing
    close_and_stale:
      - id: B1/B2
        name: "after close a capture fails deterministically and no stale completion is accepted"
        observable: "capture after close fails with a documented camera failure; stream_open false and callbacks_created unchanged"
      - id: B3
        name: "consecutive captures on an unopened stream fail deterministically"
        observable: "three captures each fail with a documented camera failure and never report an open stream"
    boundary:
      - id: B4
        name: "an expired deadline fails immediately and leaves callback state unchanged"
        observable: "enumerate/open/capture/reconnect all timeout in <2s; capture code capture_timed_out; snapshot counters unchanged"
      - name: "zero devices enumerate empty, no stream opens, no callback is created"
        observable: "enumerate succeeds empty; snapshot idle; open fails camera_not_found"
    negative:
      - name: "two consecutive failed opens never reuse a callback or accept a stale completion"
        observable: "both opens fail; callbacks_created, stale_events_discarded, and active_generation are all non-decreasing; a capture still fails with a documented camera failure"
    reconnect_limit:
      - id: B5
        name: "a bounded reconnect attempt never starts a stream without a device"
        observable: "reconnect fails with a documented camera failure; no stream open; no callback fabricated; generation non-decreasing"

