fixtures_and_tolerances:
  fixture: >-
    One license-cleared asymmetric 5x4 single-channel template generated
    deterministically at run time in tests/unit/cvf106_test.helpers.h
    (asymmetric_template) plus a second asymmetric template
    (asymmetric_template_alt) for reload. No binary image is checked in; PNG
    assets are encoded in-memory or written to per-test temporary directories.
  golden_policy: >-
    An exact template copy is expected to score 1.0 for ccoeff_normed; score
    assertions use Catch::Approx with an absolute margin of 1e-6, and match
    coordinates/size are asserted as exact integers in the global frame. The
    boundary case derives the threshold from the measured score rather than
    hard-coding a floating value. No sleeps and no machine-specific paths are
    used.

author_assumptions:
  - "Frozen seam: src/algorithms/template_match.h exists with a class registered under key \"template.match\" by register_compiled_algorithms."
  - "src/algorithms/template_match.h need not expose a fixed class name to this suite; the algorithm is obtained through AlgorithmRegistry::find(\"template.match\")."
  - "AlgorithmAsset is constructible as {std::string key; std::string reference; std::vector<std::uint8_t> bytes;} in that field order (aggregate or equivalent)."
  - "AlgorithmAssetBundle exposes a public std::vector<AlgorithmAsset> assets member (default-constructible) used only to build a one-asset bundle; its lookup API is not assumed by the tests."
  - "IInspectionAlgorithm::prepare(const nlohmann::json&, const AlgorithmAssetBundle&) const returns core::Result<std::unique_ptr<IPreparedAlgorithm>>."
  - "IPreparedAlgorithm::inspect(const AlgorithmRequest&) returns core::Result<AlgorithmResult>, and inspection::dispatch(const IPreparedAlgorithm&, const AlgorithmRequest&) exists."
  - "template.match parameter keys are template_asset, roi ([x,y,w,h]), method (\"ccoeff_normed\"), threshold (0..1); measurements carry score, x, y, width, height; a FAIL defect carries kind == \"template_mismatch\"."
  - "A preparation rejection is reported with broad status config_error (the brief permits algorithm_parameters_invalid or the documented config error, so the tests assert that broad status instead of one exact code)."
  - "The recipe assets mapping is {\"<logical-key>\": \"<relative-reference>\"} and the runtime Context rejects the whole candidate on any asset/preparation failure while the previous snapshot stays active."
  - "Context::create/reload_recipes read <config_root>/assets for recipe asset references; the deterministic file and synthetic backends are selected via RuntimeOptions.camera_override as in the CVF-006 suite."
  - "These interface assumptions are the only implementation-adjacent choices; every expected value is derived from the brief and the approved contract. They are centralized in tests/unit/cvf106_test.helpers.h so a spelling correction is a one-file change."

notes:
  - "No production .cpp, diff, developer note, or root-cause report was read. Frozen headers were read over the codegraph header reader because the session read policy denies direct src/** reads."
  - "The root CMakeLists.txt registration is applied by .ai/validation/cvf106-register.py because that path is outside this session's edit policy, exactly as CVF-103/CVF-104/CVF-105 recorded; CMakeLists.txt is not an owned test artifact."
  - "The from-spec reference (reference_main.cpp) and the author harness are validation aids under .ai/validation, not owned test artifacts and not registered with CTest."
