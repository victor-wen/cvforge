summary: >-
  Independent black-box tests were authored before the frozen additive seam
  exists. All three test translation units fail to compile because
  src/algorithms/template_match.h is absent and the additive
  AlgorithmAsset/AlgorithmAssetBundle/IPreparedAlgorithm/prepare types are not
  declared in src/inspection/algorithm.h and src/inspection/registry.h. RED is
  the absent seam, not a broken test: a self-contained from-spec ZNCC reference
  run for the same deterministic input passes every expectation.

