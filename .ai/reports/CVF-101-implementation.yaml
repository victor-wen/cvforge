# =============================================================================
# SESSION 3 (2026-09-18): FIND-CVF101-02 accessible_bytes basis clarification.
# The blocks above are retained verbatim as prior evidence. Everything below
# records the bounded fix that closes FIND-CVF101-02.
# =============================================================================
session_3:
  recorded_at: 2026-09-18
  trigger: >-
    Reviewer FIND-CVF101-02: the frozen seam header documented accessible_bytes as "reachable
    bytes from scanline0", but uvc_frame_math.h computes row offsets from the LOWEST ADDRESSED
    byte and uvc_backend.cpp passed IMF2DBuffer2::Lock2DSize's pcbBufferLength, which Microsoft
    documents as the length from ppbBufferStart. For a full-frame bottom-up buffer the two
    coincide, so the field meaning was ambiguous/inconsistent. The architect clarified the
    contract: accessible_bytes is measured from the lowest addressed byte of the scanned region,
    and a caller reporting a start pointer plus length must pass
    buffer_start + buffer_length - lowest_addressed.

  root_cause:
    file: src/camera/uvc_windows/uvc_backend.cpp
    function: lock_2d_buffer / Impl::convert_sample
    summary: >-
      The Lock2DSize return values (ppbBufferStart, pcbBufferLength) were stored raw as the view's
      accessible bytes, i.e. the length from the lock's start pointer, while the seam's row math
      (packed_row_region_offset / packed_row_fits) measures every row from the lowest addressed
      byte. Whenever buffer_start was not the lowest addressed byte of the scanned region (in
      particular any negative-pitch view whose lock starts at scanline0 rather than at the
      physically-lowest row), the accessible length and the row offsets were expressed on
      different bases, so the bound was either trusted beyond its real reach or mis-attributed.
    secondary: >-
      The frozen seam header comment "reachable bytes from scanline0" stated the pre-clarification
      basis and was inconsistent with the math header, which already documented the lowest
      addressed byte.

  fix:
    principle: >-
      accessible_bytes is now explicitly measured from the lowest addressed byte everywhere:
      lowest_addressed = scanline0 for pitch >= 0, else scanline0 - (height-1)*|pitch|;
      accessible = buffer_start + buffer_length - lowest_addressed. A lock whose reported range
      does not strictly contain the addressed region is rejected with camera_io/capture_failed.
    files:
      - path: src/camera/uvc_windows/uvc_frame_convert.h
        sha256: 823eb1b3a8026866735a6b9fee937f736098a25fd9e10c2bd7c8c3652df13b6c
        change: >-
          Comments only. The Locked2DBufferView field comment now reads "reachable bytes from the
          lowest addressed byte"; the header banner documents the new basis and the
          buffer_start + buffer_length - lowest_addressed caller obligation. Struct layout,
          member types/order/defaults, enum values and the function signature are byte-for-byte
          unchanged: no ABI/interface shape change.
      - path: src/camera/uvc_windows/uvc_frame_math.h
        sha256: f0e4554bc2e760a3849dd7c691af7b05ed166e5a6037acce16a913901193d399
        change: >-
          Added three portable, overflow-safe constexpr helpers: lowest_addressed_address()
          (scanline0 minus (height-1)*|pitch| for negative pitch, underflow-safe),
          rebase_accessible_extent() (end = start + length with checked_add, rejects empty ranges
          and ranges that do not strictly contain the lowest addressed byte), and
          lock_accessible_extent() which composes them into the exact basis the backend consumes.
          Updated the file banner to state the rebasing rule. No existing helper changed.
      - path: src/camera/uvc_windows/uvc_backend.cpp
        sha256: 9294cbe213ed4488c082e7f02fbae58b3c0d08ffed8b2fb7450f234bacea583b
        change: >-
          Locked2DView now stores the raw Lock2DSize range (buffer_start, buffer_length) instead
          of a raw "accessible_bytes"; lock_2d_buffer() is otherwise unchanged and the Lock2D
          unknown-bounds path is unchanged (start null, length 0, known=false). New
          accessible_extent_from_lock_start() is a thin pointer-widening call into the tested
          lock_accessible_extent(). convert_sample() rebases the Lock2DSize range onto the lowest
          addressed byte and, when the reported range does not contain the scanned region, unlocks
          and returns camera_io/capture_failed instead of silently trusting the lock. The empty
          buffer (buffer_length == 0) keeps its previous "the Media Foundation sample buffer is
          empty" failure. The contiguous IMFMediaBuffer::Lock fallback path is untouched.
      - path: tests/unit/uvc_frame_math_test.cpp
        sha256: ed09ebff2bd293655bac50adf0f605e2fd284a34044df2acd2994e423f828eec
        change: >-
          Added three developer-owned cases (names do not start with cvf1): the lowest addressed
          byte follows the pitch sign (top-down, bottom-up, single row, zero height, INT32_MIN,
          sub-zero descent); the accessible extent rebases onto the lowest addressed byte
          (full-frame, range starting below the region, last-byte boundary, non-containing range,
          empty range, end overflow); and the composite lock range gives the accessible extent
          from its lowest addressed byte (bottom-up full frame, a scanline0-anchored negative-pitch
          range that must be rejected, short ranges, empty range, zero height, start overflow).

  overflow_safety_and_unchanged_behavior:
    - "rebase_accessible_extent uses checked_add for start+length and rejects overflow; lowest_addressed_address rejects height 0, INT32_MIN pitch, and a descent below address zero."
    - "Positive pitch: lowest_addressed == scanline0, so accessible == buffer_length, byte-for-byte the previous behavior."
    - "Lock2D unknown-bounds path and the IMFMediaBuffer::Lock contiguous fallback are unchanged."
    - "No inversion is applied for negative pitch; scanline0 + row*pitch addressing is unchanged."

  developer_tests:
    file: tests/unit/uvc_frame_math_test.cpp
    sha256: ed09ebff2bd293655bac50adf0f605e2fd284a34044df2acd2994e423f828eec
