# =============================================================================
# SESSION 2 (2026-09-18): FIND-CVF101-01 planar 4:2:0 buffer fix.
# The block above is retained verbatim as prior evidence. Everything below
# records the new session in which a real production defect was fixed.
# =============================================================================
session_2:
  recorded_at: 2026-09-18
  trigger: >-
    Independent verification FIND-CVF101-01: decode_planar_420 allocated a planar buffer with only
    luma_rows + chroma_rows rows but wrote the V plane at planar.ptr(luma_rows + chroma_rows + row),
    so NativePixelFormat::i420 and yv12 with a positive pitch always failed with
    camera_io/capture_failed thrown from Mat::ptr and swallowed by the seam catch.

  root_cause:
    file: src/camera/uvc_windows/uvc_frame_convert.cpp
    function: decode_planar_420
    summary: >-
      The planar destination was allocated with height*3/2 rows (luma_rows + chroma_rows) but the
      chroma copy loop wrote U as one FULL-WIDTH row at index luma_rows + row and V as one
      full-width row at index luma_rows + chroma_rows + row. That both (a) addressed row
      luma_rows + chroma_rows + row, outside the height*3/2 allocation, and (b) wrote each chroma
      plane at full width instead of the packed half-width representation OpenCV expects. The
      out-of-range Mat::ptr threw cv::Exception, caught by decode_locked_buffer_to_bgr8's catch,
      surfacing as camera_io/capture_failed for every positive-pitch i420/yv12 lock.
    opencv_layout_ground_truth: >-
      Confirmed empirically and from the vcpkg OpenCV 4.12.0 source of cvtThreePlaneYUVtoBGR and
      RGB8toYUV420pInvoker: COLOR_YUV2BGR_I420 requires an input Mat of exactly height*3/2 rows;
      U starts at byte width*height and V at byte width*height + width*height/4, each occupying
      width*height/4 contiguous bytes at half width. An H + 2*(H/2) = 2H allocation is rejected by
      OpenCV's CV_Assert(sz.height % 3 == 0).
    note_on_contract_wording: >-
      The task text's literal formula "luma_rows + 2*chroma_rows" evaluates to 2H and is
      contradicted by its own stated intent "total height*3/2 for 4:2:0" and by OpenCV's actual
      requirement. The fix follows the stated canonical total height*3/2 and OpenCV's byte layout:
      allocation luma_rows + chroma_rows, with U/V packed contiguously at half width.

  fix:
    file: src/camera/uvc_windows/uvc_frame_convert.cpp
    sha256_after: d98a58804c4aa960eec711343cb0e52f61da3d9d30e998eefb34fa94f465015c
    change: >-
      decode_planar_420 now allocates cv::Mat planar(luma_rows + chroma_rows, width, CV_8UC1)
      (height*3/2, continuous) and writes both chroma planes packed at half width: U at row
      offset luma_rows (byte offset chroma_rows*chroma_row_bytes into the chroma region) and V
      immediately after U, using u_destination/v_destination byte pointers. The
      first_plane_is_u = (format == i420) mapping is retained, so I420 (U then V) and YV12
      (V then U) both map to the canonical Y,U,V buffer.
    preserved:
      - "All bounds/overflow checks and accessible_bytes validation are untouched."
      - "Negative-pitch rejection, even-dimension checks and even-stride checks are untouched."
      - "No public interface, seam declaration, CMake, or test file changed."

  independent_test_execution:
    test_sha256: 79a261b1a98298de0a7b515e65d0af0a55e470eb4fcbbfefd8a3c1a472ef57e0
    test_sha256_unchanged_from_session_start: true
    note: >-
      Mirrored Linux -D_WIN32 compile of the independent test against the real implementation,
      real core and real OpenCV/Catch2, then executed. Behavioral/syntactic proxy only; not MSVC
      evidence. No test file was modified.
    compile_command: >-
      g++ -D_WIN32 -std=c++20 -O0 -g -I src -I include
      -isystem build/wsl-gcc-debug/vcpkg_installed/x64-linux/include/opencv4
      -isystem build/wsl-gcc-debug/vcpkg_installed/x64-linux/include
      tests/windows/uvc/cvf101_uvc_frame_convert_test.cpp
      src/camera/uvc_windows/uvc_frame_convert.cpp src/core/error.cpp
      -Lbuild/wsl-gcc-debug/vcpkg_installed/x64-linux/debug/lib
      -Lbuild/wsl-gcc-debug/vcpkg_installed/x64-linux/debug/lib/manual-link
      -Wl,--start-group -lopencv_imgproc4d -lopencv_core4d -lCatch2Maind -lCatch2d -Wl,--end-group
      -lpthread -ldl -o /tmp/opencode/cvf101c/fixed_repro
    compile_exit_code: 0
