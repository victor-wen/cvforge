summary: >-
  Implemented per-stream callback generation and stale-callback rejection for the
  Windows-only UVC backend. Added the portable, dependency-free
  src/camera/uvc_windows/uvc_stream_generation.h (StreamGenerationGate) exactly
  per the frozen test seam; added UvcCallbackSnapshot and the Windows-only
  UvcCameraBackend::callback_snapshot() const noexcept accessor to uvc_backend.h
  without changing any ICameraBackend signature or the public C ABI; reworked the
  read path so every started stream constructs a NEW ReadCallback carrying a fresh
  monotonic generation from the gate, OnReadSample/OnFlush record the callback's
  immutable generation and are applied only while the gate accepts it, rejected
  events increment stale_events_discarded and never touch completion state, and
  teardown retires the generation before releasing reader/source/callback. All
  callback objects share a reference-counted generation state, so no dangling raw
  pointer to a destroyed backend exists. The independent portable CVF-103 test now
  passes (70 assertions in 9 test cases) and the canonical portable suite is
  301/301 with format-check and static-analysis clean. Windows MSVC
  compilation/execution of cvf103_windows_uvc_tests is deferred to the
  windows-tests-quality CI and is NOT claimed here.

deliverables:
  - requirement: "Portable frozen seam header uvc_stream_generation.h with StreamGenerationGate"
    status: done
    note: >-
      begin_stream()/retire()/accepts()/discard_stale()/active_generation()/
      stale_events_discarded() exactly as declared. No Windows/MF/OpenCV
      dependency; internally atomic so it is safe when a Media Foundation
      work-queue thread calls accepts()/discard_stale() while the owned worker
      calls begin_stream()/retire(). Generation 0 is the no-active-stream
      sentinel and is never returned by begin_stream().
  - requirement: "UvcCallbackSnapshot + callback_snapshot() Windows-only internal accessor"
    status: done
    note: >-
      Struct fields active_generation, callbacks_created, stale_events_discarded,
      stream_open; accessor is const noexcept and absent from ICameraBackend and
      the C ABI. No existing signature changed.
  - requirement: "Fresh callback + fresh generation per started stream"
    status: done
    note: >-
      start_stream() calls begin_stream() and constructs a new ReadCallback every
      time; the old callback is never reused by a replacement SourceReader.
      callbacks_created increments once per started stream.
  - requirement: "OnReadSample/OnFlush record immutable generation; completion accepted only for the active generation"
    status: done
    note: >-
      Each callback stores a const generation and the shared gate; both callback
      methods reject a non-accepted generation before touching any completion
      field. The capture waiter predicate additionally requires
      gate.accepts(generation).
  - requirement: "Rejected events increment stale_events_discarded and set nothing else"
    status: done
    note: >-
      Rejected OnReadSample/OnFlush call discard_stale() and return immediately;
      read_completed, read_status, read_flags, read_sample, and flush_completed
      are untouched.
  - requirement: "Teardown retires the generation before releasing reader/source/callback"
    status: done
    note: >-
      teardown_stream() retires the gate first, then releases callback/reader/source
      on the worker. teardown_worker() no longer has a separate callback reset
      because teardown_stream() now owns per-stream callback release.
  - requirement: "active_generation monotonic across reconnect; stream_open reflects open/close"
    status: done
    note: >-
      The gate's generation source is monotonic for the whole backend lifetime and
      continues strictly upward across close/reconnect/re-open. stream_open is an
      atomic mirror set on successful start_stream() and cleared by teardown.
  - requirement: "Timeout/flush path clears a late completion and marks reconnect exactly as before"
    status: done
    note: >-
      cancel_pending_read() keeps its Flush/grace-budget/begin_read() clearing
      behavior and now also requires gate.accepts() for the flush completion.
      When cancel returns false the stream is marked needs_reconnect_ as before.
  - requirement: "No reuse of one callback across SourceReaders; reference-counted with no dangling backend pointer"
    status: done
    note: >-
      ReadCallback holds std::shared_ptr<StreamGenerationState> (not a raw backend
      pointer), so a callback kept alive by Media Foundation after teardown always
      sees live state.
  - requirement: "At most one reconnect/recapture, identity resolution, error mapping, deadline semantics unchanged"
    status: done
    note: >-
      No change to src/runtime/** or the retry logic; identity resolution and
      deadline handling were not modified.

