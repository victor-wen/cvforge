contract_conformance:
  wiring_requirements:
    - "Every started stream constructs a NEW ReadCallback with the generation returned by begin_stream(); no callback instance is reused by a different SourceReader (start_stream)."
    - "OnReadSample/OnFlush record their immutable callback generation and apply a completion only when gate.accepts(generation); the capture waiter predicate re-checks acceptance (uvc_backend.cpp)."
    - "Rejected events call discard_stale() and return before touching read_completed/read_status/read_flags/read_sample/flush_completed."
    - "teardown_stream() retires the generation before releasing reader/source/callback; teardown_worker() releases on the worker before MFShutdown then CoUninitialize."
    - "callbacks_created increments once per started stream; the gate generation source is monotonic for the backend lifetime across reconnect; stream_open mirrors successful open/close."
  invariants:
    - "Monotonic generation ordering with equality-only acceptance."
    - "No stale callback can produce a frame, a false completion, or a false flush success."
    - "At most one reconnect/recapture per inspection is unchanged: no runtime or retry code was touched."
  interface_freeze: >-
    StreamGenerationGate matches .ai/changes/CVF-103.yaml
    interface_v1.frozen_test_seam.portable_logic_declaration; UvcCallbackSnapshot
    and callback_snapshot() match interface_v1.frozen_test_seam.backend_accessor.
    No include/cvforwin or src/c_api change; ICameraBackend unchanged.
  module_scope: >-
    The change stays inside the uvc_windows_backend module. Every callback owns a
    std::shared_ptr to the shared StreamGenerationState rather than a pointer to
    the backend, satisfying the no-dangling-backend-pointer requirement. No vendor
    SDK is used and no Media Foundation/OpenCV type crosses the module boundary.

