red_derivation:
  - >-
    P1/P3 execution is RED by construction until the developer installs a test-enabled
    Windows package: on this host there is no bin/cvforwin.dll to load and no MSVC
    import library to link, so the full run cannot reach a green state and no Windows
    evidence is fabricated.
  - >-
    The package-content checks (P4) are RED against any current tree because
    bin/cvforwin.dll, lib/cvforwin.lib, config/examples/**, docs/**, and LICENSES/** do
    not exist yet as an installed package; the host-executed probes above confirm the
    check script exits non-zero with a clear message for a missing or empty root.

