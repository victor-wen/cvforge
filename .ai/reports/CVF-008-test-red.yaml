  - "dumpbin /exports: exactly the five approved symbols (cvf_get_abi_version, cvf_initialize, cvf_inspect, cvf_reload_recipes, cvf_shutdown)."
  - "dumpbin /dependents: every direct import is a Windows system DLL (the script fails on any non-allowlisted DLL)."
  - "Shipped bin/ directory contains no runtime DLL other than cvforwin.dll against a real package."

