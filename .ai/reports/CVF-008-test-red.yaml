    location: "tests/package/consumer/CMakeLists.txt; tests/package/package_checks.cmake step 6"
    observable: "consumer configure exit 0, build exit 0, executable exit 0"
    author_state: >-
      Configure gate exercised on WSL against the fake package root (exit 0) and the
      relative-root rejection exercised (exit 1). Real link and run deferred to Windows.
  - id: P2
    requirement: "ABI version query returns 1 before any initialization."
    location: "tests/package/consumer/main.c check abi_version_before_initialize"
    observable: "cvf_get_abi_version() == CVF_ABI_VERSION_V1 (1) as the first API call"
    author_state: "Execution deferred to Windows; source compiles C11-clean against the installed include layout."
  - id: P3
    requirement: >-
      Initialize + one inspect + reload + shutdown complete with documented statuses; a
      PASS/FAIL verdict is produced by the example algorithm on the synthetic input
      (never NOT_EVALUATED on success).
    location: "tests/package/consumer/main.c; recipe config/recipes/example.pass.json"
    observable: >-
      initialize OK; inspect status OK with result.status OK, error_code 0, verdict PASS,
      JSON object with white_pixels/total_pixels/pass_ratio, byte-count/NUL rules, empty
      image path for save_policy never; reload OK with error_code 0; shutdown OK.
    author_state: >-
      Execution deferred to Windows. The recipe pins min_pass_ratio 0.0 so the verdict is
      deterministically PASS for any synthetic frame (pass_ratio >= min_pass_ratio always
      holds); this was derived from the contract and the verified CVF-003 example-algorithm
      semantics, not from implementation source.
  - id: P4
    requirement: >-
      Package checks fail (non-zero) if any required file is missing, if the export set
      differs from the five approved symbols, if a non-system runtime DLL appears, or if
      notices are absent.
    location: "tests/package/package_checks.cmake steps 1-5 and the negative self-checks"
    observable: >-
      missing root / relative root / empty root exit 1 with a clear message; missing file,
      export mismatch, non-system DLL, and missing-notice conditions each call cvf_fail,
      and the script exits 1 via the final FATAL_ERROR.
    author_state: >-
      The three root/failure-path probes were executed on WSL and observed to exit 1 with
      the expected messages. The export, dependency, and notice checks require a real
      Windows package and are deferred.

assumptions:
  package_layout:
    - "Required: bin/cvforwin.dll, lib/cvforwin.lib, include/cvforwin/cvf_api.h."
    - "Required example configuration: config/examples/cvforwin.json; required example recipes: at least one *.json under config/examples/recipes/."
    - "Required documentation: at least one file under docs/."
    - "Required notices: at least one file under LICENSES/, including a LICENSE/NOTICE/COPYING-named file."
    - "No runtime DLL other than bin/cvforwin.dll is shipped in bin/."
  consumer_and_schema:
    - >-
      The synthetic backend is accepted only by a test-enabled package build
      (CVFORWIN_BUILD_TEST_BACKENDS=ON); the release variant is uvc-only. The CI job for
      this kit must therefore use the test-enabled package variant.
    - >-
      Global config schema (camera.backend/device_path/vendor_id/product_id/friendly_name,
      top-level base_capture/logging/retention) and recipe schema
      (schema_version/recipe_id/algorithm/parameters/capture/artifacts) follow the accepted
      shape used by the independent CVF-006 lifecycle tests and the checked-in fixture.
    - >-
      The example algorithm key is example.threshold with parameters threshold (0..255) and
      min_pass_ratio (0.0..1.0); pass_ratio >= min_pass_ratio yields PASS. The synthetic
      frame content is not pinned, so the recipe uses min_pass_ratio 0.0 to make PASS
      deterministic.
    - >-
      The inspect result JSON contains white_pixels, total_pixels, and pass_ratio; the
      consumer asserts key presence, not numeric values, for the synthetic frame.
  tooling:
    - >-
      dumpbin is resolved from CVF_DUMPBIN, then PATH, then the newest VS 2022 x64
      toolset through vswhere; if it cannot be found, the script fails instead of
      silently skipping the export/dependency checks.
    - "The consumer executable is always <build>/bin/cvf_package_consumer.exe; the installed DLL is loaded by prepending <CVF_PACKAGE_ROOT>/bin to PATH."

developer_wiring:
  - "Install the test-enabled Windows package variant to a clean absolute root, then run from the repository root:"
  - "  cmake -DCVF_PACKAGE_ROOT=<absolute package root> -P tests/package/package_checks.cmake"
  - "Ensure dumpbin is reachable (VS developer shell, or it is found through vswhere; -DCVF_DUMPBIN=<path> overrides)."
  - "Optional: -DCVF_WORK_DIR, -DCVF_CONSUMER_GENERATOR, and -DCVF_CONSUMER_CONFIG overrides."
  - >-
    Do not edit tests/package/** to make the job pass: fix the package or the CI wiring.
    Any change to these files requires test-owner coordination and a fresh hash record.

non_goals:
  - "No WSL execution of the Windows package was attempted or claimed."
  - "No CI workflow file was authored by the test owner; the developer wires the job."
  - "No production source, build configuration, or other role's artifact was modified."

