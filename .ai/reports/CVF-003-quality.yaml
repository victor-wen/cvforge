  no_windows_build_evidence_used: true
  checks:
    - "CMakeLists.txt: .def source and WINDOWS_EXPORT_ALL_SYMBOLS OFF only under if(WIN32); portable builds use hidden visibility + cmake/cvforwin.map version script"
