    - "cmake/CvfPackage.cmake: package/package-verify refuse on non-WIN32"
    - "CMakePresets.json: windows-msvc-release = Visual Studio 17 2022 + x64-windows-static; no MinGW reference (mingw_reference_found=NO)"
