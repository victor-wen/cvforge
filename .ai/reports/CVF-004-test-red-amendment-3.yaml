change:
  id: CVF-006 backend schema extension
  artifact: tests/unit/cvf004_config_test.cpp
  case: "CVF-004 B2 negative: an unsupported backend is rejected"
  summary: >-
    CVF-006 extends the configuration schema in test-enabled builds only: camera.backend
    additionally accepts "file" and "synthetic", while release builds remain "uvc"-only.
    The previous unconditional rejection of "file" would have failed in the test-enabled
    build, so the case is now build-mode aware.
  behavior:
    disabled_mode: >-
      CVFORWIN_TEST_BACKENDS_ENABLED undefined or 0: the original rejection set
      {v4l2, file, UVC, ""} is preserved (release-mode behavior unchanged).
    enabled_mode: >-
      CVFORWIN_TEST_BACKENDS_ENABLED defined and nonzero: {v4l2, UVC, ""} stay rejected
      with config_error/config_value_invalid, and "file"/"synthetic" must load
      successfully (REQUIRE has_value plus camera.backend echo) using the otherwise-valid
      selector from valid_config() unchanged, so only the backend value under test varies.
  guard: "#if defined(CVFORWIN_TEST_BACKENDS_ENABLED) && CVFORWIN_TEST_BACKENDS_ENABLED"
  developer_wiring_note: >-
    Until the developer wires CVFORWIN_TEST_BACKENDS_ENABLED on the cvf004 test target,
    the file compiles and runs in disabled mode; the enabled-mode branch was validated by
    an explicit -DCVFORWIN_TEST_BACKENDS_ENABLED=1 syntax-only compile.
  assertion_integrity: >-
    No assertion was removed, skipped, disabled, or weakened. The disabled-mode rejection
    set lost no backend (only the conditional test backends moved into the enabled branch)
    and the enabled branch adds acceptance coverage only.
