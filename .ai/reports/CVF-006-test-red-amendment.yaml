defect:
  id: TV-4
  file: tests/abi/cvf006_lifecycle.c
  case: case_b13_input_json_passthrough
  description: >-
    The case's documented intent is that an all-white frame PASSES with the
    recipe and that {"invert": true} flips it to FAIL. It used kFailParameters
    (threshold 255, min_pass_ratio 1.0). Under the frozen example.threshold
    semantics (white = gray > threshold, and invert flips the mask), an all-white
    frame with threshold 255 yields pass_ratio 0.0 -> FAIL, and inverting it
    yields 1.0 -> PASS: the exact opposite of the documented intent and of the
    assertions (no input -> PASS, invert -> FAIL).
fix: >-
  Added the new kFlipParameters constant {"threshold": 128, "min_pass_ratio": 0.5}
  and used it only in case_b13_input_json_passthrough. All-white with threshold
  128 yields pass_ratio 1.0 >= 0.5 -> PASS, and invert flips it to 0.0 < 0.5 ->
  FAIL. The two assertions (b13_uniform_frame_without_input_passes ->
  CVF_VERDICT_PASS, b13_invert_flips_verdict -> CVF_VERDICT_FAIL) are unchanged,
  the intent is preserved, and the cases that intentionally use kFailParameters
  are untouched (case_b3_inspect_happy_path still writes "example.fail" with
  kFailParameters).
intent_preserved: true
