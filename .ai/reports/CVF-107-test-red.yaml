behavior_cases:
  - id: B1
    behavior: >-
      Stress mode supports >= 1000 consecutive captures; every capture validates
      configured dimensions, BGR8 pixel format (CV_8UC3), buffer continuity, and a
      strictly increasing sequence.
    test: run_repeated_cycles_case (H4)
    cases: [stress-minimum 1000, configured min 1, invalid/dimension/type/continuity/sequence counters]
  - id: B2
    behavior: >-
      Orientation check uses an asymmetric TOP/BOTTOM target and passes only when
      contrast >= threshold and the bright band is at the visual top; a vertically
      symmetric image is explicitly rejected as orientation evidence;
      CVF_HW_REQUIRE_ORIENTATION makes a skip a FAILURE in stress mode.
    test: run_orientation_case (H7) + CVF_HW_ORIENTATION_SYMMETRIC_CONTROL negative control
  - id: B3
    behavior: >-
      Color check against the documented target with documented tolerances; passes
      inside and fails outside; CVF_HW_REQUIRE_COLOR makes a skip a FAILURE in
      stress mode.
    test: run_color_case (H8) with dominance/level/neutral-spread/reference-tolerance checks
  - id: B4
    behavior: >-
      Forced timeout is exercised deterministically (already-expired deadline and
      timeout_ms == 0), reports explicit pass/fail, and is never silently skipped in
      stress mode.
    test: run_forced_timeout_case (H5) + mandatory require_timeout assertion
  - id: B5
    behavior: >-
      Bounded reconnect recovers after the documented manual unplug/replug and
      attempts at most one retry; the manual step stays environment-gated.
    test: run_manual_replug_case (H6) + capture_with_one_retry bound
  - id: B6
    behavior: >-
      A missing selector is a configuration failure; there is never a first-device
      fallback; device_path or VID/PID (or exact name) selects exactly one device.
    test: run_suite selector gate + run_resolution_cases (H2)
boundary_cases:
  - "Zero-device station run: empty enumeration + camera_not_found resolution (CVF_HW_EXPECT_ZERO_DEVICES=1)."
  - "Cycle count at the configured minimum (CVF_HW_CYCLES=1): sequence checks not asserted, all other validations apply."
negative_cases:
  - "Stale descriptor open fails camera_not_found with no crash."
  - "Capture before open fails camera_io with no crash."
acceptance_evidence_record:
  - "device identity (device_path, VID/PID, friendly_name, selector kind)"
  - "cycle count; Windows version (RtlGetVersion or override); camera driver/firmware best effort"
  - "stress/requirement flags; check counts; process exit code; optional CVF_HW_EVIDENCE_FILE"

