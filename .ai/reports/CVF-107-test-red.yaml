interface_assumptions:
  - "cvforwin::camera::UvcCameraBackend is default-constructible, implements ICameraBackend, backend_key() == \"uvc\" (static_assert pinned)."
  - "Backend methods: enumerate(Deadline), open(descriptor, settings, Deadline), capture(Deadline), reconnect(settings, Deadline), close()."
  - "CameraDescriptor fields: backend_key, device_path, vendor_id, product_id, friendly_name."
  - "CameraSelector fields: device_path, vendor_id, product_id, friendly_name; empty selector -> selector_empty."
  - "resolve_identity(devices, selector) -> Result<CameraDescriptor>; errors selector_empty, camera_not_found, camera_identity_ambiguous."
  - "CameraSettings: width, height, frame_rate, preferred_format (PixelFormat::bgr8)."
  - "CapturedFrame: metadata.{width,height,pixel_format,sequence} plus owned cv::Mat pixels."
  - "core::Deadline::from_timeout_ms / core::Deadline::immediate."
  - "core::Result<T>::has_value()/value()/failure(); Failure fields status, code, message; status_name/error_code_name."
  - "Status::{invalid_argument,camera_not_found,camera_io,timeout}; ErrorCode::{selector_empty,camera_not_found,camera_identity_ambiguous,capture_timed_out}."
  - "free function cam::capture_with_one_retry(backend, settings, deadline)."
  - "These assumptions must be coordinated before verify; they come only from the frozen headers and the brief, never from a .cpp."

