  contract_text: >-
    .ai/project-contract.yaml:975 (hardware_uvc.production_release_requirement): "A recorded PASS
    with at least 1000 cycles and no skipped timeout, reconnect, orientation, or color checks on
    representative hardware is required before FCT deployment."
  satisfied: false
  statement: >-
    THE CONTRACT'S PRODUCTION RELEASE REQUIREMENT IS NOT YET SATISFIED at candidate 2461959, and
    this must not be reported as a pass. No recorded run combines a PASS exit with all four checks
    executed: the final-source 1000-cycle run correctly exits 1 because orientation and colour are
    mandatory in a 1000-cycle release run and this station has no CVF-ORIENT-1 or CVF-COLOR-1
    physical target; orientation and colour are recorded UNVERIFIED and were never counted as
    passes; the reconnect leg was not re-run at final source. The suite itself now refuses to
    certify a 1000-cycle release run without both targets, which is the correct fail-closed
    behaviour.
  what_remains: >-
    (1) A station session equipped with the two documented physical targets - the CVF-ORIENT-1
    vertically asymmetric bright-white/matte-black card and the CVF-COLOR-1 saturated swatch - plus
    a UVC camera selected by an exact selector. (2) One clean full release run of the contract's
    canonical windows_hardware_stress command (.ai/project-contract.yaml:1016: CVF_HW_CYCLES=1000,
    CVF_HW_UNPLUG_TEST=1, CVF_HW_REQUIRE_ORIENTATION=1, CVF_HW_REQUIRE_COLOR=1, with
    CVF_HW_CAMERA_DRIVER / CVF_HW_CAMERA_FIRMWARE set) recording RESULT: PASS / process_exit_code=0
    with no skipped timeout, reconnect, orientation, or colour checks, archived with its
    release-evidence block. FCT deployment must not proceed on the current evidence.

