title: >-
  CVF-107 H3 amendment: replace same-instance close()-then-open() with a fresh
  backend instance reopening the same descriptor

summary: >-
  The CVF-107 Windows hardware suite run on the real station (YLX-4K-S858)
  reported 32 passed, 1 failed, 3 skipped. The single failure was
  "H3 the backend can reopen the same descriptor after close", which closed one
  backend instance and then called open() again on that SAME instance. The
  camera backend contract does not define instance reuse after close(): a closed
  instance is single-use, and in-session re-activation is expressed through
  reconnect(), not close()-then-open() on one instance. Neither
  .ai/project-contract.yaml nor .ai/changes/CVF-107.yaml nor
  .ai/test-briefs/CVF-107.yaml contains any reopen-per-instance requirement. The
  behaviour that does matter is that a successfully used then closed descriptor
  remains usable, so the check now constructs a FRESH backend instance, opens the
  same descriptor with the same settings, and captures from that instance.

file_of_record:
  path: tests/hardware/uvc_smoke.cpp
  owner: test-engineer
  pre_amendment_sha256: 7a62b1c8a45f7db1782f303c1be4c79b3ffa87593137c1d15e6c3ce83f8a689c
  post_amendment_sha256: d2df883641ceb6d9738a189226bd9373345b3f6718f090a07279355c0a3d2867
  post_amendment_bytes: 66172

lines_changed:
  pre_amendment_line_range: 882-888
  post_amendment_line_range: 882-896
  removed_lines:
    - '    auto reopened = backend.open(descriptor, settings, open_deadline());'
    - '    report.check(reopened.has_value(), "H3 the backend can reopen the same descriptor after close");'
    - '    if (reopened.has_value()) {'
    - '        auto recaptured = backend.capture(capture_deadline());'
    - '        report.check(recaptured.has_value(), "H3 a capture after reopen succeeds (device remains usable)");'
    - '    }'
    - '    backend.close();'
  added_lines:
    - '    // A closed backend instance is single-use by contract: close() releases the'
    - '    // device and the same instance is not reopened. Re-activation within a live'
    - "    // session is reconnect()'s job, not close()-then-open() on one instance. What"
    - '    // must hold is that the descriptor stays usable, so a FRESH backend instance'
    - '    // must be able to open it again and capture from it.'
    - '    HwBackend reopened_backend;'
    - '    auto reopened = reopened_backend.open(descriptor, settings, open_deadline());'
    - '    report.check(reopened.has_value(),'
    - '                 "H3 a fresh backend instance can reopen the same descriptor after close");'
    - '    if (reopened.has_value()) {'
    - '        auto recaptured = reopened_backend.capture(capture_deadline());'
    - '        report.check(recaptured.has_value(),'
    - '                     "H3 a capture from the fresh backend instance succeeds (descriptor stays usable)");'
    - '    }'
    - '    reopened_backend.close();'

preserved_checks:
  - 'H3 open with the resolved descriptor and configured settings succeeds'
  - 'H3 capture #0..#2 returns an owned BGR8 frame with configured dimensions and an incrementing sequence'
  - 'H3 the captured frame owns its pixel buffer'
  - 'H3 capture after two idempotent close() calls fails with camera_io (no crash)'
  - 'No assertion was removed, weakened, disabled, skipped, or deleted; coverage was not reduced.'

