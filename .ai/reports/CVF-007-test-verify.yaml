deferred_evidence:
  - item: "Windows 10/11 x64 build and run of tests/hardware/uvc_smoke.cpp (H1-H6 UVC hardware smoke suite)"
    status: DEFERRED (explicitly NOT PASS)
    reason: >-
      The translation unit is entirely inside #if defined(_WIN32) and its CMake target exists only on
      WIN32 with CVFORWIN_BUILD_HARDWARE_TESTS=ON (default OFF). This WSL host has no Windows toolchain
      and no UVC camera, and the contract states WSL is never Windows ABI or hardware evidence. The
      brief defers execution to a designated Windows 10/11 x64 station.
    unverified_compile_time_assumptions:
      - "src/camera/uvc_windows/uvc_backend.h declares a default-constructible cvforwin::camera::UvcCameraBackend implementing ICameraBackend and reporting backend_key() == \"uvc\""
      - "camera-contract spellings used by the suite: CameraDescriptor (backend_key/device_path/vendor_id/product_id/friendly_name), CameraSelector, CameraSettings, CapturedFrame{metadata,pixels}, resolve_identity(), capture_with_one_retry(), core::Deadline::from_timeout_ms()/immediate(), core::Status/core::ErrorCode names, core::status_name()/core::error_code_name()"
    unverified_runtime_cases:
      - "H1 enumerate: backend_key \"uvc\", non-empty device_path, VID/PID empty or 4 lowercase hex"
      - "H2 resolve: empty selector rejected; zero match -> camera_not_found/camera_not_found; multi-match -> camera_not_found/camera_identity_ambiguous; friendly_name-only boundary; exact-name match; no first-device fallback"
      - "H3 open/configure/capture/close: owned BGR8 pixels, configured dimensions, incrementing sequence, two idempotent closes, capture-after-close camera_io, reopen"
      - "H4 repeated captures (default 50, CVF_HW_CYCLES) with no invalid frame, then device still usable and still enumerated"
      - "H5 already-expired deadline -> timeout/capture_timed_out, then recovery"
      - "H6 env-gated manual unplug/replug (CVF_HW_UNPLUG_TEST=1): first capture after unplug camera_io, bounded retry fails while absent within deadline, one bounded reconnect+recapture recovers, at most one retry; skipped automatically when the env gate is unset"
      - "negative: capture before open -> camera_io; open with stale descriptor -> camera_not_found; close on never-opened backend without crash"
    operator_procedure: >-
      Documented in the file header: run 'uvc_smoke --list' to print identity fields, then configure
      CVF_HW_UVC_DEVICE_PATH or CVF_HW_UVC_VID/PID/NAME; optional CVF_HW_WIDTH/HEIGHT/FPS/CYCLES;
      CVF_HW_EXPECT_ZERO_DEVICES=1 for the camera-less boundary; CVF_HW_UNPLUG_TEST=1 for the manual
      unplug/replug step. Exit code 0 = all executed checks passed, 1 = at least one failure.

