deviations:
  - id: a
    area: inspection target dependency
    severity: documented-clarification
    detail: >-
      the project contract module table lists core_model, camera_contract, and
      OpenCV core for inspection_contract_and_registry, but the frozen
      AlgorithmRequest/AlgorithmResult expose nlohmann::json references, so the
      cvforwin_inspection target must publish the nlohmann-json include paths.
      nlohmann-json is an already approved project dependency and the algorithm
      module keeps it PUBLIC as well; no dependency direction changes.
  - id: b
    area: dispatch const bridge
    severity: frozen-interface-necessary
    detail: >-
      interface_v1 fixes dispatch(const IInspectionAlgorithm&, ...) while
      IInspectionAlgorithm::inspect is non-const (the independent test double
      overrides it as non-const). dispatch therefore const_casts the reference
      before the single inspect call. The registry only ever stores non-const
      algorithm objects, so the cast is well-defined; a comment in registry.cpp
      documents the rationale.
  - id: c
    area: example algorithm defensive validation
    severity: fail-closed
    detail: >-
      inspect() re-validates parameters, input_json, and a non-empty supported
      pixel type (BGR8/mono8) before OpenCV work instead of trusting the caller
      alone. validate_parameters() remains the recipe-time contract; the extra
      checks only substitute stable failures for exceptions inside dispatch.
      Direct inspect is exercised by the independent B6/B7 tests and by the
      developer empty-frame test.
  - id: d
    area: developer test wiring
    severity: benign
    detail: >-
      The 12 developer test cases were added to the existing cvf_unit_tests
      executable (which now links cvforwin_algorithms) rather than a separate
      binary; tests/unit/cvf003_* stay exclusive to cvf003_tests and remain
      test-owner owned.

implementation_notes:
  - "Dispatch order is deadline -> empty frame -> invoke -> bound, matching the contract ordering; a Failure returned by the algorithm is propagated byte-for-byte (status, code, message)."
  - "The bound metric is measurements.dump().size() + defects.dump().size() compared with '>'; a result exactly at 65536 bytes succeeds (developer test pins this)."
  - "Key validation is applied to the algorithm's own key() at add time; find() treats any unmatched string (including malformed keys) as algorithm_not_found."
  - "Example parameter strictness: threshold must be a JSON integer in 0..255 (floats and strings rejected), min_pass_ratio a JSON number in 0.0..1.0 (booleans rejected), unknown keys rejected; input_json must be an object whose only optional key invert is boolean."
  - "Threshold comparison is strict gray > threshold (cv::THRESH_BINARY), invert is bitwise_not, pass_ratio is white/total with 0.0 for a zero-pixel mask."
  - "No camera, C ABI, filesystem, logging, or global mutable state is used by src/inspection/** or src/algorithms/**."
  - "clang-format was applied to all new/changed owned C++ files; format-check needs no new exclusions because tests/unit/cvf003_* were already formatted and hash-pinned by the test owner."

