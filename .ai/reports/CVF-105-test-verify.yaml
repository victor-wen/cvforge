defect:
  file: tests/unit/cvf105_abi_validation_test.cpp
  summary: >-
    options_for() returned a cvf_init_options_v1 whose config_root_utf8 and
    output_root_utf8 fields pointed at the caller's strings, but three call sites
    passed the `const char*` constant kMissingRoot. That implicitly constructed a
    temporary std::string which was destroyed at the end of the full-expression,
    so cvf_initialize() later read freed heap memory (heap-use-after-free under
    AddressSanitizer).
  affected_cases:
    - test: "CVF-105 B4: a short error message buffer reports the primary failure status and the required size"
      ctest_id_asan_before: 391
      site_lines_before: [238, 250]
    - test: "CVF-105 B3: a valid pointer set with a missing root fails without publishing a context"
      ctest_id_asan_before: 384
      site_lines_before: [317]

fix:
  approach: >-
    options_for() now takes std::string_view for both roots and stores
    .data()/.size(), so a `const char*` argument can no longer silently create a
    non-owning temporary; and each kMissingRoot caller binds the constant to a
    named `const std::string` local that outlives the cvf_initialize() call.
    A whole-file scan confirmed the only unsafe pattern was the kMissingRoot
    argument; every other caller already passed named std::string locals.
  preserved_intent: >-
    All assertions, SECTIONs, test names, payloads, and expected values are
    byte-identical to the prior revision; only the lifetime plumbing of the two
    options structs changed.
  files:
    - path: tests/unit/cvf105_abi_validation_test.cpp
      previous_sha256: 4a12787a3c8a8bfac8391fcb00b48b1fb7bb116431382d3f4b715bd05c92f6b6
      new_sha256: 9dba770fd61496186ab1203a38676692e056ac713f19f546d783ce56817bd183
    - path: tests/unit/cvf105_test.helpers.h
      sha256: 634e19a47fb5d0cb305c408081dfc9c0eb518397bca0a8b9d62b60e0179dba3a
      changed: false

