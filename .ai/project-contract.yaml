project:
  name: cvforwin
  lifecycle: production-hardening
  target_release: 1.1.0
  public_abi_version: 1
  purpose: >-
    Reusable C++ visual-inspection DLL template for Windows FCT stations. A native C
    host performs one inspection call while the DLL owns camera acquisition, recipe
    selection, OpenCV processing, diagnostics, and result encoding.
  repository_evidence: >-
    The repository was re-surveyed on 2026-09-18. It is an implemented CMake/C++20 project
    with a frozen five-function C ABI, runtime/context orchestration, strict recipe catalog,
    compile-time algorithm registry, deterministic test camera backends, Windows Media
    Foundation UVC backend, diagnostics/artifact services, 263 portable tests recorded by
    the prior workflow, two windows-2022 CI jobs, package verification, and an opt-in UVC
    hardware executable. Contract 1.1.0 is a bounded hardening revision of that implementation,
    not a greenfield redesign.

requirements:
  functional:
    - id: FR-001
      statement: Deliver a Windows x64 DLL for use as an external visual-inspection library by FCT equipment.
      source: user
    - id: FR-002
      statement: Expose a C ABI consumable directly by a native C host.
      source: user
    - id: FR-003
      statement: Keep camera discovery, opening, acquisition, reconnect, and capture inside the DLL.
      source: user
    - id: FR-004
      statement: Perform one complete normal inspection cycle through one cvf_inspect call; separate lifecycle and recipe-reload calls are allowed.
      source: user
    - id: FR-005
      statement: Use OpenCV C++ internally and isolate algorithm classes so cv2-style Python logic can be ported without changing the C ABI or camera code.
      source: user
    - id: FR-006
      statement: Initially support a driverless UVC camera on Windows and preserve an internal camera-backend extension point for a future Daheng adapter.
      source: user
    - id: FR-007
      statement: Select one of multiple compiled inspection algorithms and product recipes through recipe_id.
      source: user
    - id: FR-008
      statement: Compile algorithms into the main DLL and load tunable parameters from versioned external UTF-8 JSON recipes; runtime algorithm plug-ins are not used.
      source: user
    - id: FR-009
      statement: Accept recipe_id, request_id, timeout_ms, and optional input_json on each inspection.
      source: user
    - id: FR-010
      statement: Return technical status, NOT_EVALUATED/PASS/FAIL verdict, detailed error code, elapsed time, output_json, and an optional saved-image path.
      source: user
    - id: FR-011
      statement: Match the configured UVC camera by stable identity attributes including symbolic device path and/or VID, PID, and friendly name; never silently select the first enumerated device.
      source: user
    - id: FR-012
      statement: On disconnect or capture failure, perform at most one reconnect and one recapture within the current inspection deadline.
      source: user
    - id: FR-013
      statement: Support one live context and one configured camera per host process, serializing concurrent inspection requests inside the context.
      source: user
    - id: FR-014
      statement: Load and validate global configuration and all recipes during initialization; replace the active recipe snapshot only through an explicit atomic reload.
      source: user
    - id: FR-015
      statement: Let the caller provide absolute configuration and output roots during initialization.
      source: user
    - id: FR-016
      statement: Support independently configurable rolling file logs and a C log callback.
      source: user
    - id: FR-017
      statement: Control capture saving per recipe, defaulting to save on FAIL or technical error and not on PASS.
      source: user
    - id: FR-018
      statement: Include a deterministic example algorithm, example recipes, and a native C consumer that demonstrate the extension and calling contracts without representing a production inspection algorithm.
      source: architect default delegated by user
    - id: FR-019
      statement: Decode Media Foundation 2D buffers from the visual top scanline using scanline0 plus row times pitch for both positive and negative pitch, with overflow-safe accessible-buffer bounds validation and no second vertical reversal.
      source: user code review, verified in src/camera/uvc_windows/uvc_backend.cpp
    - id: FR-020
      statement: Isolate all application-side UVC Media Foundation calls and held interface references, plus MFStartup/MFShutdown and COM initialization, in one DLL-owned MTA camera worker thread; only the required free-threaded SourceReader callback methods run on Media Foundation work-queue threads.
      source: user code review
    - id: FR-021
      statement: Give every SourceReader stream a fresh callback and immutable stream generation; late callbacks from a retired stream must be ignored and must never complete a read for a replacement stream.
      source: user code review
    - id: FR-022
      statement: Enforce the inspection deadline through final result serialization and required artifact completion; optional artifact work must not invalidate a valid verdict or extend the call beyond the deadline, and retention must run outside the inspection critical path.
      source: user code review
    - id: FR-023
      statement: Route every post-frame outcome through one finalization path so fail_or_error can persist the latest valid frame after algorithm, serialization, or later technical failure and return a safely completed diagnostic image path.
      source: user code review
    - id: FR-024
      statement: Canonicalize configured and enumerated UVC VID/PID values to four lowercase ASCII hexadecimal digits before identity comparison while preserving exact device-path and friendly-name matching.
      source: user code review
    - id: FR-025
      statement: Validate every C ABI pointer-length or pointer-capacity pair before side effects; a null pointer with a nonzero length or capacity is invalid, and zero-length optional input is absent regardless of a nonnull pointer value.
      source: user code review
    - id: FR-026
      statement: Make diagnostics warning accumulation and observation race-free across inspect, reload, maintenance, and callback-capable threads.
      source: user code review
    - id: FR-027
      statement: Assemble and serialize the complete ABI output JSON exactly once and enforce one 65535-byte UTF-8 payload maximum, excluding the required trailing NUL in the 65536-byte public buffer.
      source: user code review
    - id: FR-028
      statement: Prepare immutable per-recipe algorithm state and bounded root-contained assets during initialization or atomic recipe reload, never by reading files during inspect.
      source: user request for template matching and Python/OpenCV portability
    - id: FR-029
      statement: Provide a compiled template.match reference algorithm using OpenCV C++, a cached decoded template, bounded ROI, ccoeff_normed scoring, deterministic global-frame coordinates, and strict parameters without changing the C ABI or camera modules.
      source: user request
    - id: FR-030
      statement: Before any new implementation task brief is activated, clear the prior CVF-001 through CVF-008 workflow from active state by archiving completed change/test-brief descriptors and resetting workflow-state, while retaining reports, reviews, and test-ownership hashes as audit history.
      source: user
  non_functional:
    - id: NFR-001
      statement: Target Windows 10 and Windows 11 x64 with Visual Studio 2022, MSVC v143, CMake, and C++20.
    - id: NFR-002
      statement: Keep the public header valid C11 and expose unmangled __cdecl symbols with explicitly sized ABI types.
    - id: NFR-003
      statement: Never expose C++ standard-library, exception, RTTI, OpenCV, compiler-sized enum, or owning data types through the C ABI.
    - id: NFR-004
      statement: Use versioned fixed C structures for stable fields and bounded UTF-8 JSON buffers for algorithm-specific input and output.
    - id: NFR-005
      statement: Caller memory owns every request, result, string, and JSON buffer; only the opaque context is DLL-managed and it is released by cvf_shutdown.
    - id: NFR-006
      statement: Separate execution status from product verdict; technical errors always produce NOT_EVALUATED, never FAIL.
    - id: NFR-007
      statement: Use a 5000 ms end-to-end default when request timeout_ms is zero; a nonzero caller value overrides it.
    - id: NFR-008
      statement: Build portable code and run unit tests natively in WSL with GCC; use mock/file cameras and do not use MinGW as Windows ABI evidence.
    - id: NFR-009
      statement: Perform the final Windows build, test, ABI check, and package verification on the pinned GitHub Actions windows-2022 runner with MSVC v143.
    - id: NFR-010
      statement: Manage pinned dependencies in vcpkg manifest mode with x64-linux in WSL and x64-windows-static for Windows.
    - id: NFR-011
      statement: Ship one project runtime DLL for the initial UVC release by statically linking permitted third-party libraries and the MSVC runtime; Windows system DLLs are allowed.
    - id: NFR-012
      statement: Default file logging to INFO with five 10 MiB rolling files; permit configuration to change level and limits.
    - id: NFR-013
      statement: The DLL owns cleanup only below its managed captures directory, defaulting to 30 days and 10 GiB with oldest files removed first; both limits are configurable.
    - id: NFR-014
      statement: Configuration, logging, optional image persistence, and callback failures must be deterministic and represented as errors or warning flags according to this contract.
    - id: NFR-015
      statement: No throughput SLA is imposed beyond serialized operation and the per-request deadline; every algorithm must accept and honor the propagated deadline.
    - id: NFR-016
      statement: The host has no obligation to initialize COM or choose an apartment model before calling any cvforwin API.
    - id: NFR-017
      statement: No directory scan, retention sort, or retention deletion may execute synchronously on the normal cvf_inspect path.
    - id: NFR-018
      statement: Prepared algorithm assets are immutable, bounded, loaded only below the fixed config_root/assets directory, and remain alive with the recipe snapshot used by an in-flight inspection.
    - id: NFR-019
      statement: Production release evidence includes at least 1000 consecutive captures plus timeout, reconnect, orientation, and color checks on a designated Windows 10/11 UVC station.
    - id: NFR-020
      statement: Release 1.1.0 preserves C ABI v1, the exact five exports, status values, caller-owned memory, one-context semantics, static Windows packaging, and existing module dependency direction.

existing_architecture:
  summary: >-
    The implemented system follows public_c_api -> runtime_orchestrator -> camera, recipe,
    inspection, algorithm, diagnostics/artifact, and core leaf modules. CMake static component
    libraries feed one shared library; recipes select compile-time registered algorithms; a
    single runtime context serializes inspections; Windows Media Foundation is confined to the
    UVC backend; deterministic backends cover hardware-free tests; windows-2022 builds and
    verifies the release and test-enabled packages.
  preserve: true
  preserved_elements:
    - Windows-native FCT DLL purpose.
    - Native C caller, exact five exported functions, and stable C ABI v1 boundary.
    - One normal inspection invocation owns both acquisition and inspection.
    - OpenCV-oriented C++ algorithm authoring model.
    - WSL local build/test plus GitHub Actions final Windows build.
    - One live context, one configured camera, and serialized inspections.
    - Compile-time algorithm registration with strict versioned recipes and atomic catalog replacement.
    - Existing module paths, target boundaries, dependency direction, status/verdict separation, managed output roots, and one-DLL static-link package policy.
    - Test-owner independence, hash-pinned prior evidence, clean C consumer, and hardware-free mandatory CI.
  known_problems:
    - copy_packed_rows reverses row indices in addition to applying a negative pitch, contrary to IMF2DBuffer scanline0 semantics, and Lock2D uses a contiguous length that Microsoft documents as inapplicable to the Lock2D view.
    - COM is initialized only in a local enumeration scope while Media Foundation objects survive and are later used from arbitrary host calling threads.
    - One ReadCallback instance is reused across replacement SourceReader objects, allowing a retired reader's late event to mutate active callback state.
    - PNG encoding, file writing, and a full retention scan execute synchronously without a deadline-aware service; retention runs after every inspection.
    - Runtime returns immediately on algorithm or serialization failure after frame acquisition, so fail_or_error never observes execution_ok=false.
    - Configuration accepts uppercase VID/PID but enumeration produces lowercase identifiers and identity comparison is exact.
    - input_json NULL plus nonzero length is not rejected by the current request mirror.
    - Diagnostics stores warnings in a non-atomic uint32_t while reload and inspect can access it concurrently.
    - Registry estimates measurements plus defects separately, while the C API later serializes a larger wrapped object and requires an additional NUL byte.
    - The algorithm interface has validation and inspect only; no immutable recipe-preparation/resource lifecycle exists, so safe template loading and caching would otherwise require file I/O during inspect or racy mutable global/registry state.
    - Windows-only UVC conversion, apartment, timeout, and stale-callback behavior lacks deterministic component coverage; the current hardware smoke defaults to 50 captures and does not prove orientation or color.
    - .ai/workflow-state.yaml and active CVF-001 through CVF-008 descriptors still describe the completed implementation workflow and must not seed the new hardening task queue.
    - Hosted CI has no physical UVC camera, so representative hardware evidence requires a designated self-hosted or manually operated station.

